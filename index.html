<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clientes — Nord Liberta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
:root{
  --nl-orange-500:#FA7A35; --nl-orange-600:#E06600; --nl-peach-100:#FFF3EB;
  --nl-navy-900:#20344C; --nl-navy-950:#131F2E;
  --nl-gray-700:#555555; --nl-gray-500:#6B6A66; --nl-gray-300:#DDDDDD; --nl-sand:#F1EEE8; --nl-cream-50:#FDFCFA; --nl-white:#FFFFFF;
  --shadow-card:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--nl-cream-50);color:var(--nl-gray-700);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
header{background:var(--nl-navy-900);color:#fff;padding:18px 34px;display:flex;align-items:center;gap:12px}
header img{width:30px;height:30px}
header b{font:600 15px Sora,sans-serif}
header span{font-size:12.5px;color:rgba(255,255,255,.6)}
main{max-width:920px;margin:0 auto;padding:34px 34px 80px}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}
.eyebrow{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--nl-gray-500);margin-bottom:6px}
h1{font:700 28px Sora,sans-serif;color:var(--nl-navy-900);line-height:1.15}
.sub{margin-top:8px;font-size:15px;line-height:1.6;max-width:560px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:11px;padding:10px 16px;font:600 13.5px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--nl-navy-900);color:#fff}
.btn-primary:hover{background:var(--nl-navy-950)}
.btn-secondary{background:var(--nl-white);color:var(--nl-navy-900);box-shadow:inset 0 0 0 1px var(--nl-gray-300)}
.btn-secondary:hover{box-shadow:inset 0 0 0 1px var(--nl-navy-900)}
.btn-novo{background:var(--nl-orange-500);color:#fff}
.btn-novo:hover{background:var(--nl-orange-600)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.botoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn input[type=file]{display:none}
.lista{display:flex;flex-direction:column;gap:12px}
.cli{background:var(--nl-white);border-radius:16px;box-shadow:var(--shadow-card);padding:18px 22px;display:flex;align-items:center;gap:18px}
.ini{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--nl-peach-100);color:var(--nl-orange-600);display:flex;align-items:center;justify-content:center;font:600 15px Sora,sans-serif}
.cli .nome{flex:1;min-width:0}
.cli .nome b{display:block;font:600 16px Sora,sans-serif;color:var(--nl-navy-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli .nome small{display:block;margin-top:3px;font-size:12.5px;color:var(--nl-gray-500)}
.tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:9999px;background:var(--nl-sand);color:var(--nl-gray-500);font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;vertical-align:3px}
.acoes{display:flex;gap:8px}
.vazio{background:var(--nl-white);border-radius:16px;box-shadow:var(--shadow-card);padding:28px;text-align:center;line-height:1.6}
.nota{margin-top:26px;font-size:12.5px;color:var(--nl-gray-500);line-height:1.6;max-width:640px}
.tela{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--nl-white);z-index:10}
body.com-tela{overflow:hidden}
</style>
</head>
<body>
<header><img src="marca/nord-icone-negativo-64.png" alt="Nord Liberta"><div><b>Nord Liberta</b><br><span>Planejamento de vida</span></div></header>
<main>
  <div class="topo">
    <div>
      <div class="eyebrow">Área do consultor</div>
      <h1>Clientes</h1>
      <p class="sub">Escolha o cliente para ver o relatório como ele vê ou para editar o plano.</p>
    </div>
    <div class="botoes" id="botoes"><label class="btn btn-secondary" title="Um plano em JSON (o do portal, exportado, ou um que uma IA extraiu dos documentos do cliente) entra como um cliente novo">Importar JSON<input type="file" accept=".json,application/json" id="arqImportar"></label>
      <a class="btn btn-novo" id="btnNovo" href="#">+ Novo cliente</a></div>
  </div>
  <div class="lista" id="lista"><div class="vazio">Carregando os clientes…</div></div>
  <p class="nota" id="nota"></p>
</main>
<script>
// ===================== CLIENTES: a porta de entrada do protótipo =====================
// Lista os planos guardados (planos/<id> no banco do link publicado; nl-db:planos/<id> no navegador, em localhost) e
// abre as duas telas com ?cliente=<id>. Na plataforma, esta página é o /internal: o consultor escolhe o cliente e vai
// para "Área do cliente" (evolucao-patrimonial.html) ou "Montagem de relatório" (tela-consultor.html), e o cliente
// passa a vir da sessão. O "exemplo" é o plano de demonstração da Ana Ribeiro, sempre na lista.
const EXEMPLO = 'exemplo';
const escH = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dataHora = iso => { const d = new Date(iso); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' às ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
const iniciais = n => (n || '?').trim().split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('') || '?';
const url = (pagina, id, extra) => pagina + '?cliente=' + encodeURIComponent(id) + (extra || '');

// { id, nome, conjuge, em } de cada plano guardado; dono: quem abriu é o consultor (o dono do link). Na nuvem, a lista
// é ouvida: a primeira entrega pode vir do cache (até vazia), e a do servidor redesenha a lista logo depois.
async function carregar() {
  const c = window.claude && window.claude.use ? window.claude : null;
  if (c) {
    const espera = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(() => r(null), ms))]);
    let db = null, dono = true, u = null;
    try { db = await espera(c.use('db'), 8000); } catch (e) { }
    try { u = await espera(c.use('user'), 4000); if (u) dono = await u.isOwner(); } catch (e) { }
    PONTE.db = db; PONTE.user = u; PONTE.pronta();
    if (!dono) return { dono: false, planos: [] };
    if (db) {
      const doc = d => { const v = d.data() || {}, p = v.dados || {}; return { id: d.id, nome: p.name, conjuge: p.conjugeNome, em: v.em }; };
      db.collection('planos').onSnapshot(snap => desenhar({ dono: true, nuvem: true, planos: snap.docs.map(doc) }),
        () => { document.getElementById('lista').innerHTML = '<div class="vazio">Não consegui carregar os clientes. Recarregue a página.</div>'; });
      return null;   // quem desenha é a assinatura
    }
  }
  const planos = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i); if (!k || !k.startsWith('nl-db:planos/')) continue;
    try { const v = JSON.parse(localStorage.getItem(k)) || {}, p = v.dados || {}; planos.push({ id: k.slice('nl-db:planos/'.length), nome: p.name, conjuge: p.conjugeNome, em: v.em }); } catch (e) { }
  }
  return { dono: true, nuvem: false, planos };
}

function desenhar({ dono, nuvem, planos }) {
  const lista = document.getElementById('lista');
  if (!dono) {
    document.getElementById('botoes').hidden = true;
    lista.innerHTML = '<div class="vazio">Esta página é do consultor. O seu planejamento é apresentado pelo seu consultor na área logada da Nord Liberta.</div>';
    return;
  }
  // o exemplo sempre aparece, mesmo antes de ser aberto pela primeira vez; os clientes reais vêm antes, o mais recente primeiro
  const ex = planos.find(p => p.id === EXEMPLO) || { id: EXEMPLO, nome: 'Ana Ribeiro', conjuge: 'Marcos Ribeiro' };
  const reais = planos.filter(p => p.id !== EXEMPLO).sort((a, b) => String(b.em || '').localeCompare(String(a.em || '')));
  const linha = (p, exemplo) => {
    const nome = p.nome || 'Cliente sem nome', conj = p.conjuge ? ' e ' + p.conjuge.split(' ')[0] : '';
    return `<div class="cli"><div class="ini">${escH(iniciais(nome))}</div>
      <div class="nome"><b>${escH(nome + conj)}${exemplo ? '<span class="tag">exemplo</span>' : ''}</b><small>${p.em ? 'Atualizado em ' + dataHora(p.em) : 'Plano de demonstração, com dados fictícios'}</small></div>
      <div class="acoes"><a class="btn btn-secondary" href="${url('evolucao-patrimonial.html', p.id, '&consultor')}">Ver relatório</a><a class="btn btn-primary" href="${url('tela-consultor.html', p.id)}">Editar relatório</a></div></div>`;
  };
  lista.innerHTML = reais.map(p => linha(p, false)).join('') + linha(ex, true);
  document.getElementById('nota').textContent = nuvem
    ? 'Os planos ficam no banco deste link e abrem em qualquer computador com a sua conta. Só você, dono do link, vê esta lista.'
    : 'Neste computador, os planos ficam no navegador. No link publicado, ficam no banco do link e abrem em qualquer computador.';
  document.getElementById('nota').insertAdjacentHTML('beforeend', ' Para importar um plano em JSON (por exemplo, extraído por uma IA dos documentos do cliente), siga o <a href="ux/plano-exemplo.json" download="modelo-plano.json">modelo</a> e a seção "Formato do plano" do README.');
}

// novo cliente: um código novo e o plano em branco no portal; ele entra na lista quando o primeiro dado for gravado
document.getElementById('btnNovo').addEventListener('click', e => {
  e.preventDefault();
  abrir(url('tela-consultor.html', 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5)));
});

// O plano num arquivo JSON: o formato do plano (README, "Formato do plano"; o modelo é ux/plano-exemplo.json), solto ou como
// o armazém guarda ({ dados, em }). Serve para trazer um plano de outro lugar ou um que uma IA extraiu de documentos do
// cliente. Precisa de um nome; o que faltar o portal completa ao abrir. Objetivos, rendas e despesas sem id ganham um, e uma
// renda ou despesa com só o valor (value) vira uma linha mensal a partir de hoje.
function planoDoArquivo(txt) {
  let v; try { v = JSON.parse(txt); } catch (e) { throw new Error('O arquivo não é um JSON válido.'); }
  const p = v && typeof v === 'object' && v.dados && typeof v.dados === 'object' ? v.dados : v;
  if (!p || typeof p !== 'object' || Array.isArray(p) || !['name', 'incomes', 'expenses', 'objectives', 'patrimonio'].some(k => k in p)) throw new Error('O arquivo não parece um plano: faltam o nome, as rendas, as despesas, os objetivos e o patrimônio.');
  if (!String(p.name || '').trim()) throw new Error('O plano precisa do nome do cliente (o campo "name").');
  const base = Date.now().toString(36);
  [['objectives', 'obj'], ['incomes', 'inc'], ['expenses', 'cat']].forEach(([k, pre]) => {
    if (p[k] != null && !Array.isArray(p[k])) throw new Error('O campo "' + k + '" precisa ser uma lista.');
    (p[k] || []).forEach((x, i) => {
      if (!x.id) x.id = pre + base + i;
      if (k !== 'objectives' && !Array.isArray(x.steps)) x.steps = [{ from: 0, value: +x.value || 0 }];
    });
  });
  return p;
}
// importar: o plano do arquivo entra como um cliente novo, com um código novo (nunca por cima de outro), e abre no portal
document.getElementById('arqImportar').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const p = planoDoArquivo(await f.text()), id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), doc = { dados: p, em: new Date().toISOString() };
    if (PONTE.db) await PONTE.db.doc('planos/' + id).set(doc); else localStorage.setItem('nl-db:planos/' + id, JSON.stringify(doc));
    abrir(url('tela-consultor.html', id));
  } catch (err) { alert(err.message || 'Não consegui importar o arquivo.'); }
});

// ===================== PONTE: no link publicado, as telas usam o banco desta página =====================
// No link publicado, só a página principal (esta) recebe o runtime do Claude (window.claude): uma tela aberta por
// navegação fica sem banco e abre em branco. Por isso, lá, "Ver relatório" e "Editar relatório" abrem a tela num quadro
// por cima desta página, e o armazém da tela lê e grava pelo banco daqui, por mensagens (a ponte(), no armazém). A
// navegação entre as telas continua dentro do quadro; "← Clientes" fecha o quadro. Se a tela não responder (o quadro
// não carregou), ela abre na própria aba, como antes. Em localhost e na plataforma, nada disto acontece: as telas abrem
// por navegação e cada uma tem o seu armazém.
const PONTE = { db: null, user: null, subs: new Map() };
PONTE.espera = new Promise(r => { PONTE.pronta = r; });
const HOSPEDA = !!(window.claude && window.claude.use);
let QUADRO = null;
const soltaTudo = () => { PONTE.subs.forEach(u => { try { u(); } catch (e) { } }); PONTE.subs.clear(); };
function abrir(href) {
  if (!HOSPEDA) { location.href = href; return; }
  fechar();
  const q = QUADRO = document.createElement('iframe');
  q.className = 'tela'; q.src = href; q.allow = 'fullscreen'; q.title = 'Relatório';
  q.addEventListener('load', () => { try { if (/(^|\/)index\.html$/.test(q.contentWindow.location.pathname)) fechar(); } catch (e) { } });   // "← Clientes" dentro do quadro
  document.body.appendChild(q); document.body.classList.add('com-tela');
  setTimeout(() => { if (QUADRO === q && !q.dataset.falou) location.href = href; }, 8000);
}
function fechar() {
  soltaTudo();
  if (QUADRO) { QUADRO.remove(); QUADRO = null; }
  document.body.classList.remove('com-tela');
}
document.getElementById('lista').addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a || !HOSPEDA) return;
  e.preventDefault(); abrir(a.getAttribute('href'));
});
addEventListener('message', async e => {
  const m = e.data; if (!QUADRO || e.source !== QUADRO.contentWindow || !m || m.nl !== 1) return;
  const q = QUADRO; q.dataset.falou = '1';
  const responde = r => { try { q.contentWindow.postMessage(Object.assign({ nl: 1 }, r), '*'); } catch (err) { } };
  await PONTE.espera;
  if (m.t === 'ola') { soltaTudo(); responde({ t: 'ola', db: !!PONTE.db, user: !!PONTE.user }); }   // outra tela no quadro: as assinaturas da anterior saem
  else if (m.t === 'voltar') fechar();
  else if (m.t === 'ouve' && PONTE.db) {
    const meta = s => s.metadata || {};
    PONTE.subs.set(m.sub, PONTE.db.doc(m.path).onSnapshot(
      s => responde({ t: 'snap', sub: m.sub, exists: s.exists, corpo: s.exists ? s.data() : null, fromCache: !!meta(s).fromCache, hasPendingWrites: !!meta(s).hasPendingWrites }),
      err => responde({ t: 'snapErro', sub: m.sub, erro: { code: err && err.code, message: String(err && err.message) } })));
  }
  else if (m.t === 'solta') { const u = PONTE.subs.get(m.sub); if (u) { u(); PONTE.subs.delete(m.sub); } }
  else if (m.t === 'chama') {
    try {
      let valor = null;
      if (m.metodo === 'isOwner') valor = PONTE.user ? await PONTE.user.isOwner() : true;
      else if (m.metodo === 'set') await PONTE.db.doc(m.path).set(m.data);
      else if (m.metodo === 'delete') await PONTE.db.doc(m.path).delete();
      else throw { code: 'invalid_argument', message: 'método desconhecido' };
      responde({ t: 'resp', id: m.id, ok: true, valor });
    } catch (err) { responde({ t: 'resp', id: m.id, ok: false, erro: { code: err && err.code, message: String(err && err.message) } }); }
  }
});
// esta página aberta dentro do quadro ("← Clientes" numa tela): fecha o quadro e mostra a lista de baixo
const doMesmoLink = () => { try { return new URL(document.referrer).host === location.host; } catch (e) { return false; } };
if (window.parent !== window && doMesmoLink()) { try { parent.postMessage({ nl: 1, t: 'voltar' }, '*'); } catch (e) { } }

// em localhost: ?importar=<id> traz o plano de clientes/<id>/plano.json (a cópia no OneDrive) para este navegador
async function importar() {
  const id = new URLSearchParams(location.search).get('importar'); if (!id || (window.claude && window.claude.use)) return;
  try { const v = await fetch('clientes/' + encodeURIComponent(id) + '/plano.json').then(r => r.ok ? r.json() : Promise.reject(r.status)); localStorage.setItem('nl-db:planos/' + id, JSON.stringify(v)); }
  catch (e) { alert('Não encontrei clientes/' + id + '/plano.json'); }
  history.replaceState(null, '', location.pathname);
}
importar().then(carregar).then(r => { if (r) desenhar(r); }).catch(err => {
  console.error(err);
  document.getElementById('lista').innerHTML = '<div class="vazio">Não consegui carregar os clientes. Recarregue a página.</div>';
});
</script>
</body>
</html>
