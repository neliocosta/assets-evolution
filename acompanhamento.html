<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Acompanhamento — Nord Liberta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
:root{
  --nl-orange-500:#FA7A35; --nl-orange-600:#E06600; --nl-peach-100:#FFF3EB;
  --nl-navy-900:#20344C; --nl-navy-950:#131F2E; --nl-ardosia:#DCE3EC; --nl-trilho:#EEF1F5;
  --nl-gray-700:#555555; --nl-legenda:#6B6A66; --nl-borda:#E4E0D8; --nl-areia:#F1EEE8; --nl-cream-50:#FDFCFA;
  --nl-verde-texto:#22794A; --nl-verde-fundo:#E3F3E9; --nl-atencao:#964400;
  --shadow-card:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--nl-cream-50);color:var(--nl-gray-700);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--nl-orange-500);outline-offset:2px}
/* o topo da área de acompanhamento: a marca, a família e a volta para o planejamento */
.ac-topo{background:var(--nl-navy-900);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ac-topo img{width:28px;height:28px}
.ac-topo div{flex:1;min-width:0} .ac-topo b{font:600 15px Sora,sans-serif;display:block} .ac-topo span{font-size:12.5px;color:rgba(255,255,255,.65)}
.ac-topo a{color:#fff;font:600 13px 'DM Sans',sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:9999px;padding:7px 14px;white-space:nowrap}
.ac-topo a:hover{background:rgba(255,255,255,.1)}
/* as páginas de acompanhamento: hoje Semanadas; as próximas entram aqui */
.ac-nav{background:#fff;border-bottom:1px solid var(--nl-borda);padding:0 28px;display:flex;gap:4px;overflow-x:auto}
.ac-nav button{border:0;background:none;padding:13px 14px 11px;border-bottom:2.5px solid transparent;font:600 13.5px 'DM Sans',sans-serif;color:var(--nl-legenda);cursor:pointer;white-space:nowrap}
.ac-nav button[aria-current=page]{color:var(--nl-navy-900);border-bottom-color:var(--nl-orange-500)}
.ac-nav button:disabled{cursor:default;opacity:.6} .ac-nav button small{font-weight:500;margin-left:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
main{max-width:1040px;margin:0 auto;padding:30px 28px 80px}
.ac-rot{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--nl-navy-900)}
h1{font:600 30px/1.15 Sora,sans-serif;color:var(--nl-navy-900);margin-top:6px}
.ac-sub{font-size:15px;line-height:1.6;margin-top:8px;max-width:680px}
.ac-vazio{background:#fff;border-radius:16px;box-shadow:var(--shadow-card);padding:28px;margin-top:24px;line-height:1.6}
/* Semanadas: um cartão por pessoa */
.sm-c{background:#fff;border-radius:16px;box-shadow:var(--shadow-card);margin-top:22px;overflow:hidden}
.sm-cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:16px 22px;background:var(--nl-trilho)}
.sm-cab h2{font:600 17px Sora,sans-serif;color:var(--nl-navy-900)} .sm-cab h2 small{display:block;font:500 12.5px 'DM Sans',sans-serif;color:var(--nl-legenda);margin-top:2px}
.sm-ciclo{display:flex;align-items:center;gap:4px}
.sm-ciclo button{width:32px;height:32px;border:1px solid var(--nl-borda);border-radius:8px;background:#fff;font:600 16px/1 Sora,sans-serif;color:var(--nl-navy-900);cursor:pointer}
.sm-ciclo button:hover:not(:disabled){background:#FAF8F4} .sm-ciclo button:disabled{opacity:.35;cursor:default}
.sm-ciclo>span{min-width:150px;text-align:center;display:flex;flex-direction:column}
.sm-ciclo>span b{font:600 13.5px Sora,sans-serif;color:var(--nl-navy-900)} .sm-ciclo>span small{font:500 11.5px 'DM Sans',sans-serif;color:var(--nl-legenda)}
.sm-hoje{border:0;background:none;font:600 12.5px 'DM Sans',sans-serif;color:var(--nl-navy-900);text-decoration:underline;cursor:pointer;margin-left:6px}
.sm-teto{display:flex;flex-wrap:wrap;gap:6px 22px;padding:14px 22px 4px;font-size:13.5px}
.sm-teto b{font:600 15px Sora,sans-serif;color:var(--nl-navy-900)}
.sm-sem{padding:6px 22px 4px}
.sm-cols,.sm-l{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(150px,1.2fr) minmax(190px,1.3fr) minmax(170px,1.3fr);gap:14px;align-items:center}
.sm-cols{font:600 11px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--nl-legenda);padding:10px 10px 8px}
.sm-l{padding:12px 10px;border-top:1px solid var(--nl-areia);border-radius:10px}
.sm-l.hoje{background:#F3F6F9;border-top-color:transparent;box-shadow:inset 3px 0 0 var(--nl-navy-900)}
.sm-q b{display:block;font:600 14px Sora,sans-serif;color:var(--nl-navy-900)} .sm-q small{font-size:12.5px;color:var(--nl-legenda)}
.sm-q em{display:inline-block;margin-left:6px;font:600 10.5px 'DM Sans',sans-serif;font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--nl-navy-900);border-radius:9999px;padding:2px 8px;vertical-align:2px}
.sm-m small{display:block;font-size:12px;color:var(--nl-legenda)} .sm-m b{font:600 17px Sora,sans-serif;color:var(--nl-navy-900);font-variant-numeric:tabular-nums}
.sm-m s{font-size:12px;color:#9a968e;margin-left:6px}
.sm-f label{display:block;font-size:12px;color:var(--nl-legenda);margin-bottom:4px}
.sm-campo{display:inline-flex;align-items:center;border:1px solid var(--nl-borda);border-radius:9px;background:#fff;padding:0 10px;height:38px;width:100%;max-width:200px}
.sm-campo small{font-size:12.5px;color:var(--nl-legenda);margin-right:6px}
.sm-campo input{border:0;outline:0;width:100%;font:600 15px Sora,sans-serif;color:var(--nl-navy-900);background:none;font-variant-numeric:tabular-nums}
.sm-campo:focus-within{border-color:var(--nl-navy-900);outline:2px solid var(--nl-orange-500);outline-offset:1px}
.sm-f .orig{display:block;font-size:11.5px;color:#8a867e;margin-top:4px}
.sm-e{font-size:13px;line-height:1.45}
.pill{display:inline-block;border-radius:9999px;padding:4px 11px;font:600 12.5px 'DM Sans',sans-serif}
.pill.ok{background:var(--nl-verde-fundo);color:var(--nl-verde-texto)} .pill.acima{background:var(--nl-peach-100);color:var(--nl-atencao)}
.sm-e .aj b{font:600 13.5px Sora,sans-serif;color:var(--nl-navy-900)} .sm-e .aj s{color:#9a968e;margin-left:4px}
.sm-novo{margin:12px 22px 20px;padding:14px 16px;border-radius:12px;background:#FAF8F4;font-size:14px;line-height:1.6}
.sm-novo.acima{background:var(--nl-peach-100)} .sm-novo.ok{background:var(--nl-verde-fundo)}
.sm-novo h3{font:600 11px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--nl-navy-900);margin-bottom:4px}
.sm-novo strong{font:600 14px Sora,sans-serif;color:var(--nl-navy-900)}
.ac-aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--nl-navy-900);color:#fff;border-radius:10px;padding:10px 16px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (max-width:760px){
  .ac-topo,.ac-nav{padding-left:16px;padding-right:16px} main{padding:22px 16px 60px} h1{font-size:25px}
  .sm-cab,.sm-teto,.sm-sem{padding-left:14px;padding-right:14px} .sm-novo{margin-left:14px;margin-right:14px}
  .sm-cols{display:none} .sm-l{grid-template-columns:1fr 1fr;gap:10px 12px}
  .sm-q{grid-column:1/-1} .sm-e{grid-column:1/-1}
  .sm-ciclo{width:100%;justify-content:space-between} .sm-ciclo>span{flex:1;min-width:0}
}
</style>
</head>
<body>
<header class="ac-topo"><img src="marca/nord-icone-negativo-64.png" alt="Nord Liberta"><div><b>Acompanhamento</b><span id="acFamilia">Nord Liberta</span></div><a id="acPlano" href="#">Ver o planejamento</a></header>
<nav class="ac-nav" id="acNav" aria-label="Páginas do acompanhamento"></nav>
<main id="acPagina"></main>
<script id="engine">
// ===================== MOTOR DE SIMULAÇÃO (semanal, 0–100 anos) =====================
const ENGINE = (() => {
  // A linha do tempo vai do nascimento aos 100 anos; a data de nascimento (plan.nascimento) define onde está "hoje".
  // O dia em que o desenho do plano começa (plan.inicio, 'AAAA-MM-DD'; vazio = 19/09/2026, o dia em que os primeiros
  // planos foram desenhados) é o "hoje" do plano. O mês 0 é a primeira coluna do Fluxo: o mês do motor (que abre na semana
  // do dia 5) da semana de hoje (W0), e todo mês guardado no plano conta a partir dele. As semanas contam do nascimento, e a
  // de hoje pode começar uns dias antes ou depois do início: quem começa num domingo 04/10 já está na semana do dia 5 de
  // outubro, e o mês 0 é outubro (setembro teria um dia só, fora da tabela). CM0: o mês 0, em meses desde o ano 0.
  const INICIO_PADRAO = '2026-09-19';
  const dataDoInicio = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); if (!m) return null; const d = new Date(+m[1], +m[2] - 1, +m[3], 12); return d.getDate() === +m[3] ? d : null; };   // ao meio-dia: somar dias não muda a data com o horário de verão do fuso
  const cmDaData = d => d.getFullYear() * 12 + d.getMonth() - (d.getDate() < 5 ? 1 : 0);
  let TODAY = dataDoInicio(INICIO_PADRAO), CM0 = cmDaData(TODAY);
  const defineInicio = iso => { TODAY = dataDoInicio(iso) || dataDoInicio(INICIO_PADRAO); CM0 = cmDaData(TODAY); };
  const isoDe = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const WPY = 365.25 / 7, NW = Math.round(100 * WPY) + 1;
  // o mês do motor da semana i: o da última semana, até ela, que tem um dia 5
  const mesDaSemana = i => { for (let k = i; k > i - 6; k--) { const d = new Date(BIRTH.getTime() + k * 7 * 864e5); for (let j = 0; j < 7; j++) { const dd = new Date(d.getTime() + j * 864e5); if (dd.getDate() === 5) return dd.getFullYear() * 12 + dd.getMonth(); } } return cmDaData(TODAY); };
  let CURRENT_AGE = 35, BIRTH = new Date(TODAY.getFullYear() - CURRENT_AGE, TODAY.getMonth(), TODAY.getDate(), 12), W0 = Math.round(CURRENT_AGE * WPY);
  const defineIdade = a => { CURRENT_AGE = Math.min(90, Math.max(18, Math.round(+a) || 35)); BIRTH = new Date(TODAY.getFullYear() - CURRENT_AGE, TODAY.getMonth(), TODAY.getDate(), 12); W0 = Math.round(CURRENT_AGE * WPY); CM0 = mesDaSemana(W0); };
  // A data de nascimento ("AAAA-MM" ou "AAAA-MM-DD"; sem o dia, o dia 1) dá a idade exata de hoje, com fração: assim a idade
  // num marco é a de verdade (quem faz aniversário em maio já tem a idade nova em setembro). Sem a data (plano antigo), vale a
  // idade inteira de plan.age, com o aniversário em 19/09.
  const dataNasc = v => { const m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(String(v || '')); return m ? new Date(+m[1], +m[2] - 1, m[3] ? +m[3] : 1, 12) : null; };
  const idadeExata = v => { const d = dataNasc(v); return d ? (TODAY - d) / (365.25 * 864e5) : null; };
  const defineNascimento = v => { const d = dataNasc(v), a = idadeExata(v); if (!d || !(a >= 18 && a <= 90)) return false; BIRTH = d; CURRENT_AGE = a; W0 = Math.round(a * WPY); CM0 = mesDaSemana(W0); return true; };
  const NASC_EXEMPLO = '1991-05-12', NASC_CONJ_EXEMPLO = '1988-02-23';   // Ana e Marcos, no exemplo
  defineNascimento(NASC_EXEMPLO);
  const weekDate = i => new Date(BIRTH.getTime() + i * 7 * 864e5);
  const tOf = i => (i - W0) / WPY, ageOf = i => i / WPY;
  // o relógio do plano: o dia do início e, antes da idade (a de hoje é a do dia do início), o nascimento ou a idade
  const defineRelogio = plan => { defineInicio(plan.inicio); if (!defineNascimento(plan.nascimento)) { if (plan.age != null && plan.age !== '') defineIdade(plan.age); else defineNascimento(NASC_EXEMPLO); } };   // sem data nem idade, vale o padrão (não a do cliente anterior)
  // o mês 0 que o plano teria começando em iso, sem mexer no relógio em uso
  const mes0De = (plan, iso) => { const antes = [TODAY, CM0, BIRTH, W0, CURRENT_AGE]; defineRelogio(Object.assign({}, plan, { inicio: iso })); const cm = CM0; [TODAY, CM0, BIRTH, W0, CURRENT_AGE] = antes; return cm; };
  // ---- Configuração: tudo o que a tela do consultor define. Os valores abaixo são o padrão do mock. ----
  let PLAN_MODE = 'desej';
  let R_M = 0.004, GW = Math.pow(1 + R_M, 7 / 30.4375);
  // quando o dinheiro acaba, o que falta para as contas vira dívida, com os juros de plano.jurosDivida (% ao mês): 4% se
  // vazio, e o consultor pode reduzir no Fluxo vida toda. Não é o cheque especial (8% ou mais ao mês): com ele, a dívida
  // passaria dos bilhões em poucas décadas e a vida toda deixaria de se ler.
  const JUROS_DIVIDA_PADRAO = 4;
  let JUROS_DIVIDA_M = JUROS_DIVIDA_PADRAO / 100;   // cobrados uma vez por mês, sobre o que ficou em aberto no fim do mês
  // Regra de negócio: a dívida para de crescer quando chega a 100 vezes a renda mensal da família (a média dos próximos 12
  // meses, a mesma renda do Orçamento). Daí em diante ela fica travada: sem juros e sem o que faltar a mais. Sem renda, sem teto.
  const TETO_DIVIDA_VEZES = 100;
  let PART_VALUE = 50000;   // participações societárias: o valor de hoje (a valorização e a venda vêm de cada participação)
  let LIFE_EXP = 95, DESIRED = 25000, SALARY = 15000, SAL_G = 0.045;
  let DESIRED_STEPS = [];      // mudanças da renda desejada a partir de um mês: [{ from, value }]
  const desiredAt = mi => { let v = DESIRED; for (const s of DESIRED_STEPS) if (mi >= s.from) v = +s.value || 0; return v; };
  let INITIAL_WEALTH = 860000; // patrimônio financeiro do cliente hoje, informado pelo consultor
  let CAP_OVERRIDE = null;     // capacidade de poupança informada pelo cliente, se ele disser um valor próprio
  let INITIAL_BENS = 1210000;  // imóveis e outros bens de hoje (não financeiros)
  let DIVIDAS = 0;             // saldo devedor dos bens e das outras dívidas (patrimonio.bens, patrimonio.dividas)
  let RETIRE_AGE = 57;         // idade em que o titular para de trabalhar (obrigatória no portal; a do exemplo); vazia, num plano antigo, = assim que o patrimônio sustentar a renda
  let SPOUSE_AGE = idadeExata(NASC_CONJ_EXEMPLO), SPOUSE_RETIRE = 62;   // casal: a idade do cônjuge hoje e a idade em que ele para (as do exemplo); fora de um casal, vazias

  // Perfis de investimento do dinheiro dedicado a cada objetivo (retorno real líquido ao mês)
  const PROFILES = { conservador: 0.004, moderado: 0.005, agressivo: 0.006 };
  // Objetivos configurados na tela do consultor (somente leitura aqui).
  // Todos têm a mesma estrutura; campos sem valor ficam em 0 / null e o card mostra "—".
  const OBJ = [
    { id: 'fortaleza', photo: 'fotos/fortaleza.jpg', name: 'Viagem a Fortaleza', descricao: 'Uma semana de descanso, todos juntos, longe da rotina', icon: 'sun', kind: 'consumo', milestone: true, title: 'Viagem a Fortaleza realizada!', diagnostico: { presente: 'meta', futuro: 'caminho' },
      months: 20, amount: 12000, recurring: null,
      dedicated: 3000, profile: 'conservador', planned: 450,
      strategy: 'Viagem de 7 dias para quatro pessoas em maio, fora da alta temporada, com passagens compradas com seis meses de antecedência. O valor fica em renda fixa de liquidez diária, porque o prazo é curto e a data é inegociável.' },

    { id: 'casa', photo: 'fotos/casa.jpg', name: 'Casa própria', descricao: 'Sair do aluguel e ter um lugar que seja da família', icon: 'home', kind: 'bem', milestone: true, title: 'Casa própria realizada!', diagnostico: { presente: 'meta', futuro: 'caminho' },
      months: 46, amount: 180000, preco: 600000, compra: { modo: 'financiamento', sistema: 'sac', parcelas: 420, juros: 11, iof: 'isento', label: 'Financiamento da casa própria' },
      dedicated: 45000, profile: 'moderado', planned: 1500,
      strategy: 'Para a compra do apartamento de R$ 600 mil, será dada uma entrada de R$ 180 mil e financiados os R$ 420 mil restantes pelo SAC, em 420 meses, com parcela inicial de cerca de R$ 4.700 por mês, que cai a cada mês. Para conseguir o crédito, a renda declarada da família precisa ser de cerca de R$ 15.600 por mês, o que está dentro da realidade. O aporte atual não fecha a entrada integral: a diferença sai da reserva ou a data é adiada em alguns meses.' },

    { id: 'europa', photo: 'fotos/europa.jpg', name: 'Viagem à Europa em família', descricao: 'Mostrar o mundo aos filhos e criar memórias que ficam para sempre', icon: 'plane', kind: 'consumo', milestone: true, title: 'Viagem à Europa realizada!', diagnostico: { presente: 'sonho', futuro: 'caminho' },
      months: 60, amount: 60000, recurring: null,
      dedicated: 18000, profile: 'moderado', planned: 300,
      strategy: 'Roteiro de 21 dias por Itália e França para a família, no verão europeu, com passagens e hospedagem parceladas no semestre anterior. Sem custo recorrente depois. O aporte definido não fecha o valor cheio: a diferença sai da reserva no ano da viagem ou o roteiro é encurtado.' },

    { id: 'intercambio', photo: 'fotos/intercambio.jpg', name: 'Intercâmbio do filho', descricao: 'Abrir o mundo para ele antes da faculdade', icon: 'grad', kind: 'consumo', milestone: true, title: 'Intercâmbio do filho realizado!', diagnostico: { presente: 'sonho', futuro: 'caminho' },
      months: 96, amount: 150000, recurring: null,
      dedicated: 20000, profile: 'moderado', planned: 150,
      strategy: 'Um ano de intercâmbio acadêmico no exterior, com moradia e seguro incluídos, quando o filho tiver 18 anos. Como a capacidade mensal de poupança está comprometida com a casa própria, este objetivo recebe um aporte simbólico até 2030 e precisa ser revisto quando a entrada do imóvel sair do caminho. Sem essa revisão, a maior parte virá da reserva.' },

    { id: 'praia', name: 'Casa de praia', descricao: 'Um lugar para reunir a família nos fins de semana e nas férias', icon: 'palm', kind: 'bem', milestone: true, title: 'Casa de praia realizada!', diagnostico: { presente: 'sonho', futuro: 'meta' },
      months: 132, amount: 300000, recurring: { value: 800, months: null, label: 'Condomínio e IPTU da casa de praia', amort: 0 },
      dedicated: 25000, profile: 'agressivo', planned: 100,
      strategy: 'Compra à vista de uma casa no litoral norte, sem financiamento, depois que o intercâmbio estiver pago. O valor migra de patrimônio financeiro para bens, sem perda de patrimônio total. A partir da compra entram condomínio e IPTU de R$ 800 por mês, por tempo indeterminado. O aporte atual é simbólico: o objetivo só fecha se receber a folga que aparece depois do intercâmbio, e por isso está marcado para revisão.' },
  ];
  // Campos derivados: aporte necessário, projeção na data alvo e status.
  // Recalculado sempre que a data alvo muda (o cliente pode arrastar o marco na tela).
  // Um objetivo desligado (ligado: false) fica no plano, com os valores, mas fora da simulação, da política e da área do
  // cliente: o consultor liga um por vez, na Política de investimentos, e a tela confere se o fluxo de caixa comporta.
  // Sem o campo, o objetivo está ligado (os planos de antes já tinham todos na simulação); os novos nascem desligados.
  const ligado = o => !!o && o.ligado !== false;
  const temValor = o => +o.amount > 0 || !!(o && o.kind === 'bem' && o.compra && o.compra.modo);
  const objetivosLigados = plan => (plan.objectives || []).filter(ligado);
  // Quando o objetivo começa a receber: os aportes mensais a partir de aporteDe e o patrimônio separado (dedicated) em
  // dedicadoEm, em meses a partir de hoje (vazio = hoje). Assim o consultor dá toda a sobra a um objetivo e só depois
  // começa a guardar para os outros. O aporte começa até o mês antes da data; o patrimônio, até a data.
  // a expectativa de vida (lifeExp) é a da pessoa mais jovem da família; na idade do titular, que é a escala do motor, soma a diferença
  const vidaAte = () => LIFE_EXP + (SPOUSE_AGE != null && SPOUSE_AGE < CURRENT_AGE ? CURRENT_AGE - SPOUSE_AGE : 0);
  const inicioDoAporte = o => Math.max(0, Math.min(Math.max(0, Math.round(+o.months || 0) - 1), Math.round(+o.aporteDe || 0)));
  const inicioDoDedicado = o => Math.max(0, Math.min(Math.round(+o.months || 0), Math.round(+o.dedicadoEm || 0)));
  // A estratégia de cada objetivo segue o prazo: nos últimos 24 meses antes da data (MESES_CONSERVADOR), a caixinha fica na
  // conservadora, e o dinheiro rende a taxa dela; antes disso, a estratégia escolhida (o.profile, ou a taxa digitada, o.rateM).
  // O objetivo a menos de 24 meses já começa na conservadora. A taxa é um número (a mesma em todos os meses) ou a taxa de

<script id="armazem">
// ===================== ARMAZÉM: onde o plano e a proposta ficam =====================
// O consultor grava o plano; o cliente lê o plano e grava a proposta; o consultor responde. Cada um do seu
// computador. Na área logada da Nord Liberta isto é a API da plataforma; no protótipo há dois modos:
//   nuvem  o banco compartilhado do link publicado no Claude (claude.use('db')): consultor e cliente abrem o
//          mesmo link, cada um na sua máquina, e veem as mudanças do outro na hora. Quem é dono do link é o
//          consultor; quem recebeu o link compartilhado (como Contribuidor) é o cliente.
//   local  sem esse banco (localhost): o armazenamento do navegador, com as duas telas no mesmo computador.
// A cópia local também guarda o último estado, para a tela abrir na hora enquanto a nuvem responde.
// Cada cliente tem o seu plano e a sua proposta (planos/<id> e propostas/<id>). O cliente vem no endereço
// (?cliente=<id>), posto pela página Clientes (index.html); sem ele, a tela volta para lá. Na plataforma, o cliente
// vem da sessão (escolhido no /internal) e este bloco inteiro é trocado pelo armazém dela, com a mesma interface.
const ARMAZEM = (() => {
  const CLIENTE = typeof location !== 'undefined' ? new URLSearchParams(location.search).get('cliente') : 'teste';
  if (!CLIENTE) { location.replace('index.html'); }
  // o realizado (o que a família lança no acompanhamento: hoje, quanto está a fatura de cada semana) fica à parte do plano,
  // em realizados/<id>, com a origem de cada lançamento (manual ou, depois, open banking): o plano nunca muda com ele
  const CHAVE = { plano: 'nl-plano', proposta: 'nl-proposta', versoes: 'nl-versoes', realizado: 'nl-realizado' }, DOC = { plano: 'planos/' + CLIENTE, proposta: 'propostas/' + CLIENTE, versoes: 'versoes/' + CLIENTE, realizado: 'realizados/' + CLIENTE };
  const ouvintes = { plano: [], proposta: [], versoes: [], realizado: [] }, ultimo = {}, visto = {};
  let db = null, info = null;
  // a cópia de trabalho deste navegador (nl-plano, nl-proposta, cenários, páginas vistas) é de um cliente só: outro
  // cliente começa dela limpa. Sem a nuvem (localhost), cada cliente guarda o seu plano em nl-db:<documento>.
  const DB_LOCAL = k => 'nl-db:' + DOC[k];

    if (CLIENTE && localStorage.getItem('nl-cliente') !== CLIENTE) {
      ['nl-plano', 'nl-proposta', 'nl-versoes', 'nl-realizado', 'nl-cenarios', 'nl-vistas', 'nl-fase'].forEach(k => localStorage.removeItem(k));

      localStorage.setItem('nl-cliente', CLIENTE);
    }
  } catch (e) { }
  // O último estado fica também na memória da página: no link publicado o localStorage pode não existir (o acesso falha
  // ou não guarda), e sem esta cópia a tela receberia "sem plano" mesmo com o plano já lido do banco.
  const memoria = {};
  const lerLocal = k => { if (k in memoria) return memoria[k] == null ? null : JSON.parse(memoria[k]); try { return JSON.parse(localStorage.getItem(CHAVE[k]) || 'null'); } catch (e) { return null; } };

        }

            await new Promise(pronto => {

                const m = snap.metadata || {};

                // "não existe" vindo do cache não é confiável (o cache pode só não ter o documento ainda): espera o servidor.
                // Um documento que existe vale já, venha de onde vier; o servidor não reentrega um documento igual.

      if (!visto[k]) { const e = new Error('o armazém ainda não leu este cliente'); e.code = 'nao_lido'; throw e; }

      catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); if (v == null) await ref.delete(); else await ref.set({ dados: v, em: new Date().toISOString() }); } else throw e; }
    },

  };
})();

<script>

// Uma área à parte do relatório (SEMANADAS.md, etapa 3): o que foi planejado ao lado do que de fato aconteceu. Cada página
// é uma entrada de PAGINAS_AC (o id, o título e a função que desenha); hoje, as Semanadas; o Orçamento mensal vem depois
// (etapa 4), e as próximas entram na mesma lista. O plano é a última versão publicada (o que a família vê no relatório) ou,
// sem ela, o plano do consultor. O realizado fica no armazém, à parte do plano (ARMAZEM 'realizado', realizados/<id>):
// uma lista de lançamentos, cada um com a origem ('manual' hoje; 'openbanking' depois). O que vale para uma semana é o

function smCartao(p, casal) {
  const h = isoDe(new Date()), iHoje = smHoje(p), i = SM_CICLO[p.quem] != null ? SM_CICLO[p.quem] : iHoje, c = p.ciclos[i];
  const lanc = c.semanas.map(s => lancamentoDa(p.quem, c.chave, s.n)), A = ENGINE.acompanhaSemanada(c, lanc.map(l => l ? l.fatura : null));
  const rot = c.de <= h && h <= c.ate ? 'o ciclo de hoje' : c.ate < h ? 'um ciclo que já passou' : i === iHoje + 1 ? 'o próximo ciclo' : 'daqui a ' + (i - iHoje) + ' ciclos';
  const quando = l => { const d = new Date(l.em); return (l.origem === 'openbanking' ? 'pelo open banking' : 'lançado à mão') + ' em ' + d.getDate() + '/' + MESES[d.getMonth()] + ', ' + String(d.getHours()).padStart(2, '0') + 'h' + String(d.getMinutes()).padStart(2, '0'); };
  const linha = (s, j) => { const agora = s.de <= h && h <= s.ate, l = lanc[j], ate = diaMes(s.ate);
    const estado = s.fatura != null ? (s.estado === 'acima' ? `<span class="pill acima">${fmt(s.diferenca)} acima do marco</span>` : `<span class="pill ok">${s.folga > 0.5 ? fmt(s.folga) + ' de folga' : 'no marco'}</span>`)
      : `<span class="aj">Para gastar na semana: <b>${fmt(s.ajustavel)}</b>${Math.abs(s.ajustavel - s.ajustavelPlano) > 0.5 ? `<s>${fmt(s.ajustavelPlano)}</s>` : ''}</span>`;
    return `<div class="sm-l${agora ? ' hoje' : ''}"${agora ? ' aria-current="date"' : ''}>
      <div class="sm-q"><b>Semana ${s.n}${agora ? '<em>esta semana</em>' : ''}</b><small>${diaMes(s.de)} a ${ate}</small></div>
      <div class="sm-m"><small>até ${ate}, a fatura em até</small><b>${fmt(s.marco)}</b>${s.mudou ? `<s>${fmt(s.marcoPlano)}</s>` : ''}</div>
      <div class="sm-f"><label for="smF-${p.quem}-${s.n}">Quanto está a fatura</label><span class="sm-campo"><small>R$</small><input id="smF-${p.quem}-${s.n}" inputmode="decimal" autocomplete="off" placeholder="—"
        data-sm-fatura="${p.quem}|${c.chave}|${s.n}" value="${l ? Math.round(l.fatura).toLocaleString('pt-BR') : ''}"${l && l.origem === 'openbanking' ? ' readonly' : ''}></span>${l ? `<small class="orig">${quando(l)}</small>` : ''}</div>
      <div class="sm-e">${estado}</div></div>`; };
  const N = A.novo, resto = N ? A.semanas.slice(N.semana) : [];
  const novo = !N ? `<div class="sm-novo"><h3>O novo alvo</h3>Informe quanto está a fatura no fim de uma semana: a tela mostra a folga ou o novo valor das semanas seguintes.</div>`
    : N.estado === 'dentro' ? `<div class="sm-novo ok"><h3>Dentro do combinado</h3>Na semana ${N.semana}, a fatura está ${N.folga > 0.5 ? `<strong>${fmt(N.folga)}</strong> abaixo do marco` : 'no marco'}. Os marcos das semanas seguintes ficam como estavam.</div>`
    : `<div class="sm-novo acima"><h3>O novo alvo</h3>Na semana ${N.semana}, a fatura passou <strong>${fmt(N.diferenca)}</strong> do marco. ${resto.length ? `O teto do ciclo continua <strong>${fmt(A.total)}</strong>: o excesso sai do que resta para gastar nas semanas seguintes, na proporção de cada uma. ${resto.map(s => `Semana ${s.n}: <strong>${fmt(s.ajustavel)}</strong> para gastar (eram ${fmt(s.ajustavelPlano)}), marco de <strong>${fmt(s.marco)}</strong>`).join('; ')}.` : ''}
        ${A.fechaAcima > 0.5 ? ` ${resto.length ? 'O excesso passa de tudo o que restava para gastar' : 'Era a última semana do ciclo'}: o ciclo fecha em <strong>${fmt(A.fecha)}</strong>, <strong>${fmt(A.fechaAcima)}</strong> acima do teto.` : ''}</div>`;
  return `<section class="sm-c" data-sm="${p.quem}" aria-labelledby="smH-${p.quem}">
    <div class="sm-cab"><h2 id="smH-${p.quem}">Cartão${casal ? ' de ' + escH(p.nome) : ''}<small>a fatura vira no dia ${p.dia}</small></h2>
      <div class="sm-ciclo" role="group" aria-label="Ciclo da fatura"><button type="button" data-sm-mv="-1" aria-label="Ciclo anterior"${i === 0 ? ' disabled' : ''}>‹</button>
        <span aria-live="polite"><b>${diaMes(c.de)} a ${diaMes(c.ate)}</b><small>${rot}</small></span>
        <button type="button" data-sm-mv="1" aria-label="Próximo ciclo"${i === p.ciclos.length - 1 ? ' disabled' : ''}>›</button>${i !== iHoje ? '<button type="button" class="sm-hoje" data-sm-hoje>hoje</button>' : ''}</div></div>
    <div class="sm-teto"><span>Teto da fatura no ciclo <b>${fmt(c.total)}</b></span><span>${fmt(c.base)} já contratados e ${fmt(c.ajustavel)} para gastar</span></div>
    <div class="sm-sem"><div class="sm-cols" aria-hidden="true"><span>Semana</span><span>Marco</span><span>Realizado</span><span>Situação</span></div>${A.semanas.map(linha).join('')}</div>
    ${novo}</section>`;
}
function renderSemanadas(el) {
  const r = ENGINE.semanadasDoPlano(PLANO), casal = r.cartoes.length > 1 || r.pessoas.length > 1;
  el.innerHTML = `<div class="ac-rot">Acompanhamento</div><h1>Semanadas</h1>
    <p class="ac-sub">No fim de cada semana, confira quanto está a fatura do cartão e anote aqui. Abaixo do marco, sobra folga; acima, o excesso sai das semanas seguintes, e o teto do ciclo continua o mesmo.</p>
    ${r.cartoes.length ? r.cartoes.map(p => smCartao(p, casal)).join('') : '<div class="ac-vazio">O seu consultor ainda não combinou as semanadas: falta o dia em que a fatura de cada cartão vira.</div>'}`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-sm-mv],[data-sm-hoje]'), sec = t && t.closest('[data-sm]'); if (!sec) return;
  const q = sec.dataset.sm, p = ENGINE.semanadasDoPlano(PLANO).cartoes.find(x => x.quem === q); if (!p) return;
  const i = SM_CICLO[q] != null ? SM_CICLO[q] : smHoje(p);
  SM_CICLO[q] = t.dataset.smHoje != null ? null : Math.max(0, Math.min(p.ciclos.length - 1, i + +t.dataset.smMv));
  desenha(); const b = document.querySelector(`[data-sm="${q}"] ${t.dataset.smMv ? `[data-sm-mv="${t.dataset.smMv}"]` : '[data-sm-mv]'}`); if (b) (b.disabled ? document.querySelector(`[data-sm="${q}"] [data-sm-mv]:not(:disabled)`) : b).focus();
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.smFatura) return;
  const [q, ciclo, n] = t.dataset.smFatura.split('|'), v = lerReais(t.value), atual = lancamentoDa(q, ciclo, +n);
  if (Number.isNaN(v)) { avisar('Digite o valor da fatura em reais, como 4.700.'); t.value = atual ? Math.round(atual.fatura).toLocaleString('pt-BR') : ''; return; }
  if ((atual ? atual.fatura : null) === v) return;
  lanca(q, ciclo, +n, v);
  const prox = document.getElementById(`smF-${q}-${+n + 1}`); if (prox) prox.focus();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.smFatura) e.target.blur(); });

// ---------- as páginas e o desenho ----------
const PAGINAS_AC = [{ id: 'semanadas', titulo: 'Semanadas', render: renderSemanadas }, { id: 'orcamento-mensal', titulo: 'Orçamento mensal', emBreve: true }];
let PAG = (PAGINAS_AC.find(p => p.id === new URLSearchParams(location.search).get('pagina') && !p.emBreve) || PAGINAS_AC[0]).id;
function desenha() {
  // o foco e o que estava sendo digitado sobrevivem ao redesenho (outra aba ou o banco podem redesenhar no meio)
  const f = document.activeElement, id = f && f.id, val = f && f.tagName === 'INPUT' ? f.value : null;
  document.getElementById('acNav').innerHTML = PAGINAS_AC.map(p => `<button type="button" data-ac-pag="${p.id}"${p.id === PAG ? ' aria-current="page"' : ''}${p.emBreve ? ' disabled' : ''}>${p.titulo}${p.emBreve ? '<small>em breve</small>' : ''}</button>`).join('');
  const el = document.getElementById('acPagina');
  if (!PLANO) { el.innerHTML = '<div class="ac-vazio">O planejamento desta família ainda não foi publicado.</div>'; return; }
  PAGINAS_AC.find(p => p.id === PAG).render(el);
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); if (val != null && n.value !== val && document.activeElement === n) n.value = val; } }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-ac-pag]'); if (!b || b.disabled) return; PAG = b.dataset.acPag; const u = new URL(location.href); u.searchParams.set('pagina', PAG); history.replaceState(null, '', u); desenha(); });
function aplicaPlano() {
  PLANO = planoAtual();
  if (PLANO) { ENGINE.configure(structuredClone(PLANO)); const nm = ENGINE.nomesDaFamilia(PLANO); document.getElementById('acFamilia').textContent = [nm.titular, nm.conjuge].filter(Boolean).join(' e ') || 'Nord Liberta'; }
  desenha();
}
document.getElementById('acPlano').href = 'evolucao-patrimonial.html?cliente=' + encodeURIComponent(CLIENTE || '');
aplicaPlano();
ARMAZEM.ouvir('plano', aplicaPlano); ARMAZEM.ouvir('versoes', aplicaPlano); ARMAZEM.ouvir('realizado', desenha);
ARMAZEM.iniciar().then(aplicaPlano);
</script>
