<!doctype html>
<html lang="pt-BR">
<!--
  MOCK NAVEGÁVEL DA ÁREA LOGADA DO CLIENTE (Nord Liberta) · area-logada/mock/index.html
  Gerado a partir de area-logada/PROMPT-MOCK.md e UX.md (24/10/2026). Arquivo único, sem bibliotecas além das fontes.
  Estrutura do script: parâmetros do produto (PRODUTO) → utilidades → as seis situações (montaPadrao lê o JSON
  embutido; as outras saem do clientes-teste.md e do prompt) → estado global S e roteador → uma função por tela.

  DECISÕES TOMADAS ONDE O UX.md NÃO DECIDIA (para PENDENCIAS.md)
   1. Reserva do Padrão: com as regras do portal (ideal = custo de vida de 12 meses × 8 meses, CLT 5 + dependente 3;
      mínima 40%, aceitável 70%), o JSON dá R$ 60 mil em D+0 contra uma mínima de R$ 40,9 mil. A mínima já está
      cumprida, então o passo atual é a reserva ACEITÁVEL (ainda em Construir, porque o critério "3 meses seguidos de
      aporte" não está cumprido: setembro teve falta). Na Clínica do Padrão, o foco é a reserva ideal, por remanejamento.
   2. Versões do plano: com outubro de 2026 como mês de referência, novembro ainda é futuro. Usei "plano de 19/03/2026"
      (apresentação) e "plano ajustado em 19/09" (o dataRelatorio do JSON, na reunião semestral) no lugar de abril e 8/11.
   3. A consultora é a Patrícia Lemos em todas as situações (o JSON traz Carolina Andrade), para bater com o prompt.
   4. Nomes: Sobreviver = Diego; Começar a sobrar = Bruno (para não haver dois Rafaéis); empresa fictícia Transportes
      Aurora, programa "Viver Bem com o Dinheiro". Fila do consultor com clientes inventados.
   5. Liberdade: conta simplificada do mock (perpetuidade da renda desejada menos o INSS líquido, à taxa real do plano;
      base = financeiro − dedicado aos objetivos − reserva). No produto, sai do motor.
   6. O exame do Padrão é inventado (nota 64 em jan/2026, 71 em set/2026, e os cinco pilares).
   7. "Hoje" é 20/10/2026. Semanas de outubro: 1–4, 5–11, 12–18, 19–25, 26–31. Teto do mês = ajustáveis − o corte
      combinado no JSON (R$ 900) = R$ 5.300, repartido pelos dias de cada semana.
   8. O aporte de outubro do Padrão fica sem resposta (atrasado) para mostrar Fiz e Não fiz. Setembro: a Europa faltou
      (outubro seria a segunda falta seguida), o Intercâmbio foi coberto pela Casa de praia e a Casa de praia foi
      ajustada ao que coube (R$ 60, "cumprido na nova meta").
   9. Aporte do mês com vários objetivos: o "Não fiz" mostra o efeito objetivo a objetivo (curto, longo, dívida, reserva)
      e a saída escolhida vale para o conjunto. "Ajustar ao que coube" pergunta quanto cabe (sugere 60%).
  10. Saídas fora do dinheiro: reserva e colchão (fazer depois, ajustar, resgatar agora); comportamental (manter o
      teto do mês, ajustar o teto); burocrática e interação (nova data, pedir ajuda); educacional (só a nova data).
  11. Status no desktop: alternador Bolhas | Radar | As duas lado a lado, com a lista abaixo. O peso das bolhas é um
      valor por vertical atribuído à mão (o quanto ela pede por mês); no produto precisa de regra.
  12. Cadastrado do Padrão: um objetivo (Casa própria, criado pela Ana) e as quatro verticais do exame.
  13. Plano em montagem = Ana e Marcos logo depois do contrato (06/10), coleta em 15/10, apresentação em 12/11: o que
      tinham como Cadastrado continua lá.
  14. Casal: custo de vida montado do perfil 1 (R$ 8.600, sobra R$ 4.400); aportes calculados a 0,4% a.m. e repartidos
      pela ordem de prioridade; reserva = custo × 5 (CLT, sem dependentes ainda).
  15. Sobreviver: só o rotativo (o cheque especial e o consignado da persona ficaram de fora); parcela = a sobra
      (R$ 600); a renegociação mira 3% a.m.
  16. O contador de mensagens do mês é calculado da agenda da situação (aporte, segundas, vésperas, repetição,
      fechamento) e mostrado contra a faixa de 10 a 15.
  17. Criar a conta leva ao Cadastrado: Padrão (só eu), Casal (nós dois) ou Começar a sobrar (programa da empresa).
  18. A "conta dos 300" foi lida como: renda mensal desejada × 300.
  19. O quadro de desktop (1280 px) é reduzido para caber na janela; o celular fica em 390 × 844.

  DÚVIDAS QUE SURGIRAM
   - A faixa de 10 a 15 mensagens é teto ou alvo? Quando a agenda dá menos de 10, o sistema completa?
   - O passo "reserva mínima" do prompt não bate com o JSON (já cumprida): mudar o JSON de exemplo ou aceitar a aceitável?
   - Versões "abril e novembro" contra o mês de referência outubro: qual data vale para a demonstração?
   - De onde sai, no produto, o peso de cada vertical no mapa de bolhas?
   - Qual é o texto oficial de como a Nord é remunerada (está como "pelo planejamento e pela clínica contratados")?
   - No Cadastrado, onde o cliente vê as versões que os ajustes diretos criaram? (Hoje só no histórico da tarefa.)
   - A liberdade é objetivo em todos os degraus, mas o Cadastrado do Padrão não tem o número definido: deve aparecer
     como convite no passo ou como objetivo vazio?
   - No casal com o salário dos dois no mesmo dia, o lembrete do aporte vai aos dois ou ao responsável escolhido?
   - Semanas parciais do teto (1 a 4/10): cortar pela semana do calendário ou pelo dia do salário?
   - O acesso de uso único confirmado por código (escolha de saída pelo WhatsApp): o código vai por WhatsApp ou SMS?

  O QUE FICOU DE FORA OU SIMPLIFICADO
   - Só a calculadora da liberdade (entrada) e a de taxa (Utilitários) calculam; as outras mostram um aviso.
   - O livro tem o sumário com a barra de vistos e uma página (Objetivos); o exame da entrada tem 4 perguntas.
   - Gravar numa calculadora do Status registra no histórico, mas não recalcula os outros números.
   - Editar a tarefa e o lembrete só confirmam; o horizonte do Realizado não muda os gráficos (há 3 meses de dado).
   - O estado das respostas vive só na memória da página (recarregar volta ao início).

  CORREÇÕES DE 25/10 (avaliações de 24/10: síntese T1 a T9, os 8 padrões de clareza e o Painel redesenhado)
   Painel: cabeçalho com ícone de conversa e contador (título nunca trunca); propósito numa linha pequena; o aviso
   "pedem X; sobram Y" virou chip no fim da faixa; o cartão do passo é o maior elemento ("O passo agora", número
   grande em Sora com barra, uma linha de contexto, pílula); origem e "por que importa" foram para a tela do passo;
   sem animação de opacidade; UMA tarefa só (a vencida ou de hoje, "atrasada há N dias", o cartão inteiro abre a
   folha) e "mais N nesta semana ›"; os quatro números numa fila (no celular empilham 2 a 2 quando não cabem; no
   desktop ficam no alto da esquerda, e a direita tem passo e encontro); o Ritmo numa linha-número com mini barra;
   a pílula do encontro sem rótulo.
   T1/T2: sugestaoTeto = o que resta ÷ semanas restantes, nunca acima do teto da semana nem do que resta; semana
   atual = 4 (SEMANA_ATUAL); respostas do teto: Fiquei dentro / Passei / Informar o valor (valor obrigatório);
   Antes/Depois em teto por semana; as semanas seguintes recebem o novo teto (o gráfico acompanha); linha "gasto
   ajustável" com exemplos. "Passei" sem valor conta a semana atual no teto, ao menos.
   T3: "Desfazer" no toast do Fiz, Fiz parte, Não fiz, Adiar, dos desfechos da fila e do Tratei (fotoTarefa guarda a
   tarefa, os objetivos, as semanas do teto e as conversas); 6 s sem desfazer, 8 s com; toast em toda a largura no
   celular. Desfazer desfaz o último passo (depois de "Informar o valor" + "Manter o teto", volta só o teto).
   T4: "Os objetivos juntos" mostra a divisão vigente (o aporte de cada um) e a ordem por prioridade só como
   simulação rotulada; "Mudar" mostra a data do plano com "no ritmo de hoje" ao lado; setembro do Completo tem a
   divisão da versão de então (1.200/450/600/150/100) e "Como está indo" diz quando o aporte do mês foi parcial;
   o WhatsApp lê a tarefa do dia (versão curta inclusive), o fechamento só fala de avanço com aporte feito e a
   página do "Não fiz" fica presa ao id da tarefa do link. Aluguel × financiamento: o apartamento de Mogi passou a
   "alugado a terceiros; o aluguel paga a parcela" (a opção mais simples: nenhum número do plano muda).
   T5: situações "Cadastrada pela postagem" (Juliana; lê a calculadora da entrada quando usada, senão 31 anos,
   R$ 7 mil, R$ 400/mês, R$ 12 mil; Painel quase vazio, liberdade "a confirmar") e "Clínica pela empresa" (Rafael,
   R$ 4.200, zero a zero, "O que combinamos em 12/09"). Criar a conta pela postagem leva à primeira; pela empresa,
   a "Começar a sobrar", que sobe à segunda ao trocar o degrau para Clínica.
   T6: os campos do cadastro e do registro da clínica guardam o valor ao redesenhar; sem e-mail ou celular não cria;
   o celular do login serve ao WhatsApp (o campo extra só aparece quando o login é e-mail).
   T7: herdar() ao trocar o degrau na mesma situação: respostas desta sessão, tarefas abertas e o realizado
   (dedicado e sobra) seguem; se o alvo da reserva muda, "o alvo da reserva mudou na clínica de 12/09: de X para Y".
   T8: fila em 1 coluna; "Ver antes e depois" abre no cartão e "Aprovar" só habilita depois; desfechos Aprovei /
   Ajustei / Recusei / Respondi / Agendei mudam o estado que o cliente vê em Conversas; "Tratei" virou link; um botão
   por ação; aporte atrasado, falta estrutural de sobra e os ajustes/propostas aguardando entram na fila a partir
   dos dados de Ana e Marcos (filaDinamica); "ver como o cliente" em cada cartão; Responder grava em Conversas; o
   rascunho da reunião lê o que mudou, as atrasadas e as pendentes. O item f6 passou a ser a monitoria de 27/10 de
   Ana e Marcos (para o rascunho ler dados que existem).
   T9: registrar a clínica começa por cliente e data; o rascunho vive em S.consultor.cc.rasc; a prévia (tarefas,
   lembretes e mensagem) nasce do alvo e recalcula a cada mudança; lembrete que cai no passado é avisado; Publicar
   pede confirmação com resumo ("N focos · N tarefas · 1 mensagem") e o publicado passa a ser o que o cliente lê em
   "O que combinamos" (orientações, temas, tarefa do resgate e alvo da reserva).
   Padrões 1 a 8: explicações para o rodapé (visitante, Plano, Utilitários, Conversas, Realizado, fila); texto de
   protótipo fora do cliente (frase sugerida/foto opcional, "ver como fica quando abre", "simular a aprovação",
   "motor", "bloco 11"; origem e versão só no toque); rótulos sem numeração e sem repetição (objetivo, clínica,
   Conteúdos, reserva da clínica); chip de estado com a razão em até cinco palavras e a linha "Resolve: …"; número
   grande primeiro (calculadora da liberdade com a resposta no alto e premissas recolhidas; "Não fiz" com efeito
   somado + saída sugerida em destaque + "ver por objetivo"; Realizado com um cartão-resumo por lente, abrindo em
   folha; Jornada com os três números no alto); um primário por tela e o cartão como alvo (Utilitários, tarefas,
   calculadoras, Objetivos com "Criar um objetivo" em pílula); Tarefas abre pela vencida/de hoje, aviso de uma
   linha que some ao tocar, propostas recolhidas, filtros em "Filtrar", placar no fim; a adiada volta para a lista
   na data nova; cabeçalho que cabe.
   Premissas tomadas onde os documentos não decidiam: (a) as 12 colunas do Ritmo saíram do Painel e não foram
   duplicadas no Realizado, que já tem o gráfico por mês; (b) a saída sugerida do "Não fiz" é "Manter a data"
   (ou "Adiar" para quem não tem sobra) e "Ajustar ao que coube" depois de duas faltas; (c) "Passei" sem valor
   assume a semana no teto; (d) no desktop a folha das lentes também é folha (não inline); (e) "Escrever para a
   Patrícia" na Clínica grava uma dúvida em Conversas; (f) o seletor de 5 tokens saiu da tela do cliente.
-->

<style>
/* ===== Tokens do DESIGN.md ===== */
:root{
  --laranja:#FA7A35; --laranja-txt:#E06600; --pessego:#FFF3EB; --marinho:#20344C; --noite:#131F2E;
  --creme:#FDFCFA; --branco:#FFFFFF; --grafite:#555555; --legenda:#6B6A66; --nevoa:#8A8A8A;
  --areia:#F1EEE8; --borda:#DDDDDD; --ardosia:#DCE3EC; --verde:#2E9E5B; --verde-txt:#22794A;
  --atencao-txt:#964400; --azul-bens:#3B6FCB; --ocre:#D9952A; --violeta:#7C5CBF;
  --verde-meio:#77C094; --azul-meio:#7FA1DD; --ocre-meio:#E6BA74;
  --fixas:#4B6584; --ajust:#9FB0C4; --aurora:#F6A06B; --liberado:#FCD9C2; --trilho:#EEF1F5;
  --divida:#E2928D; --divida-claro:#F7D7D4;
  --ok-bg:#E3F3E9; --at-bg:#FFF3EB; --neutro-bg:#F1EEE8;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --sombra-destaque:0 4px 10px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --sombra-flut:0 20px 50px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#E9E5DD;font-family:'DM Sans',system-ui,sans-serif;color:var(--grafite);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--marinho)}
a{color:var(--marinho)}
.num,.sora{font-family:Sora,sans-serif;font-weight:600;color:var(--marinho)}

/* ===== A barra do mock (fora do produto) ===== */
#barra{position:sticky;top:0;z-index:50;background:var(--areia);border-bottom:1px solid #DDD6CA;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px}
#barra .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#barra .rot{font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--legenda)}
#barra .seg{display:inline-flex;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#fff}
#barra .seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--marinho)}
#barra .seg button+button{border-left:1px solid var(--borda)}
#barra .seg button.on{background:var(--marinho);color:#fff}
#barra select{padding:4px 8px;border:1px solid var(--borda);border-radius:8px;background:#fff;font-size:12.5px}
#barra .mes{color:var(--legenda)}
#barra .btn-barra{border:1px solid var(--borda);background:#fff;border-radius:8px;padding:5px 10px;color:var(--marinho);font-size:12.5px}
#barra .sit-desc{flex-basis:100%;color:var(--legenda);font-size:12px;margin-top:-2px}

/* ===== O palco: celular 390 ou desktop 1280 ===== */
#palco{padding:24px 16px 60px;display:flex;justify-content:center;align-items:flex-start;overflow-x:auto}
#escala{transform-origin:top center}
#frame{position:relative;background:var(--creme);overflow:hidden;box-shadow:var(--sombra-flut)}
#frame.cel{width:390px;height:844px;border-radius:34px;border:8px solid #1d2733}
#frame.desk{width:1280px;height:820px;border-radius:12px;border:1px solid #cfc9bf}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#frame.desk #app{flex-direction:row}

/* casca do produto */
.cab{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:var(--creme);border-bottom:1px solid var(--areia)}
.cab h1{font:600 22px/1.15 Sora,sans-serif;color:var(--marinho);margin:0;flex:1;min-width:0}
#frame.desk .cab{padding:18px 32px 14px}
#frame.desk .cab h1{font-size:26px}
.voltar{border:0;background:transparent;color:var(--marinho);font-size:20px;line-height:1;padding:4px 6px 4px 0;min-width:32px;min-height:32px}
.falar{border:1px solid var(--borda);background:#fff;border-radius:9999px;width:44px;height:44px;padding:0;color:var(--marinho);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.falar svg{width:20px;height:20px}
.falar .cont{position:absolute;top:-4px;right:-4px;background:var(--marinho);color:#fff;border-radius:9999px;font:600 11px 'DM Sans',sans-serif;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.miolo{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;scroll-behavior:smooth}
#frame.desk .miolo{padding:22px 32px 40px}
.coluna{flex:1;display:flex;flex-direction:column;min-width:0}
.nav-baixo{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--areia);padding:6px 4px 10px}
.nav-baixo button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px 'DM Sans',sans-serif;color:var(--legenda);padding:4px 0;min-height:44px}
.nav-baixo button.on{color:var(--marinho)}
.nav-baixo svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-baixo button.on svg{stroke:var(--laranja)}
.lateral{flex:none;width:232px;background:#fff;border-right:1px solid var(--areia);display:flex;flex-direction:column;padding:20px 14px}
.lateral .marca{font:700 15px Sora,sans-serif;color:var(--marinho);padding:0 10px 18px}
.lateral .marca small{display:block;font:500 12px 'DM Sans',sans-serif;color:var(--legenda);margin-top:2px}
.lateral button.item{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;font:500 14px 'DM Sans',sans-serif;color:var(--grafite);display:flex;align-items:center;gap:10px}
.lateral button.item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lateral button.item.on{background:var(--pessego);color:var(--marinho);font-weight:600}
.lateral .pe{margin-top:auto;border-top:1px solid var(--areia);padding-top:12px}

/* ===== Componentes ===== */
.card{background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:12px}
#frame.desk .card{padding:20px 22px}
.card.destaque{box-shadow:var(--sombra-destaque)}
.card h3,.h3{font:600 16px/1.3 Sora,sans-serif;color:var(--marinho);margin:0 0 6px}
.label{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--marinho);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.label .mais{margin-left:auto;letter-spacing:0;text-transform:none;font-weight:600;font-size:12.5px}
.label:first-child{margin-top:4px}
.mut{color:var(--legenda);font-size:13px}
.peq{font-size:13px}
.linha{display:flex;align-items:center;gap:10px}
.entre{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sep{border-top:1px solid var(--areia);margin:12px 0}
.btn{border:1px solid var(--borda);background:#fff;color:var(--marinho);border-radius:11px;padding:8px 12px;font:600 13px 'DM Sans',sans-serif;min-height:36px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.pilula:focus-visible,button:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
.btn.terc{background:var(--pessego);border-color:transparent}
.btn.peq{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn.link{border:0;background:transparent;padding:4px 0;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.pilula{border:0;background:var(--laranja);color:var(--marinho);border-radius:9999px;padding:10px 18px;font:600 13.5px 'DM Sans',sans-serif;min-height:40px;transition:filter .15s,transform .1s}
.pilula:hover{filter:brightness(.94)}
.pilula:active{transform:scale(.97)}
.btn[disabled],.pilula[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:9999px;padding:3px 10px;font:600 11.5px 'DM Sans',sans-serif;white-space:nowrap;background:var(--neutro-bg);color:var(--legenda)}
.chip.ok{background:var(--ok-bg);color:var(--verde-txt)}
.chip.at{background:var(--at-bg);color:var(--atencao-txt)}
.chip.mar{background:var(--ardosia);color:var(--marinho)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.filtro{border:1px solid var(--borda);background:#fff;border-radius:9999px;padding:6px 12px;font:600 12.5px 'DM Sans',sans-serif;color:var(--marinho);white-space:nowrap;min-height:34px}
.filtro.on{background:var(--marinho);border-color:var(--marinho);color:#fff}
.alterna{display:inline-flex;border:1px solid var(--borda);border-radius:8px;overflow:hidden;background:#fff}
.alterna button{border:0;background:transparent;padding:6px 12px;font:600 12.5px 'DM Sans',sans-serif;color:var(--marinho);min-height:32px}
.alterna button+button{border-left:1px solid var(--borda)}
.alterna button.on{background:var(--marinho);color:#fff}
.trilho{height:6px;border-radius:9999px;background:var(--trilho);overflow:hidden}

.grande{font:600 26px/1.1 Sora,sans-serif;color:var(--marinho)}
.medio{font:600 19px/1.15 Sora,sans-serif;color:var(--marinho)}
.citacao{font-family:'DM Serif Display',serif;color:var(--marinho);font-size:17px;line-height:1.35}
.toque{cursor:pointer}
.toque:hover{filter:brightness(.985)}
.ponto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.aviso{background:var(--pessego);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--marinho)}
.aviso.neutro{background:var(--areia)}
.aviso.ok{background:var(--ok-bg);color:var(--verde-txt)}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.campo label{font:600 12.5px 'DM Sans',sans-serif;color:var(--marinho)}
.campo input,.campo select,.campo textarea{border:1px solid var(--borda);border-radius:11px;padding:9px 11px;background:#fff;width:100%}
.campo .ajuda{font-size:12px;color:var(--legenda)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{background:var(--creme);border-radius:12px;padding:10px 12px}
.mini span{display:block;font-size:12px;color:var(--legenda)}
.mini b{display:block;font:600 18px/1.2 Sora,sans-serif;color:var(--marinho);margin-top:2px}
.mini small{display:block;font-size:12px;color:var(--legenda);margin-top:2px}
table.tab{border-collapse:collapse;width:100%;font-size:13px}
table.tab th{font:600 11px 'DM Sans',sans-serif;color:var(--legenda);text-align:right;padding:6px 8px;border-bottom:1px solid var(--areia);white-space:nowrap}
table.tab th:first-child,table.tab td:first-child{text-align:left;position:sticky;left:0;background:#fff}
table.tab td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--areia);white-space:nowrap;color:var(--grafite)}
table.tab tr.grupo td{font-weight:600;color:var(--marinho);background:#FBFAF7}
table.tab tr.grupo td:first-child{background:#FBFAF7}
table.tab td.vazio{color:#B9B6B0}
.rola-x{overflow-x:auto}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--marinho);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;z-index:40;box-shadow:var(--sombra-destaque);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:flex-end;animation:aparece .25s ease}
.toast span{flex:1 1 200px}
.toast button{border:0;background:transparent;color:#FCD9C2;font-weight:600;text-decoration:underline;white-space:nowrap;min-height:32px}
#frame.desk .toast{bottom:28px;left:50%;right:auto;transform:translateX(-50%);max-width:480px;min-width:320px}
.faixa-ro{background:var(--ardosia);color:var(--marinho);font-size:12.5px;padding:7px 14px;font-weight:600;flex:none}

/* folha (sheet) dentro do aparelho */
.veu{position:absolute;inset:0;background:rgba(19,31,46,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:aparece .2s ease}
#frame.desk .veu{align-items:center}
.folha{background:var(--creme);width:100%;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;box-shadow:var(--sombra-flut);animation:sobe .25s ease}
#frame.desk .folha{width:560px;border-radius:16px;max-height:84%}
.folha .alca{width:40px;height:4px;border-radius:9999px;background:var(--borda);margin:-6px auto 12px}
.folha h2{font:600 19px/1.25 Sora,sans-serif;color:var(--marinho);margin:0 0 6px}
.resp4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.resp4 button{min-height:48px;border-radius:12px;border:1px solid var(--borda);background:#fff;font:600 14px 'DM Sans',sans-serif;color:var(--marinho)}
.resp4 button.fiz{background:var(--marinho);color:#fff;border-color:var(--marinho)}
.saida{display:block;width:100%;text-align:left;border:1px solid var(--borda);background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;color:var(--grafite);font-size:13px;min-height:44px}
.saida b{display:block;color:var(--marinho);font-size:14px;margin-bottom:2px}
.saida.sug{border-color:var(--laranja);background:var(--laranja);color:var(--marinho);border-radius:9999px;padding:12px 18px}
.saida.on{border:2px solid var(--marinho)}
.resp3{grid-template-columns:1fr 1fr 1fr}
.resp3 button{font-size:13px}
.antesdepois{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.antesdepois div{background:#fff;border-radius:12px;padding:10px 12px}
.antesdepois span{font-size:11.5px;color:var(--legenda);display:block}
.antesdepois b{font:600 15px Sora,sans-serif;color:var(--marinho)}
.calculando{animation:pulso 1.2s ease-in-out infinite}

/* Painel */
.faixa-obj{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.faixa-obj::-webkit-scrollbar{display:none}
.obj-mini{flex:none;width:148px;background:#fff;border-radius:14px;box-shadow:var(--sombra);overflow:hidden;scroll-snap-align:start;cursor:pointer;border:0;padding:0;text-align:left}
.obj-mini .foto{height:52px;background-size:cover;background-position:center}
.obj-mini .tx{padding:7px 10px 9px}
.obj-mini b{display:block;font:600 13px/1.25 Sora,sans-serif;color:var(--marinho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj-mini small{display:block;font-size:11.5px;color:var(--legenda);margin:2px 0 5px;white-space:nowrap}
.proposito{font-family:'DM Serif Display',serif;color:var(--legenda);font-size:13.5px;line-height:1.3;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-faixa{flex:none;align-self:center;border:0;background:var(--pessego);color:var(--atencao-txt);border-radius:9999px;padding:6px 12px;font:600 12px 'DM Sans',sans-serif;white-space:nowrap;cursor:pointer;min-height:44px}
.passo{background:#fff;border-radius:16px;box-shadow:var(--sombra-destaque);padding:18px 18px 16px;margin:12px 0}
.passo .rotulo{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--marinho)}
.passo .numero-passo{font:600 30px/1.1 Sora,sans-serif;color:var(--marinho);margin:8px 0 10px}
.passo .numero-passo small{font-size:17px;color:var(--legenda);font-weight:500}
.passo p{margin:8px 0 12px;color:var(--marinho);font-size:14.5px;line-height:1.4}
.tarefa-unica{cursor:pointer}
.tarefa-unica .quando{display:block;font-size:12.5px;color:var(--legenda);margin-top:2px}
.mais-tarefas{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--marinho);font:600 13px 'DM Sans',sans-serif;padding:6px 2px;min-height:40px}
.tarefa{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:11px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.tarefa .tx{flex:1;min-width:0;cursor:pointer}

.tarefa .fiz{border:1px solid var(--marinho);background:#fff;color:var(--marinho);border-radius:11px;padding:7px 12px;font:600 13px 'DM Sans',sans-serif;min-height:40px;min-width:52px}
.tarefa .mais3{border:0;background:transparent;color:var(--legenda);font-size:18px;min-width:36px;min-height:40px}
.tarefa.feita{opacity:.75}
.tarefa.feita .tx b{text-decoration:line-through;text-decoration-color:#B9B6B0}
.cat{font:600 10.5px 'DM Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--legenda)}
.numeros{display:flex;flex-wrap:wrap;gap:8px 6px;background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:10px 8px}
.numero{flex:1 1 calc(50% - 6px);min-width:0;cursor:pointer;border:0;background:transparent;text-align:center;padding:4px 2px}
#frame.desk .numeros{flex-wrap:nowrap}
#frame.desk .numero{flex:1 1 0}
.numero span{display:block;font-size:11px;color:var(--legenda);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numero b{display:block;font:600 15px/1.2 Sora,sans-serif;color:var(--marinho);margin-top:3px;white-space:nowrap}
#frame.desk .numero b{font-size:17px}
.ritmo-linha{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;cursor:pointer}
.ritmo-linha b{display:block;font:600 17px/1.2 Sora,sans-serif;color:var(--marinho)}
.ritmo-linha b small{font-size:13px;color:var(--legenda);font-weight:500}
.encontro{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--borda);border-radius:9999px;padding:10px 16px;font:600 13px 'DM Sans',sans-serif;color:var(--marinho);margin-top:12px;min-height:44px}
.painel-desk{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,1fr);gap:18px;align-items:start}

/* Objetivo */
.sonho-foto{height:180px;border-radius:16px;background-size:cover;background-position:center;position:relative;margin-bottom:12px}
.sonho-foto .sobre{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;border-radius:0 0 16px 16px;background:linear-gradient(transparent,rgba(19,31,46,.72));color:#fff}
.sonho-foto .sobre b{font:600 22px/1.15 Sora,sans-serif;display:block}
.sonho-foto .sobre small{font-size:13px;opacity:.92}
.bloco{margin-bottom:6px}
.bloco > .tit{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0}
.bloco > .tit h3{margin:0;flex:1}
.lista-obj .item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:10px;margin-bottom:8px;cursor:pointer}
.lista-obj .thumb{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;flex:none}
.arrasta{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:10px 12px;margin-bottom:8px}
.arrasta .pega{cursor:grab;color:var(--nevoa);font-size:18px;user-select:none;padding:0 4px}
.arrasta.arrastando{opacity:.5}

/* Status */
.vert{background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;margin-bottom:8px}
.vert .topo{display:flex;align-items:center;gap:8px;cursor:pointer}
.vert .topo b{font:600 14.5px Sora,sans-serif;color:var(--marinho);flex:1}
.vert .vals{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.vert .vals div{font-size:12.5px;color:var(--legenda)}
.vert .vals div b{font:600 14px Sora,sans-serif;color:var(--marinho);margin-left:4px}
.status-desk{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Escalada (Jornada) */
.trilha{display:flex;flex-direction:column;gap:0;margin:6px 0 4px}
.mundo{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:12px}

.mundo:last-child::before{display:none}
.mundo b{font:600 14px Sora,sans-serif;color:var(--marinho)}
.passos{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}

.passos span.feito{background:var(--ardosia);color:var(--marinho)}
.passos span.atual{background:var(--pessego);color:var(--marinho);font-weight:600;outline:1px solid var(--laranja)}
.secao-rec > .tit{display:flex;align-items:center;gap:8px;cursor:pointer;background:#fff;border-radius:14px;box-shadow:var(--sombra);padding:12px 14px;margin-bottom:8px}
.secao-rec > .tit b{font:600 15px Sora,sans-serif;color:var(--marinho);flex:1}

.etapa.feita .p{background:var(--marinho);border-color:var(--marinho)}
.etapa.agora .p{border-color:var(--laranja);background:var(--laranja)}

/* Gráficos */
svg text{font-family:'DM Sans',sans-serif}
svg .n{font-family:Sora,sans-serif;font-weight:600}
.revela{animation:aparece .5s ease both}
.cresce{transform-origin:bottom;animation:cresce .6s ease both}

@keyframes aparece{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes so-opacidade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){

  .calculando{animation:pulso 1.6s ease-in-out infinite}
}

  else if (o.tipo === 'liberdade') { const n = difM(MES_REF, o.data); antes = brlC(fvDe(g, o.aporte, r, n)); depois = brlC(fvDe(g, v.aporte, r, n)); }
  else { const n0 = nperPara(o.valor, g, o.aporte, r), n1 = nperPara(o.valor, g, v.aporte, r); antes = n0 == null ? 'sem data' : mesAno(addM(MES_REF, n0)); depois = n1 == null ? 'sem data no ritmo' : mesAno(addM(MES_REF, n1)); }
  // uma data só, a do plano; o ritmo de hoje aparece ao lado, sem virar outra data
  const rot = o.tipo === 'liberdade' ? `na idade de parar (${o.idade})` : o.tipo === 'divida' ? 'a quitação' : 'a data do plano';
  const antesTxt = o.tipo === 'liberdade' || o.tipo === 'divida' ? antes : `${mesAno(o.data)}<small style="display:block;font:500 11.5px 'DM Sans',sans-serif;color:var(--legenda)">no ritmo de hoje: ${antes}</small>`;
  const acao = C.degrau === 'completo' ? `<button class="btn terc" data-acao="propor" data-id="${o.id}">Propor à ${nomeC(d)}</button>` : `<button class="btn terc" data-acao="ajustar-obj" data-id="${o.id}">Ajustar e confirmar</button>`;
  return `<div class="card"><h3>Mudar</h3><p class="mut" style="margin:0 0 8px">Simule outro aporte e veja o antes e o depois. ${C.degrau === 'completo' ? `A mudança vai à ${nomeC(d)}, que aprova e escreve à família.` : 'O ajuste é direto, com confirmação, e cria uma versão datada do plano.'}</p>
    <div class="campo"><label>${o.tipo === 'divida' ? 'Parcela por mês' : 'Aporte por mês'}</label><input type="number" step="50" min="0" value="${v.aporte}" data-campo="${k}.aporte"></div>
    <div class="antesdepois"><div><span>Antes: ${rot}</span><b>${antesTxt}</b></div><div><span>Depois, no ritmo novo</span><b>${depois}</b></div></div>
    <div style="margin-top:10px">${acao}</div></div>`;
}
function telaJuntos(d) {
  const ordem = d.ordem.map(id => objDe(d, id)).filter(o => o && !o.complementar && o.tipo !== 'divida');
  // a divisão vigente é a do plano (o aporte de cada objetivo); a ordem por prioridade é só uma simulação rotulada

  let resta = S.estados.convite && d.id === 'casal' ? null : d.sobra;

  const linhas = ordem.map((o, i) => {
    const nec = o.necessario || o.aporte || 0;
    let recebe, quando = '';
    if (sim) { recebe = resta == null ? null : Math.max(0, Math.min(nec, resta)); if (resta != null) resta -= recebe; if (recebe != null && ['montante', 'troca', 'despesa'].includes(o.tipo)) { const n = nperPara(o.valor, o.guardado, recebe, o.taxa || 0); quando = recebe >= nec - 1 ? `chega em ${mesAno(o.data)}` : n == null ? 'sem data neste ritmo' : `a data anda para ${mesAno(addM(MES_REF, n))}`; } }
    else { recebe = resta == null ? null : o.aporte || 0; quando = ['montante', 'troca', 'despesa'].includes(o.tipo) ? `${mesAno(o.data)}${o.ratio && o.ratio < 0.98 ? ` · ${pct(o.ratio)} do necessário` : ''}` : ''; }
    return `<div class="arrasta" ${sim ? 'draggable="true"' : ''} data-arrasta="${o.id}">${sim ? '<span class="pega" aria-hidden="true">&#8942;&#8942;</span>' : ''}<span class="num" style="width:18px">${i + 1}</span><div style="flex:1;min-width:0"><b style="color:var(--marinho);font-size:14px">${esc(o.nome)}</b><div class="mut">pede ${brl(nec)}${recebe != null ? ` · recebe ${brl(recebe)}` : ''}${quando ? ' · ' + quando : ''}</div></div>
      ${sim ? `<button class="btn peq" data-acao="ordem" data-id="${o.id}" data-dir="-1" aria-label="Subir"${i === 0 ? ' disabled' : ''}>&#8593;</button><button class="btn peq" data-acao="ordem" data-id="${o.id}" data-dir="1" aria-label="Descer"${i === ordem.length - 1 ? ' disabled' : ''}>&#8595;</button>` : ''}</div>`;
  }).join('');
  const dif = pedem - d.sobra;
  const dist = d.patrimonioInfo && d.patrimonioInfo.distribuicao ? d.patrimonioInfo.distribuicao : d.reservaInfo ? [['Reserva', d.reservaInfo.atual]].concat(d.objetivos.filter(o => ['montante', 'troca', 'despesa'].includes(o.tipo) && o.guardado > 0).map(o => [o.nome, o.guardado])) : [];
  const totalDist = soma(dist.map(x => x[1]));
  return `<div class="card destaque"><span class="label" style="margin:0 0 6px">A soma dos aportes e a sobra</span>
    ${S.estados.convite && d.id === 'casal' ? `<div class="grande">${brl(pedem)} <span class="mut" style="font-size:14px">por mês</span></div><p class="peq">A sobra de vocês fica completa quando o Rafael informar a renda dele. Até lá, a renda dele aparece dita, nunca somada como zero.</p>`
    : `<div class="grade3"><div class="mini"><span>Os objetivos pedem</span><b>${brl(pedem)}</b></div><div class="mini"><span>Recebem hoje</span><b>${brl(recebem)}</b></div><div class="mini"><span>Sobram</span><b>${brl(d.sobra)}</b></div></div><p class="peq" style="margin:10px 0 0">${dif > 0 ? `Faltam ${brl(dif)} por mês para todos caberem no necessário. Os que recebem menos do que pedem têm a data andando ou o valor encolhido.` : 'Todos cabem na sobra.'}</p>`}</div>
    <div class="label">${sim ? 'Simulação: a sobra dividida pela ordem' : 'A divisão de hoje'} <button class="btn link mais" data-acao="ui" data-k="juntosSim" data-v="${sim ? '' : '1'}">${sim ? 'voltar à divisão de hoje' : 'simular por prioridade'}</button></div>${sim ? '<p class="mut" style="margin:-4px 0 8px">Arraste ou use as setas. É uma simulação: nada muda no plano até confirmar.</p>' : ''}${linhas}
    ${sim ? `<p class="mut">${d.quem.casal ? 'A ordem é decisão a dois: o que um muda, o outro vê com o nome de quem mudou. ' : ''}${C.degrau === 'cadastrado' ? 'A primeira prioridade define o próximo passo do Painel e as tarefas propostas.' : C.degrau === 'completo' ? `No Completo, mudar a ordem vira uma proposta à ${nomeC(d)}.` : ''}</p>` : ''}
    ${dist.length ? `<div class="label">O patrimônio que já existe</div><div class="card">${dist.map(([n, v]) => `<div class="entre" style="padding:6px 0;border-bottom:1px solid var(--areia)"><span>${esc(n)}</span><b class="num" style="font-size:14px">${brl(v)}</b></div>`).join('')}<div class="entre" style="padding-top:8px"><span class="mut">Somam</span><b class="num">${brl(totalDist)}</b></div><p class="mut" style="margin:8px 0 0">Feita uma vez e editável: ${d.id === 'casal' ? '"os R$ 60 mil: R$ 25 mil na reserva, R$ 35 mil na casa".' : 'cada real com um destino.'}</p><button class="btn" style="margin-top:8px" data-acao="toast" data-txt="Editar a distribuição: os valores somam sempre o patrimônio que existe. No mock, ela fica fixa.">Editar a distribuição</button></div>` : ''}`;
}

  const vis = d.tarefas.filter(passa);
  const grupos = [['agora', 'Agora'], ['seguida', 'Em seguida'], ['adiante', 'Mais adiante'], ['feitas', 'Feitas']];
  const props = vis.filter(t => t.status === 'proposta');

  const filtroAtivo = [f.filtroCat !== 'todas' ? CATS[f.filtroCat] : null, f.filtroObj !== 'todos' ? (objDe(d, f.filtroObj) || {}).nome : null, f.filtroResp !== 'todos' ? f.filtroResp : null].filter(Boolean);

    ${objs.length > 1 ? `<div class="chips" style="margin-bottom:6px"><button class="filtro${f.filtroObj === 'todos' ? ' on' : ''}" data-acao="filtro" data-f="filtroObj" data-v="todos">Todos os objetivos</button>${objs.map(o => `<button class="filtro${f.filtroObj === o.id ? ' on' : ''}" data-acao="filtro" data-f="filtroObj" data-v="${o.id}">${esc(o.nome)}</button>`).join('')}</div>` : ''}
    ${d.quem.casal && d.id === 'casal' ? `<div class="chips" style="margin-bottom:6px">${['todos', 'Camila', 'Rafael', 'os dois'].map(r => `<button class="filtro${f.filtroResp === r ? ' on' : ''}" data-acao="filtro" data-f="filtroResp" data-v="${r}">${r === 'todos' ? 'Quem faz: todos' : r}</button>`).join('')}</div>` : ''}` : '';
  const barraFiltro = `<div class="linha" style="margin:8px 0 6px;flex-wrap:wrap"><button class="btn peq" data-acao="ui" data-k="filtrosAbertos" data-v="${S.ui.filtrosAbertos ? '' : '1'}">Filtrar ${S.ui.filtrosAbertos ? '&#9652;' : '&#9662;'}</button>${filtroAtivo.map(x => `<span class="chip mar">${esc(x)}</span>`).join('')}${filtroAtivo.length ? '<button class="btn link peq" data-acao="limpar-filtros">limpar</button>' : ''}</div>${filtros}`;
  const bloco = (g, nome) => {
    const lst = vis.filter(t => grupoDe(t) === g).sort((a, b) => (atrasada(b) ? 1 : 0) - (atrasada(a) ? 1 : 0) || (a.data < b.data ? -1 : 1));
    if (g === 'agora' && !lst.length) { const prox = d.tarefas.filter(t => t.status === 'pendente' && t.data > FIM_SEMANA).sort((a, b) => a.data < b.data ? -1 : 1)[0]; return `<div class="label" style="margin-top:0">Agora</div><div class="aviso neutro">Nada para esta semana.${prox ? ` A próxima é em ${dataBR(prox.data)}: ${esc(prox.titulo)}.` : ''}</div>`; }
    if (!lst.length) return '';

  return `${ponte}${bloco('agora', 'Agora')}${propostas}${barraFiltro}${bloco('seguida', 'Em seguida')}${bloco('adiante', 'Mais adiante')}${bloco('feitas', 'Feitas')}
    <div class="entre" style="margin-top:14px;flex-wrap:wrap;gap:8px"><span class="mut">Outubro: ${pc.feitas} de ${pc.total} tarefas feitas${d.sequencia ? ' · ' + esc(d.sequencia) : ''}</span><button class="btn" data-acao="toast" data-txt="Criar uma tarefa: ${C.degrau === 'cadastrado' ? 'a partir de qualquer vertical do Status, com o botão Transformar em tarefa.' : 'livre, ou a partir de uma vertical do Status.'}">Criar uma tarefa</button></div>`;
}

// 11. O EFEITO DO "NÃO FIZ" (pela categoria e pelo horizonte)
// =====================================================================================================
function efeitoNaoFiz(d, t, faltou) {
  const linhas = [], saidas = [], atrasos = []; let segunda = false, tipo = t.cat, delta = 0, novaData = null, alvoObj = null;
  if (t.cat === 'dinheiro' && t.evento && t.obj === 'colchao') {
    linhas.push('Sem os R$ 30 mil, o colchão acaba em dezembro. Os meses magros de janeiro a maio ficam sem colchão, e a guia de maio (R$ 18 mil) sai do longo prazo.');
    tipo = 'colchao';
  } else if (t.cat === 'dinheiro' && t.saida) {
    linhas.push('Sem a transferência, a conta pessoal fica R$ 5 mil abaixo do que o mês pede. O colchão continua com R$ 10 mil e cobre até novembro.');
    tipo = 'colchao';
  } else if (t.cat === 'dinheiro' && !t.divisao) {
    const ri = d.reservaInfo;
    linhas.push(`Sem esse dinheiro, a reserva fica em ${brlC(ri.atual)}: um imprevisto de mais de ${Math.floor(ri.atual / d.custo)} meses de custo sai do dinheiro da Casa própria.`);
    tipo = 'reserva';
  } else if (t.cat === 'dinheiro') {
    tipo = 'dinheiro';
    t.divisao.forEach(p => {
      const o = objDe(d, p.obj); if (!o) return;
      const X = p.valor * faltou / t.valor; if (X <= 0) return;
      const g = guardadoAtual(d, o), r = o.taxa || 0, n = difM(MES_REF, o.data);
      if (t.faltasPorObj && t.faltasPorObj[o.id]) segunda = true;
      const marca = t.faltasPorObj && t.faltasPorObj[o.id] ? ` <span class="chip at">segunda falta seguida</span>` : '';
      if (o.tipo === 'divida') {
        const sal = o.valor - g, q1 = quitacao(sal, o.parcela, o.taxa), q2 = quitacao(sal * (1 + o.taxa), o.parcela, o.taxa);
        const d1 = addM(MES_REF, q1.meses), d2 = addM(MES_REF, q2.meses + 1), juros = q2.juros + sal * o.taxa - q1.juros;
        linhas.push(`O cartão quita em ${mesAnoL(d2)}, não em ${mesAnoL(d1)}, e custa ${brl(juros)} a mais de juros.${marca}`);
        tipo = 'divida'; delta = Math.max(delta, X); novaData = d2; alvoObj = o;
      } else if (o.tipo === 'liberdade' || n >= 120) {
        const fut = X * Math.pow(1 + r, n);
        linhas.push(`${o.tipo === 'liberdade' ? 'Liberdade' : esc(o.nome)}: ${brl(X)} a menos hoje são ${brlC(fut)} a menos ${o.tipo === 'liberdade' ? 'aos ' + o.idade : 'em ' + mesAno(o.data)}. A data não muda de forma relevante.${marca}`);
      } else if (o.tipo === 'reserva') {
        const n0 = nperPara(o.valor, g, o.aporte, r), d0 = addM(MES_REF, n0), d1 = addM(MES_REF, n0 + 1);
        linhas.push(`A sua reserva chega a ${brl(o.valor)} em ${mesAnoL(d1)}, não em ${mesAnoL(d0)}.${marca}`);
        delta += X; novaData = d1; alvoObj = o;
      } else {
        const V0 = fvDe(g, o.aporte, r, n); let k = 0;
        while (k < 120 && fvDe(g, o.aporte, r, n + k) - X * Math.pow(1 + r, n + k - 1) < V0 - 0.5) k++;
        const resto = Math.max(1, n - 1), fat = r ? r / (Math.pow(1 + r, resto) - 1) : 1 / resto, extra = X * Math.pow(1 + r, resto) * fat;
        linhas.push(`Sem esse aporte, ${esc(comArtigo(o))} fica para ${mesAnoL(addM(o.data, Math.max(1, k)))} em vez de ${mesAnoL(o.data)}. Para manter a data, os próximos ${resto} meses passam de ${brl(o.aporte)} para ${brl(o.aporte + extra)}.${marca}`);
        delta += extra; atrasos.push(Math.max(1, k)); if (!alvoObj) { alvoObj = o; novaData = addM(o.data, Math.max(1, k)); }
      }
    });
  } else if (ehTeto(t)) {
    // "Passei" sem valor: conta a semana atual no teto, ao menos
    const tt = t.teto, sem = tt.semanas[SEMANA_ATUAL], gastoSem = sem.gasto != null && sem.gasto > sem.comb ? sem.gasto : Math.max(sem.gasto || 0, sem.comb);
    const gasto = soma(tt.semanas.slice(0, SEMANA_ATUAL).map(s => s.gasto || 0)) + gastoSem, resta = Math.max(0, tt.mes - gasto);
    const sug = sugestaoTeto({ mes: tt.mes, semanas: tt.semanas.map((s, i) => i === SEMANA_ATUAL ? Object.assign({}, s, { gasto: gastoSem }) : s) }, SEMANA_ATUAL);
    linhas.push(resta > 0 ? `Para fechar o mês nos ${brl(tt.mes)}, restam ${brl(resta)} até o fim de outubro: até ${brl(sug.porSemana)} na semana que vem, em vez de ${brl(tt.semanas[SEMANA_ATUAL + 1] ? tt.semanas[SEMANA_ATUAL + 1].comb : sem.comb)}.` : `O teto de ${brl(tt.mes)} do mês já foi alcançado. A semana que vem fecha o mês acima do combinado; o aporte de novembro é que absorve a diferença.`);
    delta = sug.porSemana; tipo = 'teto';
  } else if (t.cat === 'comportamental') {
    linhas.push('O combinado continua para o resto do mês. Nada muda nos objetivos se a próxima semana fechar dentro do teto.');
  } else if (t.cat === 'educacional') {
    linhas.push('Nada muda no plano: só a nova data.');
  } else {
    linhas.push(`O risco segue aberto: ${esc(t.risco || 'o passo fica parado até a tarefa ser feita')}.`);
  }
  // o efeito somado, quando o aporte cobre vários objetivos (decisão 15): uma frase; o detalhe fica em "ver por objetivo"
  let resumo = null;
  if (tipo === 'dinheiro' && t.divisao && t.divisao.length > 1) {
    const n = t.divisao.filter(p => p.valor > 0).length, mx = Math.max(1, ...atrasos);
    resumo = `${n === 2 ? 'Os dois objetivos atrasam' : `Os ${n} objetivos atrasam`} ${mx === 1 ? 'um mês' : 'até ' + mx + ' meses'}; para manter as datas, o próximo aporte sobe ${brl(delta)}.`;
  }
  // as saídas, sempre na mesma ordem; a sugerida vem em destaque (manter a data; depois de duas faltas, ajustar)
  if (tipo === 'dinheiro' || tipo === 'divida' || tipo === 'reserva' && t.divisao) {
    if (!d.semSobra) saidas.push({ id: 'manter', titulo: 'Manter a data', txt: tipo === 'divida' ? `pagar a parcela que faltou no mês que vem (${brl(d.divida.parcela)} a mais)` : `o próximo aporte sobe ${brl(delta)}, uma vez`, depois: tipo === 'divida' ? `${brl(d.divida.parcela * 2)} em novembro` : `${brl(t.valor + delta)} no próximo aporte`, sug: !segunda });
    saidas.push({ id: 'adiar', titulo: 'Adiar o objetivo', txt: novaData ? `a data anda para ${mesAno(novaData)}` : 'a data de cada objetivo anda um pouco', depois: novaData ? mesAno(novaData) : 'datas novas', sug: d.semSobra && !segunda });
    saidas.push({ id: 'ajustar', titulo: 'Ajustar ao que coube', txt: 'o valor que cabe vira a nova meta, e a data se estica', depois: 'nova meta', sug: segunda, coube: true });
    if (d.objetivos.length > 1 || tipo === 'divida') saidas.push({ id: 'outro', titulo: 'Usei em outro objetivo', txt: 'conta como coberto, não como falta', depois: 'coberto' });
  } else if (tipo === 'reserva' || tipo === 'colchao') {
    saidas.push({ id: 'adiar', titulo: 'Fazer depois', txt: 'uma nova data para a mesma tarefa', depois: 'nova data' });
    saidas.push({ id: 'ajustar', titulo: 'Ajustar ao que coube', txt: 'o valor que cabe vira a nova meta', depois: 'nova meta', coube: true });
    saidas.push({ id: 'resgatar', titulo: 'Resgatar agora', txt: 'cobrir o mês com o que já está investido', depois: 'coberto pelo resgate' });
  } else if (tipo === 'teto') {
    saidas.push({ id: 'manter', titulo: 'Manter o teto do mês', txt: `a semana que vem fica em ${brl(delta)}`, depois: `${brl(delta)} por semana`, sug: true });
    saidas.push({ id: 'ajustar', titulo: 'Ajustar o teto', txt: 'o mês fecha mais alto; o aporte de novembro diminui', depois: 'teto maior', coube: true });
  } else if (tipo === 'comportamental') {
    saidas.push({ id: 'adiar', titulo: 'Escolher uma nova data', txt: 'o combinado continua; só a data muda', depois: 'nova data' });
  } else {
    saidas.push({ id: 'adiar', titulo: 'Escolher uma nova data', txt: 'a tarefa volta para a lista na data nova', depois: 'nova data' });
    if (t.cat !== 'educacional') saidas.push({ id: 'ajuda', titulo: 'Pedir ajuda', txt: comConsultor() ? `a ${nomeC(d)} vê e responde em até 2 dias úteis` : 'abre Falar com alguém', depois: 'conversa aberta' });
  }
  return { linhas, saidas, segunda, tipo, delta, novaData, alvoObj, resumo };
}

// =====================================================================================================
// 12. A FOLHA DE RESPOSTAS (abre ali mesmo, com as quatro respostas)
// =====================================================================================================
function folhaResp(d) {
  const F = S.folha, t = tarDe(d, F.id); if (!t) return '';
  const o = t.obj ? objDe(d, t.obj) : null;
  const cab = `<div class="alca"></div><span class="cat">${CATS[t.cat]}${t.resp ? ' · ' + esc(t.resp) : ''}</span><h2>${esc(t.titulo)}</h2><div class="mut">${esc(t.serve)} · ${quandoTxt(t)}</div>`;
  const divisao = t.divisao && t.divisao.length > 1 ? `<div class="card" style="margin:10px 0 0;padding:10px 12px">${t.divisao.map(p => `<div class="entre peq" style="padding:3px 0"><span>${p.valor < 0 ? 'sai do' : 'para a'} ${esc((objDe(d, p.obj) || {}).nome || p.obj)}</span><b class="num" style="font-size:13.5px">${brl(Math.abs(p.valor))}</b></div>`).join('')}</div>` : '';
  const parcelas = t.parcelas ? `<div class="card" style="margin:10px 0 0;padding:10px 12px">${t.parcelas.map(p => `<div class="entre peq" style="padding:3px 0"><span>${brl(p.valor)} em ${dataBR(p.data)}, de ${p.resp}</span><span class="chip ${p.status === 'feita' ? 'ok' : ''}">${p.status === 'feita' ? (p.quem || 'feita') : 'pendente'}</span></div>`).join('')}</div>` : '';
  const pe = `<div class="entre" style="margin-top:14px"><button class="btn link" data-ir="tarefa:${t.id}" data-fecha="1">Abrir a página da tarefa</button><button class="btn link" data-acao="whats" data-cena="lembrete" data-id="${t.id}">Ver como chega no WhatsApp</button></div>`;
  const ajustavel = ehTeto(t) ? `<p class="mut" style="margin:8px 0 0">Gasto ajustável é o que varia de um mês para outro: mercado, lazer, delivery, roupas, em qualquer meio de pagamento. Aluguel, plano de saúde e parcelas ficam de fora.</p>` : '';
  if (F.modo === 'calculando') return cab + `<div class="card calculando" style="margin-top:12px"><b style="color:var(--marinho)">Calculando o efeito</b><div class="mut">As contas do plano estão sendo refeitas.</div><div class="trilho" style="margin-top:10px"><i style="width:60%"></i></div></div>`;
  if (F.modo === 'fizparte') {
    const comp = ehTeto(t);
    if (!t.valor) return cab + `<div class="campo" style="margin-top:12px"><label>O que ficou feito, e o que falta?</label><input type="text" placeholder="ex.: liguei, mas pediram um documento" value="${esc(F.nota || '')}" data-campo="folha.nota"><span class="ajuda">A tarefa continua aberta para o resto${comConsultor() ? ', e a ' + nomeC(d) + ' lê a frase' : ''}.</span></div>
      <div class="linha"><button class="btn" data-acao="resp-modo" data-modo="menu">Voltar</button><button class="btn" style="background:var(--marinho);color:#fff;border-color:var(--marinho)" data-acao="gravar-parte">Gravar</button></div>`;
    // no teto, o valor é obrigatório: nada é gravado sem ele
    return cab + `<div class="campo" style="margin-top:12px"><label>${comp ? 'Quanto foi de gastos ajustáveis nesta semana?' : 'Quanto você conseguiu dedicar?'}</label><input type="number" min="0" step="${comp ? 10 : 50}" value="${F.valor != null ? F.valor : comp ? '' : Math.round((t.valor || 0) / 2)}" placeholder="${comp ? 'em reais' : ''}" data-campo="folha.valor"><span class="ajuda">${comp ? `o teto da semana é ${brl(t.valor)}` : `o planejado era ${brl(t.valor)}`}</span>${F.erro ? `<span class="ajuda" style="color:var(--atencao-txt)">${esc(F.erro)}</span>` : ''}</div>${ajustavel}
      <div class="linha" style="margin-top:10px"><button class="btn" data-acao="resp-modo" data-modo="menu">Voltar</button><button class="btn" style="background:var(--marinho);color:#fff;border-color:var(--marinho)" data-acao="gravar-parte">Gravar</button></div>`;
  }
  if (F.modo === 'adiar') {
    const motivos = ['o salário atrasou', 'gasto inesperado', 'esqueci'];
    const motivo = C.degrau === 'cadastrado'
      ? `<div class="campo"><label>Motivo (opcional, só para você)</label><div class="chips">${motivos.map(m => `<button class="filtro${F.motivo === m ? ' on' : ''}" data-acao="motivo" data-v="${m}">${m}</button>`).join('')}</div>${F.motivo === 'o salário atrasou' ? '<span class="ajuda">Sugestão: mudar o lembrete para o dia em que o salário costuma cair.</span>' : F.motivo === 'gasto inesperado' ? '<span class="ajuda">Sugestão: ver o teto da semana, que mostra quanto ainda cabe no mês.</span>' : ''}</div>`
      : `<div class="campo"><label>Uma frase para a ${nomeC(d)}</label><input type="text" placeholder="ex.: o corretor remarcou; fica para daqui a uma semana" value="${esc(F.motivo || '')}" data-campo="folha.motivo"></div>`;
    const repetido = (t.adiamentos || 0) >= 1 ? `<div class="aviso" style="margin-bottom:10px">É o segundo adiamento desta tarefa.${comConsultor() ? ` Ela entra na fila da ${nomeC(d)}, que pode ajudar a destravar.` : ' Vale ver se a data ou a tarefa precisam mudar.'}</div>` : '';
    return cab + `<div style="margin-top:12px">${repetido}<div class="campo"><label>Nova data</label><input type="date" value="${F.data || dataMin(t)}" min="${dataMin(t)}" data-campo="folha.data">${F.erro ? `<span class="ajuda" style="color:var(--atencao-txt)">${esc(F.erro)}</span>` : ''}</div>${motivo}<p class="mut">Adiar não conta como falta; conta como adiada.</p>
      <div class="linha"><button class="btn" data-acao="resp-modo" data-modo="menu">Voltar</button><button class="btn" style="background:var(--marinho);color:#fff;border-color:var(--marinho)" data-acao="gravar-adiar">Adiar</button></div></div>`;
  }
  if (F.modo === 'naofiz') {
    const E = efeitoNaoFiz(d, t, F.faltou != null ? F.faltou : t.valor || 0);
    const esc1 = F.escolha ? E.saidas.find(s => s.id === F.escolha) : null;
    const coube = F.coube != null ? F.coube : E.tipo === 'teto' ? arred((t.valor || 0) * 1.2, 10) : arred((t.valor || 0) * 0.6, 50);
    let confirma = '';
    if (esc1) {
      const porUnidade = E.tipo === 'teto' ? ' por semana' : ' por mês';
      const antes = E.tipo === 'teto' ? brl(t.valor || 0) + ' por semana' : esc1.id === 'adiar' && E.alvoObj ? mesAno(E.alvoObj.data) : esc1.id === 'manter' ? brl(t.valor || 0) + ' no próximo aporte' : esc1.id === 'ajustar' ? brl(t.valor || 0) + porUnidade : 'falta';
      const depois = esc1.coube ? brl(coube) + porUnidade : esc1.depois;
      const outro = esc1.id === 'outro' ? `<div class="campo" style="margin-top:8px"><label>Para qual objetivo foi?</label><select data-campo="folha.para">${d.objetivos.filter(x => x.id !== t.obj).map(x => `<option value="${x.id}"${F.para === x.id ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}<option value="reserva-imprev">Um imprevisto (a reserva)</option></select></div>` : '';
      const cb = esc1.coube ? `<div class="campo" style="margin-top:8px"><label>${E.tipo === 'teto' ? 'Novo teto por semana' : 'Quanto cabe por mês?'}</label><input type="number" min="0" step="${E.tipo === 'teto' ? 10 : 50}" value="${coube}" data-campo="folha.coube"></div>` : '';
      confirma = `${cb}${outro}<div class="antesdepois"><div><span>Antes${E.tipo === 'teto' ? ': teto da semana' : ''}</span><b>${antes}</b></div><div><span>Depois</span><b>${depois}</b></div></div>
        ${C.degrau === 'completo' ? `<p class="mut" style="margin:8px 0">A escolha vale como ajuste provisório até a ${nomeC(d)} aprovar (até ${PRODUTO.prazoConsultoraDiasUteis} dias úteis). O próximo lembrete já sai com o valor escolhido.</p><button class="btn" style="background:var(--marinho);color:#fff;border-color:var(--marinho)" data-acao="confirmar-saida">Enviar à ${nomeC(d)}</button>`
        : `<p class="mut" style="margin:8px 0">Confirmar cria uma versão do plano de ${dataBR(HOJE)}; a anterior fica no histórico.</p><button class="btn" style="background:var(--marinho);color:#fff;border-color:var(--marinho)" data-acao="confirmar-saida">Confirmar</button>`}`;
    }
    // o efeito: somado numa frase quando há vários objetivos; o detalhe por objetivo sob pedido
    const efeito = E.resumo ? `<p style="margin:6px 0;color:var(--marinho);font-size:15px;line-height:1.45">${E.resumo}</p>${F.porObj ? E.linhas.map(l => `<p class="peq" style="margin:6px 0;color:var(--marinho)">${l}</p>`).join('') : ''}<button class="btn link peq" data-acao="por-obj">${F.porObj ? 'esconder o detalhe' : 'ver por objetivo'}</button>` : E.linhas.map(l => `<p style="margin:6px 0;color:var(--marinho);font-size:14px;line-height:1.45">${l}</p>`).join('');
    return cab + `<div class="card" style="margin-top:12px;background:#fff"><span class="label" style="margin:0 0 6px">O que isso faz com ${t.cat === 'dinheiro' ? 'os objetivos' : E.tipo === 'teto' ? 'o mês' : 'o plano'}</span>${efeito}
      ${E.segunda ? `<p class="mut" style="margin:6px 0 0">Duas faltas seguidas: a sugestão é ajustar ao que coube, não aumentar.</p>` : ''}</div>
      <span class="label">O que fazer em vez disso</span>${E.saidas.map(s => `<button class="saida${s.sug ? ' sug' : ''}${F.escolha === s.id ? ' on' : ''}" data-acao="saida" data-v="${s.id}"><b>${s.titulo}${s.sug ? ' · sugerida' : ''}</b>${s.txt}</button>`).join('')}${confirma}
      <div style="margin-top:12px"><button class="btn link" data-acao="resp-modo" data-modo="menu">Voltar às respostas</button></div>`;
  }
  // proposta do sistema: aceitar ou descartar
  if (t.status === 'proposta') return cab + (t.nota ? `<p class="mut" style="margin:8px 0 0">${esc(t.nota)}</p>` : '') + `<p class="peq" style="margin:10px 0 0">Proposta a partir do exame e do passo. ${pl(d, 'Aceitem ou descartem', 'Aceite ou descarte')}.</p><div class="resp4"><button class="fiz" data-acao="aceitar" data-id="${t.id}">Aceitar</button><button data-acao="descartar" data-id="${t.id}">Descartar</button></div>${pe}`;
  // menu (as respostas) ou "já registrado"
  const respondida = !['pendente', 'parcial'].includes(t.status) || (t.status === 'parcial' && !t.parcelas);
  if (respondida && !F.corrigir) return cab + `<div class="aviso neutro" style="margin-top:12px">Já registrado${t.hist.length ? ' em ' + dataBR(t.hist[t.hist.length - 1].data) : ''}: ${estadoDe(t)}${t.feitoValor ? ' (' + brl(t.feitoValor) + ')' : ''}. <button class="btn link" data-acao="corrigir">Corrigir?</button></div>${divisao}${parcelas}${pe}`;
  return cab + divisao + parcelas + (t.nota ? `<p class="mut" style="margin:8px 0 0">${esc(t.nota)}</p>` : '') + ajustavel + botoesResposta(t) + pe;
}
// as respostas: quatro para a tarefa comum; três próprias para o teto da semana (um limite não se "faz")
function botoesResposta(t, abrir) {
  const m = modo => abrir ? `data-acao="abrir-resp" data-id="${t.id}" data-modo="${modo}"` : modo === 'naofiz' ? 'data-acao="naofiz"' : `data-acao="resp-modo" data-modo="${modo}"`;
  if (ehTeto(t)) return `<div class="resp4 resp3"><button class="fiz" data-acao="fiz" data-id="${t.id}">Fiquei dentro</button><button ${m('naofiz')}>Passei</button><button ${m('fizparte')}>Informar o valor</button></div>`;
  return `<div class="resp4"><button class="fiz" data-acao="fiz" data-id="${t.id}">Fiz</button><button ${m('fizparte')}>Fiz parte</button><button ${m('naofiz')}>Não fiz</button><button ${m('adiar')}>Adiar</button></div>`;
}

// =====================================================================================================
// 13. A PÁGINA DA TAREFA
// =====================================================================================================
function barrasTeto(tt, grande) {
  const W = 340, H = grande ? 170 : 140, max = Math.max(...tt.semanas.map(s => Math.max(s.comb, s.gasto || 0))) * 1.15, bw = 44, gap = (W - 20 - bw * 5) / 4;
  const y = v => H - 34 - (H - 50) * v / max;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" class="revela">${tt.semanas.map((s, i) => { const x = 10 + i * (bw + gap); const hg = s.gasto ? (H - 34) - y(s.gasto) : 0;
    return `<rect x="${x}" y="${y(s.comb)}" width="${bw}" height="${(H - 34) - y(s.comb)}" rx="6" fill="${s.atual ? '#FFF3EB' : '#EEF1F5'}" ${s.atual ? 'stroke="#FA7A35" stroke-width="1.5"' : ''}/>
      ${s.gasto != null ? `<rect class="cresce" x="${x + 9}" y="${y(s.gasto)}" width="${bw - 18}" height="${hg}" rx="4" fill="${s.gasto > s.comb ? '#9FB0C4' : '#4B6584'}"/>` : ''}
      <line x1="${x - 3}" x2="${x + bw + 3}" y1="${y(s.comb)}" y2="${y(s.comb)}" stroke="#20344C" stroke-dasharray="3 3"/>
      <text x="${x + bw / 2}" y="${H - 20}" text-anchor="middle" font-size="10.5" fill="${s.atual ? '#20344C' : '#6B6A66'}" font-weight="${s.atual ? 600 : 400}">${s.rot.replace('Semana ', 'sem. ')}</text>
      <text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#6B6A66">${s.gasto != null ? nf0.format(s.gasto) : '—'} / ${nf0.format(s.comb)}</text>`; }).join('')}</svg>
    <div class="mut" style="display:flex;gap:12px;flex-wrap:wrap"><span><span class="ponto" style="background:#4B6584"></span> gasto</span><span>tracejado: o combinado</span><span>em destaque: a semana atual</span></div>`;
}
function secao(id, titulo, html, abertaPadrao) {
  const aberta = S.tela === 'desk' || (S.ui.abertos[id] != null ? S.ui.abertos[id] : abertaPadrao);
  return `<div class="secao-rec"><div class="tit" data-acao="abre" data-id="${id}"><b>${titulo}</b>${S.tela === 'desk' ? '' : `<span class="mut">${aberta ? '&#9652;' : '&#9662;'}</span>`}</div>${aberta ? `<div style="margin:-2px 0 12px">${html}</div>` : ''}</div>`;
}
function telaTarefa(d, id) {
  const t = tarDe(d, id); if (!t) return '<div class="mut">Tarefa não encontrada.</div>';
  const det = `<div class="card"><div class="grade2"><div class="mini"><span>Categoria</span><b style="font-size:14px">${CATS[t.cat]}</b></div><div class="mini"><span>Para quê</span><b style="font-size:14px">${esc(t.serve)}</b></div>${t.valor ? `<div class="mini"><span>Valor</span><b>${brl(t.valor)}</b></div>` : ''}<div class="mini"><span>Quando</span><b style="font-size:14px">${esc(t.quando)}</b></div>${t.resp ? `<div class="mini"><span>Quem faz</span><b style="font-size:14px">${esc(t.resp)}</b></div>` : ''}<div class="mini"><span>Estado</span><b style="font-size:14px">${estadoTxt[t.status]}</b></div></div>
    ${t.origem ? `<p class="mut" style="margin:10px 0 0">Nasceu de: ${esc(t.origem)}.</p>` : ''}${t.evento ? `<p class="peq" style="margin:8px 0 0">Janela: ${t.evento.janela}. Gatilho: "${t.evento.gatilho}"</p>` : ''}${t.nota ? `<p class="mut" style="margin:8px 0 0">${esc(t.nota)}</p>` : ''}</div>`;
  const resp = ['pendente', 'parcial'].includes(t.status) ? `<div style="margin-bottom:12px">${botoesResposta(t, true)}</div>` : '';
  const lemb = `<div class="card"><div class="entre"><div><b style="color:var(--marinho)">Lembrete</b><div class="mut">${esc(S.ui['lemb-' + t.id] || t.lembrete)}</div></div><select data-campo="lemb-${t.id}" style="max-width:150px;border:1px solid var(--borda);border-radius:10px;padding:6px"><option value="">Mudar</option><option>WhatsApp, no dia, às 9h</option><option>WhatsApp, no dia, às 12h</option><option>WhatsApp, um dia antes, às 19h</option><option>Sem lembrete</option></select></div>${comConsultor() ? `<p class="mut" style="margin:8px 0 0">A ${nomeC(d)} vê o lembrete e pode ajustar a hora e o canal a seu pedido.</p>` : ''}<button class="btn terc" style="margin-top:8px" data-acao="whats" data-cena="lembrete" data-id="${t.id}">Ver como chega no WhatsApp</button></div>`;
  const editar = `<div class="card"><div class="campo"><label>Data</label><input type="date" value="${t.data}" data-campo="edit-${t.id}.data"></div>${t.valor ? `<div class="campo"><label>Valor</label><input type="number" value="${t.valor}" data-campo="edit-${t.id}.valor" ${C.degrau === 'completo' && t.recorrente ? 'disabled' : ''}>${C.degrau === 'completo' && t.recorrente ? `<span class="ajuda">O valor nasceu do plano: mudar passa por uma versão nova (Objetivos › Mudar).</span>` : ''}</div>` : ''}${d.quem.casal ? `<div class="campo"><label>Quem faz</label><select data-campo="edit-${t.id}.resp">${d.quem.nomes.concat(['os dois']).map(n => `<option${t.resp === n ? ' selected' : ''}>${n}</option>`).join('')}</select></div>` : ''}<button class="btn" data-acao="toast" data-txt="Tarefa salva. A próxima ocorrência já sai com o que mudou.">Salvar</button></div>`;
  const roteiro = t.roteiro ? secao('rot-' + t.id, 'O roteiro', `<div class="card"><ol style="margin:0;padding-left:18px">${t.roteiro.map(r => `<li style="margin:6px 0">${esc(r)}</li>`).join('')}</ol></div>`, true) : '';
  const teto = t.teto ? secao('teto-' + t.id, 'As semanas de outubro', `<div class="card">${barrasTeto(t.teto)}<p class="peq" style="margin:8px 0 0">Teto do mês: <b>${brl(t.teto.mes)}</b>. Gasto até agora: <b>${brl(soma(t.teto.semanas.map(s => s.gasto || 0)))}</b>.</p></div>`, true) : '';
  const div = t.divisao && t.divisao.length > 1 ? secao('div-' + t.id, 'A divisão pelos objetivos', `<div class="card">${t.divisao.map(p => `<div class="entre peq" style="padding:5px 0;border-bottom:1px solid var(--areia)"><span>${esc((objDe(d, p.obj) || {}).nome)}</span><b class="num" style="font-size:13.5px">${brl(p.valor)}</b></div>`).join('')}<p class="mut" style="margin:8px 0 0">Um "Fiz" só para o aporte do mês; cada objetivo continua nomeado.</p></div>`, true) : '';
  const par = t.parcelas ? secao('par-' + t.id, 'As parcelas', `<div class="card">${t.parcelas.map(p => `<div class="entre peq" style="padding:5px 0;border-bottom:1px solid var(--areia)"><span>${brl(p.valor)} em ${dataBR(p.data)}, de ${p.resp}</span><span class="chip ${p.status === 'feita' ? 'ok' : ''}">${p.status === 'feita' ? p.quem : 'pendente'}</span></div>`).join('')}<p class="mut" style="margin:8px 0 0">Cada parcela tem o seu lembrete, para quem a faz. A primeira resposta fecha a ocorrência; o outro recebe "Camila marcou: fiz".</p></div>`, true) : '';
  const com = secao('com-' + t.id, `Comentários${t.comentarios.length ? ' (' + t.comentarios.length + ')' : ''}`, `<div class="card">${t.comentarios.map(c => `<div style="padding:6px 0;border-bottom:1px solid var(--areia)"><b style="color:var(--marinho);font-size:13px">${esc(c.quem)}</b> <span class="mut">${dataBR(c.data)}</span><div class="peq">${esc(c.txt)}</div></div>`).join('') || '<div class="mut">Nenhum comentário ainda.</div>'}<div class="linha" style="margin-top:8px"><input type="text" placeholder="Escreva um comentário" style="flex:1;border:1px solid var(--borda);border-radius:10px;padding:8px" data-campo="com-${t.id}"><button class="btn" data-acao="comentar" data-id="${t.id}">Enviar</button></div>${comConsultor() ? `<p class="mut" style="margin:6px 0 0">A ${nomeC(d)} lê e responde aqui.</p>` : ''}</div>`, false);
  const hist = secao('hist-' + t.id, 'Histórico', `<div class="card"><div class="peq" style="padding:4px 0;border-bottom:1px solid var(--areia)">Criada ${t.origem ? 'a partir de ' + esc(t.origem) : 'pelo plano'}</div>${t.hist.map(h => `<div class="peq" style="padding:4px 0;border-bottom:1px solid var(--areia)"><span class="mut">${dataBR(h.data)}</span> · ${esc(h.txt)}</div>`).join('')}</div>`, false);
  return `<span class="cat">${CATS[t.cat]}</span><div class="medio" style="margin:2px 0 10px">${esc(t.titulo)}</div>${t.provisorio ? `<div class="aviso" style="margin-bottom:10px">Ajuste provisório, aguardando a ${nomeC(d)}: ${esc(t.provisorio)}</div>` : ''}${resp}
    ${S.tela === 'desk' ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start"><div>${det}${lemb}${roteiro}${teto}${div}${par}</div><div>${secao('ed-' + t.id, 'Editar', editar, false)}${com}${hist}</div></div>`
    : `${det}${roteiro}${teto}${div}${par}${lemb}${secao('ed-' + t.id, 'Editar', editar, false)}${com}${hist}`}`;
}

// =====================================================================================================
// 14. AS AÇÕES DAS TAREFAS
// =====================================================================================================
function registrar(d, t, status, txt, extra) {
  Object.assign(t, { status, novo: true }, extra || {});
  t.hist.push({ data: HOJE, txt: `${d.quem.leitor} respondeu: ${txt}` });
}
// uma foto da tarefa e do que ela toca (objetivos, semanas do teto, conversas), para o "Desfazer" do toast

function calcLiberdade() {
  const L = S.visit.lib, r = Math.pow(1 + L.taxa / 100, 1 / 12) - 1, n = Math.max(1, (L.parar - L.idade) * 12);
  const precisa = parar => L.modo === 'perpetuidade' ? L.renda / r : L.renda * (1 - Math.pow(1 + r, -((95 - parar) * 12))) / r;
  const chega = fvDe(L.patrimonio, L.aporte, r, n), alvo = precisa(L.parar);
  let idadeOk = null; for (let a = L.parar; a <= 75; a++) { if (fvDe(L.patrimonio, L.aporte, r, (a - L.idade) * 12) >= precisa(a)) { idadeOk = a; break; } }
  const aporteOk = pmtPara(alvo, L.patrimonio, r, n);
  const rendaOk = L.modo === 'perpetuidade' ? chega * r : chega * r / (1 - Math.pow(1 + r, -((95 - L.parar) * 12)));
  return { chega, alvo, idadeOk, aporteOk, rendaOk, trezentos: L.renda * 300 };
}
