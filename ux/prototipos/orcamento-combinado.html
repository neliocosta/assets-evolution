<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento combinado (protótipo)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
/* Protótipo isolado da tela de ajuste do orçamento. Não faz parte do app: serve para explorar a distribuição da
   redução entre as microcategorias. Os números são do exemplo do planejador (R$ 5.800 / 4.000 / 200). Só desktop.
   Paleta refinada (revisão de UX de 15/10): tons do meio para os três grupos; o laranja horizonte fica para traços,
   foco e ação; o futuro em áreas largas vai em aurora; o que sai do presente para o futuro, em pêssego aurora. */
:root{--laranja:#FA7A35;--laranja-tx:#E06600;--marinho:#20344C;--creme:#FDFCFA;--grafite:#555;--legenda:#6B6A66;
  --areia:#F1EEE8;--atencao:#964400;--verde-tx:#22794A;
  --fixas:#4B6584;--ajust:#9FB0C4;--futuro:#F6A06B;--liberado:#FCD9C2;--trilho:#EEF1F5;--campo-borda:#E4E0D8;--hover:#FAF8F4;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--grafite);font:400 15px/1.6 'DM Sans',system-ui,sans-serif}
.pg{max-width:1120px;margin:0 auto;padding:28px 28px 60px}
.rot{font:600 11px 'DM Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--marinho)}
h1{font:600 32px/1.15 Sora,sans-serif;color:var(--marinho);margin:6px 0 8px}
.sub{max-width:820px;margin:0}
.topo{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.alt{display:inline-flex;border:1px solid var(--campo-borda);border-radius:8px;overflow:hidden;background:#fff}
.alt button{border:0;background:none;font:600 13px 'DM Sans';color:var(--marinho);padding:6px 16px;min-height:32px;cursor:pointer}
.alt button[aria-pressed=true]{background:var(--marinho);color:#fff}
.card{background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:20px 22px;margin-top:16px}
.card h2{font:600 17px Sora,sans-serif;color:var(--marinho);margin:0;display:flex;align-items:center;gap:10px}
.card h2 .q{width:8px;height:8px;border-radius:2px}
.num{font-variant-numeric:tabular-nums}
button:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
/* resumo fixo no alto: a sombra de destaque só quando gruda */
.resumo{position:sticky;top:0;z-index:5;margin-top:22px;padding:18px 22px;transition:box-shadow .2s ease-out}
.resumo.grudado{box-shadow:0 4px 10px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10)}
.res-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:center}
.barras{display:grid;grid-template-columns:84px 1fr;row-gap:8px;column-gap:12px;align-items:center;position:relative;padding-top:18px}
.barras .nm{font:500 13px 'DM Sans';color:var(--legenda);text-align:right}
.bar{display:flex;gap:2px;height:24px}
.bar>i{display:block;height:100%;border-radius:3px;font:600 12px/24px Sora,sans-serif;font-style:normal;padding-left:8px;white-space:nowrap;overflow:hidden;
  font-variant-numeric:tabular-nums;transition:width .25s ease-out}
.bar>i:first-child{border-radius:6px 3px 3px 6px}.bar>i:last-child{border-radius:3px 6px 6px 3px}
.s-fix{background:var(--fixas);color:#fff}.s-adj{background:var(--ajust);color:var(--marinho)}
.s-fut{background:var(--futuro);color:var(--marinho)}
.refs{position:absolute;left:96px;right:0;top:12px;bottom:-4px;pointer-events:none}
.refs b{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(32,52,76,.35)}
.refs span{position:absolute;top:-14px;transform:translateX(-50%);font:500 11px 'DM Sans';color:var(--legenda);white-space:nowrap}
.legenda{display:flex;gap:16px;margin:10px 0 0 96px;font:500 12px 'DM Sans';color:var(--legenda)}
.legenda i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.fut-de{font:500 15px Sora,sans-serif;color:var(--legenda)}
.fut-para{font:600 26px Sora,sans-serif;color:var(--laranja-tx)}
.meta-trilho{position:relative;height:6px;border-radius:3px;background:var(--areia);margin:24px 0 10px}
.meta-trilho>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--futuro);transition:width .25s ease-out}
.meta-trilho>b{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;background:var(--marinho);border-radius:1px}
.meta-trilho>b span{position:absolute;bottom:15px;left:1px;transform:translateX(-50%);font:500 11.5px 'DM Sans';color:var(--legenda);white-space:nowrap}
.fut-linhas{font:500 13px/1.7 'DM Sans';color:var(--grafite)}
.fut-linhas strong{font:600 13px Sora,sans-serif;color:var(--marinho)}
.ok{color:var(--verde-tx);font-weight:700}.falta{color:var(--atencao);font-weight:600}
/* bancadas */
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.gh .fato{font-size:13.5px}
.gh .fato strong{font:600 14px Sora,sans-serif;color:var(--marinho)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 2px;padding:8px 12px;background:var(--hover);border-radius:12px;font-size:14px;color:var(--grafite)}
.meta label{font-weight:600;color:var(--marinho)}
.campo{display:inline-flex;align-items:center;border:1px solid var(--campo-borda);border-radius:8px;background:#fff;padding:0 8px;height:32px}
.campo input{border:0;outline:0;width:64px;font:600 14px Sora,sans-serif;color:var(--marinho);text-align:right;background:none;font-variant-numeric:tabular-nums}
.campo.pct input{width:44px}
.campo small{font:500 12px 'DM Sans';color:var(--legenda)}
.campo:focus-within{border-color:var(--fixas);outline:2px solid var(--laranja);outline-offset:1px}
.btxt{border:0;background:none;min-height:32px;padding:6px 10px;border-radius:8px;font:600 13px 'DM Sans';color:var(--marinho);cursor:pointer}
.btxt:hover{background:var(--areia)}.btxt:active{transform:scale(.97)}
.meta [data-ateref]{margin-left:auto}
.estado{font:500 13px 'DM Sans';color:var(--grafite);margin:8px 2px 2px;min-height:22px}
.estado strong{font:600 13px Sora,sans-serif;color:var(--marinho)}
.vazio{color:var(--legenda)}
.linhas{margin-top:8px}
.cab,.ln{display:grid;grid-template-columns:20px minmax(150px,1fr) 80px minmax(240px,2.4fr) 112px 88px;column-gap:16px;align-items:center}
.cab{font:500 12px 'DM Sans';color:var(--legenda);padding:0 8px 8px;border-bottom:1px solid var(--areia)}
.cab span:nth-child(3),.cab span:nth-child(5),.cab span:nth-child(6){text-align:right}
.ln{min-height:44px;padding:0 8px;border-bottom:1px solid var(--areia);transition:background .15s ease-out}
.ln:hover{background:var(--hover)}
.ln input[type=checkbox]{width:16px;height:16px;accent-color:var(--fixas);cursor:pointer;margin:0}
.ln .nome{font:500 14px 'DM Sans';color:var(--grafite);cursor:pointer}
.ln.sel .nome{font-weight:600;color:var(--marinho)}
.v{text-align:right;font:500 13.5px Sora,sans-serif;color:var(--legenda);font-variant-numeric:tabular-nums}
.trilho{position:relative;height:20px}
.vb{position:absolute;left:0;top:6px;height:8px;border-radius:4px;overflow:hidden}
.g-fixas .vb{background:var(--fixas)}.g-ajustaveis .vb{background:var(--ajust)}
.corte{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--liberado);box-shadow:inset 1px 0 0 #fff;transition:width .2s ease-out}
.trilho input[type=range]{position:absolute;left:-7px;top:0;height:20px;margin:0;-webkit-appearance:none;appearance:none;background:none;cursor:pointer}
.trilho input[type=range]::-webkit-slider-runnable-track{height:20px;background:none}
.trilho input[type=range]::-moz-range-track{height:20px;background:none}
.trilho input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:3px;border-radius:50%;background:#fff;
  border:1.5px solid var(--fixas);box-shadow:0 1px 2px rgba(32,52,76,.18);transition:box-shadow .15s ease-out,transform .15s ease-out}
.trilho input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--fixas)}
.trilho input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(75,101,132,.14);transform:scale(1.1)}
.trilho input[type=range]:focus-visible{outline:none}
.trilho input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--laranja)}
.ln:not(.sel) .trilho input[type=range]::-webkit-slider-thumb{width:12px;height:12px;margin-top:4px;border-color:#8193A9;box-shadow:none}
.red{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.ln .campo{height:28px;padding:0 6px;border:1px solid transparent;border-radius:6px;background:none}
.ln .campo:hover{border-color:var(--campo-borda);background:#fff}
.ln .campo:focus-within{border-color:var(--fixas);background:#fff}
.ln .campo input{width:56px;font-size:13.5px}
.ln .campo input::placeholder{color:#B4BFCC}
.ln.travada .campo{background:var(--trilho)}
.trava{width:24px;height:24px;border-radius:6px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#B4BFCC;padding:0}
.ln:not(.sel) .trava{visibility:hidden}
.trava:hover{background:var(--hover);color:var(--fixas)}
.trava[aria-pressed=true]{background:var(--trilho);color:var(--marinho)}
.trava svg{width:14px;height:14px}
.novo{text-align:right;font:500 14px Sora,sans-serif;color:var(--legenda);font-variant-numeric:tabular-nums}
.ln.mudou .novo{font-weight:600;color:var(--marinho)}
.ajustes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{background:#F4F1EC;color:var(--marinho);border-radius:9999px;padding:4px 10px;font:500 13px 'DM Sans'}
.chip b{font:600 13px Sora,sans-serif;margin-left:4px}
.rodape{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap}
.prem{font-size:13.5px;color:var(--legenda);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controles{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
/* modo só com os totais: as linhas são anotações de onde sai a redução, sem valor de hoje por item */
.lm{grid-template-columns:minmax(150px,1fr) minmax(240px,2.4fr) 112px 48px 24px}
.lm-cab{grid-template-columns:minmax(150px,1fr) minmax(240px,2.4fr) 112px 48px 24px}
.lm .nm-in{border:1px solid transparent;border-radius:6px;background:none;font:600 14px 'DM Sans';color:var(--marinho);padding:4px 6px;margin-left:-7px;width:100%}
.lm .nm-in:hover{border-color:var(--campo-borda);background:#fff}
.lm .nm-in:focus{outline:2px solid var(--laranja);outline-offset:1px;border-color:var(--fixas);background:#fff}
.lm .nm-in::placeholder{color:#B4BFCC;font-weight:500}
.lm .vb{width:100%;background:var(--trilho)}
.lm .parte{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--liberado);border-radius:4px;transition:width .2s ease-out}
.pc{text-align:right;font:500 12.5px 'DM Sans';color:var(--legenda);font-variant-numeric:tabular-nums}
.tirar{width:24px;height:24px;border:0;border-radius:6px;background:none;color:#B4BFCC;cursor:pointer;font:500 16px/1 'DM Sans';padding:0}
.tirar:hover{background:var(--hover);color:var(--marinho)}
.sugestoes{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 2px;font:500 13px 'DM Sans';color:var(--legenda)}
.sug{border:1px dashed var(--campo-borda);background:#fff;border-radius:9999px;padding:3px 10px;font:500 13px 'DM Sans';color:var(--marinho);cursor:pointer}
.sug:hover{border-style:solid;border-color:var(--ajust);background:var(--hover)}
.sem-linhas{padding:14px 0 6px;font:500 13px 'DM Sans';color:var(--legenda);border-top:1px solid var(--areia);margin-top:10px}
@media (prefers-reduced-motion:reduce){.lm .parte{transition:none}}
@media (prefers-reduced-motion:reduce){.bar>i,.corte,.meta-trilho>i,.resumo,.trilho input[type=range]::-webkit-slider-thumb{transition:none}}
</style>
</head>
<body>
<div class="pg">
  <div class="topo">
    <div>
      <div class="rot">Gestão financeira · protótipo</div>
      <h1>O orçamento combinado</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="controles">
      <div class="alt" role="group" aria-label="Orçamento da família">
        <button type="button" data-modo="detalhe" aria-pressed="true">Detalhado</button>
        <button type="button" data-modo="macro" aria-pressed="false">Só os totais</button>
      </div>
      <div class="alt" role="group" aria-label="Período">
        <button type="button" data-per="1" aria-pressed="true">Mês</button>
        <button type="button" data-per="12" aria-pressed="false">Ano</button>
      </div>
    </div>
  </div>

  <div id="sentinela"></div>
  <section class="card resumo" aria-label="Resumo do orçamento">
    <div class="res-grid">
      <div>
        <div class="barras" id="barras"></div>
        <div class="legenda" aria-hidden="true">
          <span><i style="background:var(--fixas)"></i>Fixas</span><span><i style="background:var(--ajust)"></i>Ajustáveis</span>
          <span><i style="background:var(--futuro)"></i>Futuro</span>
        </div>
      </div>
      <div id="futBloco" aria-live="polite"></div>
    </div>
  </section>

  <section class="card g-fixas" id="g-fixas"></section>
  <section class="card g-ajustaveis" id="g-ajustaveis"></section>

  <section class="card">
    <h2>Ajustes combinados</h2>
    <div class="ajustes" id="ajustes"></div>
    <div class="rodape">
      <div class="prem">
        <span>Premissa do protótipo: os sonhos pedem</span>
        <span class="campo"><small>R$</small><input id="sonhos" inputmode="numeric" aria-label="Quanto os sonhos pedem por período"></span>
        <small id="sonhosPer">por mês</small>
      </div>
      <button type="button" class="btxt" id="zerar">Voltar ao de hoje</button>
    </div>
  </section>
</div>

<script>
// Exemplo do planejador: fixas R$ 5.800, ajustáveis R$ 4.000 e R$ 200 para o futuro; a referência é 5.000 / 3.000 / 2.000.
// Tudo é guardado por mês; o modo Ano só multiplica por 12 o que aparece e divide por 12 o que se digita.
// Dois modos: "Detalhado" (a família trouxe as microcategorias) e "Só os totais" (só o total das fixas e o das
// ajustáveis). Nos totais, a meta do grupo já é a decisão; as linhas só anotam de onde ela sai, sem valor de hoje por item.
const REF = { fixas: 0.5, ajustaveis: 0.3, futuro: 0.2 };
const DET = {
  fixas: { nome: 'Despesas fixas', curto: 'Fixas', cor: 'var(--fixas)', itens: [
    ['aluguel', 'Aluguel', 2400], ['saude', 'Plano de saúde', 1150], ['escola', 'Escola', 950],
    ['condominio', 'Condomínio', 650], ['carro', 'Carro e transporte', 450], ['seguros', 'Seguros', 200]] },
  ajustaveis: { nome: 'Despesas ajustáveis', curto: 'Ajustáveis', cor: 'var(--ajust)', itens: [
    ['mercado', 'Mercado', 1500], ['restaurantes', 'Restaurantes', 800], ['viagens', 'Viagens', 600],
    ['lazer', 'Lazer', 500], ['compras', 'Compras', 400], ['assinaturas', 'Assinaturas', 200]] },
};
for (const k in DET) DET[k].itens = DET[k].itens.map(([id, nome, valor]) => ({ id, nome, valor, sel: false, trava: false, corte: 0 }));
// as categorias típicas viram sugestões de escuta: um clique cria a linha de anotação
const MAC = {
  fixas: { nome: 'Despesas fixas', curto: 'Fixas', cor: 'var(--fixas)', total: 5800, itens: [],
    sugestoes: ['Aluguel', 'Condomínio', 'Plano de saúde', 'Escola', 'Transporte', 'Seguros'] },
  ajustaveis: { nome: 'Despesas ajustáveis', curto: 'Ajustáveis', cor: 'var(--ajust)', total: 4000, itens: [],
    sugestoes: ['Mercado', 'Restaurantes', 'Lazer', 'Viagens', 'Compras', 'Assinaturas'] },
};
const FUTURO_HOJE = 200;
let MODO = 'detalhe', PER = 1, SONHOS = 2400, NOVO_ID = 0;
const GR = () => MODO === 'detalhe' ? DET : MAC;
const macro = () => MODO === 'macro';
const soma = (l, f) => l.reduce((a, x) => a + f(x), 0);
const hoje = k => GR()[k].total != null ? GR()[k].total : soma(GR()[k].itens, i => i.valor);
const RENDA = soma(Object.values(DET), g => soma(g.itens, i => i.valor)) + FUTURO_HOJE;
const ref = k => RENDA * REF[k];
const excesso = k => Math.max(0, hoje(k) - ref(k));
for (const m of [DET, MAC]) for (const k in m) m[k].meta = Math.max(0, (m[k].total != null ? m[k].total : soma(m[k].itens, i => i.valor)) - RENDA * REF[k]);

const fmt = v => 'R$ ' + Math.round(v * PER).toLocaleString('pt-BR');
const num = s => { const n = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const corteTotal = k => soma(GR()[k].itens, i => i.corte);
// quanto o grupo de fato reduz: no detalhado, o que foi distribuído; nos totais, a meta inteira
const reducao = k => macro() ? GR()[k].meta : corteTotal(k);
const liberado = () => reducao('fixas') + reducao('ajustaveis');
const combinado = k => k === 'futuro' ? FUTURO_HOJE + liberado() : hoje(k) - reducao(k);

// A redução do grupo (a meta) se divide entre os itens marcados. Os itens travados (os que o consultor arrastou ou
// digitou) ficam com o valor dado; o resto se divide por igual entre os outros marcados, sem passar do valor de cada um.
// Nos totais, todas as linhas estão marcadas e o teto de cada uma é a própria meta.
function distribuir(k) {
  const g = GR()[k], sel = g.itens.filter(i => i.sel);
  g.itens.forEach(i => { if (!i.sel) { i.corte = 0; i.trava = false; } });
  let trav = sel.filter(i => i.trava);
  if (soma(trav, i => i.corte) > g.meta + 0.01) { trav.forEach(i => i.trava = false); trav = []; }
  let resto = g.meta - soma(trav, i => i.corte), pool = sel.filter(i => !i.trava);
  pool.forEach(i => i.corte = 0);
  while (pool.length && resto > 0.005) {
    const parte = resto / pool.length, cheios = pool.filter(i => i.valor <= parte);
    if (!cheios.length) { pool.forEach(i => i.corte = parte); resto = 0; break; }
    cheios.forEach(i => { i.corte = i.valor; resto -= i.valor; });
    pool = pool.filter(i => !cheios.includes(i));
  }
  g.falta = resto > 0.5 ? resto : 0;
}

const CADEADO = aberto => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="${aberto ? 'M10.5 7V5a2.5 2.5 0 0 1 5 0' : 'M5.5 7V5a2.5 2.5 0 0 1 5 0v2'}"/></svg>`;
const MAIOR = Math.max(...Object.values(DET).flatMap(g => g.itens.map(i => i.valor)));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function montarGrupo(k) {
  const g = GR()[k], el = document.getElementById('g-' + k);
  const linhaDet = i => `
      <div class="ln" data-id="${i.id}">
        <input type="checkbox" id="ck-${i.id}" aria-label="Reduzir de ${i.nome}">
        <label class="nome" for="ck-${i.id}">${i.nome}</label>
        <span class="v"></span>
        <div class="trilho"><div class="vb" style="width:${i.valor / MAIOR * 100}%"><div class="corte"></div></div>
          <input type="range" min="0" max="${i.valor}" step="any" style="width:calc(${i.valor / MAIOR * 100}% + 14px)" aria-label="Novo valor de ${i.nome}"></div>
        <div class="red">
          <span class="campo"><small>−R$</small><input data-corte inputmode="numeric" placeholder="0" aria-label="Quanto reduzir de ${i.nome}"></span>
          <button type="button" class="trava" aria-pressed="false" aria-label="Travar a redução de ${i.nome}" title="Travado: este item fica com o valor dado e os outros se ajustam"></button>
        </div>
        <span class="novo"></span>
      </div>`;
  const linhaMac = i => `
      <div class="ln lm sel" data-id="${i.id}">
        <input class="nm-in" value="${esc(i.nome)}" placeholder="De onde sai?" aria-label="Nome do ajuste">
        <div class="trilho"><div class="vb"><div class="parte"></div></div>
          <input type="range" min="0" step="any" style="width:calc(100% + 14px)" aria-label="Parte da redução que sai deste item"></div>
        <div class="red">
          <span class="campo"><small>−R$</small><input data-corte inputmode="numeric" placeholder="0" aria-label="Quanto reduzir deste item"></span>
          <button type="button" class="trava" aria-pressed="false" aria-label="Travar a redução deste item" title="Travado: este item fica com o valor dado e os outros se ajustam"></button>
        </div>
        <span class="pc"></span>
        <button type="button" class="tirar" aria-label="Tirar esta anotação" title="Tirar">×</button>
      </div>`;
  const usados = g.itens.map(i => i.nome);
  el.innerHTML = `
    <div class="gh"><h2><span class="q" style="background:${g.cor}"></span>${g.nome}</h2><div class="fato" data-fato></div></div>
    <div class="meta">
      <label for="meta-${k}">Liberar</label>
      <span class="campo"><small>R$</small><input id="meta-${k}" data-meta inputmode="numeric"></span>
      <span>ou</span>
      <span class="campo pct"><input data-pct inputmode="decimal" aria-label="Liberar em porcentagem das ${g.curto.toLowerCase()}"><small>%</small></span>
      <span>das ${g.curto.toLowerCase()}</span>
      <button type="button" class="btxt" data-ateref>Até a referência</button>
      <button type="button" class="btxt" data-igual>Dividir por igual</button>
    </div>
    <div class="estado" data-estado aria-live="polite"></div>
    ${macro() ? `
    <div class="sugestoes"><span>De onde sai? Anote com o cliente:</span>
      ${g.sugestoes.filter(s => !usados.includes(s)).map(s => `<button type="button" class="sug" data-sug="${esc(s)}">+ ${s}</button>`).join('')}
      <button type="button" class="sug" data-outro>+ Outro</button>
    </div>
    ${g.itens.length ? `<div class="linhas">
      <div class="cab lm-cab" aria-hidden="true"><span>Item</span><span>Parte da redução</span><span style="text-align:right">Reduz</span><span></span><span></span></div>
      ${g.itens.map(linhaMac).join('')}</div>`
      : `<div class="sem-linhas">Sem anotação, a redução vale para o total das ${g.curto.toLowerCase()}.</div>`}`
    : `<div class="linhas">
      <div class="cab" aria-hidden="true"><span></span><span>Item</span><span>Hoje</span><span></span><span>Reduz</span><span>Novo</span></div>
      ${g.itens.map(linhaDet).join('')}
    </div>`}`;
  const meta = el.querySelector('[data-meta]'), pct = el.querySelector('[data-pct]');
  meta.addEventListener('change', () => { const n = num(meta.value); if (n != null) { g.meta = Math.min(Math.max(0, n / PER), hoje(k)); distribuir(k); } tudo(); });
  pct.addEventListener('change', () => { const n = num(pct.value); if (n != null) { g.meta = Math.min(Math.max(0, n), 100) / 100 * hoje(k); distribuir(k); } tudo(); });
  el.querySelector('[data-ateref]').onclick = () => { g.meta = excesso(k); distribuir(k); tudo(); };
  el.querySelector('[data-igual]').onclick = () => { g.itens.forEach(i => i.trava = false); distribuir(k); tudo(); };
  const nova = nome => { const i = { id: 'm' + (++NOVO_ID), nome, valor: Infinity, sel: true, trava: false, corte: 0 }; g.itens.push(i); distribuir(k); montarGrupo(k); tudo(); return i; };
  el.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => nova(b.dataset.sug));
  const outro = el.querySelector('[data-outro]');
  if (outro) outro.onclick = () => { const i = nova(''); el.querySelector(`[data-id="${i.id}"] .nm-in`).focus(); };
  g.itens.forEach(i => {
    const ln = el.querySelector(`[data-id="${i.id}"]`);
    const ck = ln.querySelector('input[type=checkbox]');
    if (ck) ck.addEventListener('change', e => { i.sel = e.target.checked; i.trava = false; distribuir(k); tudo(); });
    // Arrastar ou digitar num item marca e trava o item; o teto é o que a meta ainda deixa (descontados os outros travados).
    const fixar = corte => {
      const outros = soma(g.itens.filter(x => x !== i && x.sel && x.trava), x => x.corte);
      i.sel = true; i.trava = true; i.corte = Math.min(Math.max(0, corte), i.valor, Math.max(0, g.meta - outros));
      distribuir(k); tudo();
    };
    ln.querySelector('input[type=range]').addEventListener('input', e => fixar(Math.round((macro() ? +e.target.value : i.valor - +e.target.value) / 10) * 10));
    ln.querySelector('[data-corte]').addEventListener('change', e => { const n = num(e.target.value); fixar(n == null ? 0 : n / PER); });
    ln.querySelector('.trava').onclick = () => { i.trava = !i.trava; distribuir(k); tudo(); };
    const nm = ln.querySelector('.nm-in');
    if (nm) nm.addEventListener('input', e => { i.nome = e.target.value; pintarAjustes(); });
    const tirar = ln.querySelector('.tirar');
    if (tirar) tirar.onclick = () => { g.itens = g.itens.filter(x => x !== i); distribuir(k); montarGrupo(k); tudo(); };
  });
}

function pintarGrupo(k) {
  const g = GR()[k], el = document.getElementById('g-' + k), ex = hoje(k) - ref(k);
  el.querySelector('[data-fato]').innerHTML = `Hoje <strong>${fmt(hoje(k))}</strong> · referência ${fmt(ref(k))} (${REF[k] * 100}%) · `
    + (ex > 0.5 ? `<strong>${fmt(ex)}</strong> acima` : ex < -0.5 ? `${fmt(-ex)} abaixo` : 'na referência');
  const meta = el.querySelector('[data-meta]'), pct = el.querySelector('[data-pct]');
  if (document.activeElement !== meta) meta.value = Math.round(g.meta * PER).toLocaleString('pt-BR');
  if (document.activeElement !== pct) pct.value = (g.meta / hoje(k) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  const sel = g.itens.filter(i => i.sel), nSel = sel.length, dist = corteTotal(k);
  const igual = nSel > 1 && sel.every(i => Math.abs(i.corte - sel[0].corte) < 0.5);
  const qtos = `${nSel} ${nSel > 1 ? 'itens' : 'item'}${igual ? `, ${fmt(sel[0].corte)} em cada` : ''}`;
  el.querySelector('[data-estado]').innerHTML = g.meta < 0.5 ? '<span class="vazio">Sem redução neste grupo.</span>'
    : macro() ? (!nSel ? `<span class="ok">✓</span> <strong>${fmt(g.meta)}</strong> a menos no total das ${g.curto.toLowerCase()}.`
      : g.falta ? `<span class="ok">✓</span> <strong>${fmt(dist)}</strong> anotados em ${qtos}; <strong>${fmt(g.falta)}</strong> sem item definido.`
      : `<span class="ok">✓</span> <strong>${fmt(dist)}</strong> anotados em ${qtos}.`)
    : !nSel ? `<span class="vazio">Marque de quais itens sai a redução de ${fmt(g.meta)}.</span>`
    : g.falta ? `<span class="falta">Faltam ${fmt(g.falta)} para chegar aos ${fmt(g.meta)}.</span> Destrave um item ou marque outro.`
    : `<span class="ok">✓</span> <strong>${fmt(dist)}</strong> distribuídos entre ${qtos}.`;
  g.itens.forEach(i => {
    const ln = el.querySelector(`[data-id="${i.id}"]`);
    ln.classList.toggle('sel', i.sel);
    ln.classList.toggle('travada', i.sel && i.trava);
    ln.classList.toggle('mudou', i.corte > 0.5);
    const r = ln.querySelector('input[type=range]'), c = ln.querySelector('[data-corte]');
    const t = ln.querySelector('.trava'); t.setAttribute('aria-pressed', i.trava); t.innerHTML = CADEADO(!i.trava);
    if (document.activeElement !== c) c.value = i.sel ? Math.round(i.corte * PER).toLocaleString('pt-BR') : '';
    const parte = g.meta > 0.5 ? Math.round(i.corte / g.meta * 100) : 0;
    if (macro()) {
      ln.querySelector('.parte').style.width = (g.meta > 0.5 ? i.corte / g.meta * 100 : 0) + '%';
      r.max = g.meta; if (document.activeElement !== r) r.value = i.corte;
      r.setAttribute('aria-valuetext', `reduz ${fmt(i.corte)}, ${parte}% da redução`);
      ln.querySelector('.pc').textContent = parte + '%';
      return;
    }
    const novo = i.valor - i.corte;
    ln.querySelector('input[type=checkbox]').checked = i.sel;
    ln.querySelector('.v').textContent = fmt(i.valor);
    ln.querySelector('.corte').style.width = (i.corte / i.valor * 100) + '%';
    if (document.activeElement !== r) r.value = novo;
    r.setAttribute('aria-valuetext', `${fmt(novo)}, reduz ${fmt(i.corte)}` + (i.sel && g.meta > 0.5 ? `, ${parte}% da meta` : ''));
    ln.querySelector('.novo').textContent = fmt(novo);
  });
}

function pintarResumo() {
  const lib = liberado();
  const seg = (cls, v, rotulo) => { const w = v / RENDA * 100; return w > 0.05 ? `<i class="${cls}" style="width:${w}%">${w > 13 ? rotulo : ''}</i>` : ''; };
  const linhas = [
    ['Hoje', [['s-fix', hoje('fixas')], ['s-adj', hoje('ajustaveis')], ['s-fut', FUTURO_HOJE]]],
    ['Combinado', [['s-fix', combinado('fixas')], ['s-adj', combinado('ajustaveis')], ['s-fut', FUTURO_HOJE + lib]]],
  ];
  document.getElementById('barras').innerHTML = linhas.map(([n, segs]) => `<span class="nm">${n}</span><div class="bar" role="img" aria-label="${n}: fixas ${fmt(segs[0][1])}, ajustáveis ${fmt(segs[1][1])}, futuro ${fmt(segs[2][1])}">${
      segs.map(([c, v, p]) => seg(c, v, (p || '') + fmt(v))).join('')}</div>`).join('')
    + `<div class="refs" aria-hidden="true"><b style="left:50%"></b><span style="left:50%">50%</span><b style="left:80%"></b><span style="left:80%">80%</span></div>`;
  const fut = combinado('futuro'), regra = RENDA * REF.futuro, escala = Math.max(SONHOS, regra) * 1.1;
  const marcos = [['20%', 'os 20%', regra], ['sonhos', 'os sonhos', SONHOS]].sort((a, b) => a[2] - b[2]);
  const origem = ['fixas', 'ajustaveis'].filter(k => reducao(k) > 0.5).map(k => `${fmt(reducao(k))} das ${GR()[k].curto.toLowerCase()}`);
  document.getElementById('futBloco').innerHTML = `<div class="rot">Para o futuro</div>
    <div><span class="fut-de num">${fmt(FUTURO_HOJE)} →</span> <span class="fut-para num">${fmt(fut)}</span></div>
    <div class="meta-trilho"><i style="width:${Math.min(fut / escala, 1) * 100}%"></i>${marcos.map(([c, , v]) => `<b style="left:${v / escala * 100}%"><span>${c}</span></b>`).join('')}</div>
    <div class="fut-linhas">${origem.length ? `<strong>+${fmt(lib)}</strong> liberados: ${origem.join(' e ')}<br>` : ''}${
      marcos.map(([, n, v]) => fut >= v - 0.5 ? `<span class="ok">✓</span> ${n} alcançados (${fmt(v)})`
        : `faltam <span class="falta">${fmt(v - fut)}</span> para ${n} (${fmt(v)})`).join(' · ')}</div>`;
}

function pintarAjustes() {
  const l = [];
  for (const k in GR()) {
    const g = GR()[k];
    g.itens.filter(i => i.corte > 0.5).forEach(i => l.push([i.nome || 'Sem nome', i.corte]));
    if (macro() && g.meta - corteTotal(k) > 0.5) l.push([g.itens.length ? `${g.curto}, sem item definido` : g.curto, g.meta - corteTotal(k)]);
  }
  document.getElementById('ajustes').innerHTML = l.length ? l.map(([n, v]) => `<span class="chip">${esc(n)}<b>−${fmt(v)}</b></span>`).join('')
    : '<span class="vazio">Nenhum ajuste ainda.</span>';
  const s = document.getElementById('sonhos');
  if (document.activeElement !== s) s.value = Math.round(SONHOS * PER).toLocaleString('pt-BR');
  document.getElementById('sonhosPer').textContent = PER === 12 ? 'por ano' : 'por mês';
}

function tudo() {
  document.getElementById('sub').textContent = macro()
    ? 'A família trouxe só os totais. Decida quanto liberar em cada grupo; se quiser, anote com o cliente de onde sai, e a redução se divide por igual entre as anotações.'
    : 'Decida quanto liberar em cada grupo e de quais itens isso sai. Marque um item e ele leva toda a redução; marque vários e ela se divide por igual. Arraste a bolinha de um item para ele levar mais ou menos, e os outros se ajustam.';
  pintarResumo(); for (const k in GR()) pintarGrupo(k); pintarAjustes();
}

document.querySelectorAll('[data-per]').forEach(b => b.onclick = () => {
  PER = +b.dataset.per; document.querySelectorAll('[data-per]').forEach(x => x.setAttribute('aria-pressed', x === b)); tudo();
});
document.querySelectorAll('[data-modo]').forEach(b => b.onclick = () => {
  MODO = b.dataset.modo; document.querySelectorAll('[data-modo]').forEach(x => x.setAttribute('aria-pressed', x === b));
  for (const k in GR()) montarGrupo(k); tudo();
});
document.getElementById('sonhos').addEventListener('change', e => { const n = num(e.target.value); if (n != null) SONHOS = Math.max(0, n / PER); tudo(); });
document.getElementById('zerar').onclick = () => {
  for (const k in GR()) { const g = GR()[k]; g.meta = excesso(k); if (macro()) g.itens = []; g.itens.forEach(i => { i.sel = false; i.trava = false; i.corte = 0; }); distribuir(k); montarGrupo(k); }
  tudo();
};
// o resumo ganha a sombra de destaque só quando gruda no alto
new IntersectionObserver(([e]) => document.querySelector('.resumo').classList.toggle('grudado', !e.isIntersecting)).observe(document.getElementById('sentinela'));
for (const k in GR()) { montarGrupo(k); distribuir(k); }
tudo();
</script>
</body>
</html>
