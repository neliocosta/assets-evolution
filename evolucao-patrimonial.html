const fecharRevisao = () => { document.getElementById('propModal').hidden = true; };
document.addEventListener('click', e => {
  const ver = e.target.closest('[data-ver]');
  if (ver && ver.closest('#propBar')) { VER = ver.dataset.ver; aplicaVista(); return; }
  const rm = e.target.closest('[data-rm]');
  if (rm && PROP) { PROP.ops.splice(+rm.dataset.rm, 1); salvaProposta(); aplicaVista(); if (PROP.ops.length) abrirRevisao(); else fecharRevisao(); return; }
  const bt = e.target.closest('[data-prop]'); if (!bt) return;
  if (bt.dataset.prop === 'fechar') { fecharRevisao(); return; }
  if (!PROP) return;
  const a = bt.dataset.prop;
  if (a === 'revisar') abrirRevisao();
  else if (a === 'fechar') fecharRevisao();
  else if (a === 'enviar') { PROP.mensagem = (document.getElementById('propMsg') || {}).value || ''; PROP.status = 'pendente'; PROP.enviadaEm = new Date().toISOString(); salvaProposta(); fecharRevisao(); desenhaPropBar(); avisar('Proposta enviada ao seu consultor.'); }
  else if (a === 'cancelar') { PROP.status = 'rascunho'; delete PROP.enviadaEm; salvaProposta(); desenhaPropBar(); avisar('Envio cancelado. A proposta voltou para você.'); }
  else if (a === 'descartar') {   // dois cliques: o primeiro pede confirmação no próprio botão
    if (!bt.dataset.armed) { bt.dataset.armed = '1'; bt.textContent = 'Descartar tudo? Clique de novo'; return; }
    PROP = null; salvaProposta(); aplicaVista(); avisar('Proposta descartada.');
  }
  else if (a === 'ok') { PROP = null; salvaProposta(); VER = 'proposta'; aplicaVista(); }
  else if (a === 'atualizar') {   // o plano com a resposta ainda não chegou a esta tela: busca o último gravado
    const novo = ARMAZEM.ler('plano');
    if (novo && (novo.propostas || []).some(x => x.id === PROP.id)) trocaBase(novo);
    else avisar('O plano atualizado ainda não chegou. Ele aparece aqui assim que o consultor gravar.');
  }
});
document.getElementById('propModal').addEventListener('mousedown', e => { if (e.target.id === 'propModal') fecharRevisao(); });

// mês do plano e o texto AAAA-MM do campo de mês
const ymDoMes = mi => { const d = new Date(2026, 8 + mi, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const mesDoYm = t => { const m = /^(\d{4})-(\d{2})$/.exec(t || ''); return m ? (+m[1] - 2026) * 12 + (+m[2] - 1) - 8 : NaN; };

// ---- Calculadora de proposta ----
// Junto a cada cálculo que o cliente pode propor mudar há um ícone discreto (calcIco); na célula do fluxo de caixa, o
// próprio clique. Abre uma janela com a conta: o cliente mexe nos valores e vê o resultado na hora, sem gravar nada; se
// quiser, envia ao consultor com observações.
// Cada calculadora é uma função em CALCS que recebe o argumento do ícone (o id do objetivo, a célula) e devolve
//   { titulo, sub, campos, resultado(P, mudou) → html, alteracoes?(v), acoes?, aoEnviar?, lento?, rascunho?, lado? }
// (rascunho: inclui nas mudanças sem enviar; lado: abre como painel do lado direito, os campos em cima do resultado)
// Cada campo tem a chave k (ou o caminho do plano), o rótulo, o formato ('reais' | 'numero' | 'mes' | 'texto' | 'lista' |
// 'opcoes'), o valor à vista e o do plano aprovado (de, deTexto); mostra(v), quando existe, diz se o campo aparece. O campo mudado vira a alteração alt(v) ou, sem ela,
// uma alteração 'campo' com o caminho e o nome oque; alteracoes(v), quando existe, monta todas a partir dos valores.
// O resultado vem do plano à vista com as alterações aplicadas pelo motor (ENGINE.aplicaAlteracoes): são as mesmas que o
// consultor aprova em Propostas do cliente. lento: a conta roda a simulação inteira, e espera o cliente parar de digitar.
const CALCS = {};
let CALC = null;   // { cfg, v: chave → valor digitado, base: a simulação do plano à vista }
const ICO_CALC = '<svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>';
const calcIco = id => PAPEL === 'cliente' ? `<button class="calc-ico" data-calc="${escH(id)}" title="Simular outros valores e propor ao consultor" aria-label="Simular outros valores e propor ao consultor">${ICO_CALC}</button>` : '';
const calcFmt = (c, v) => v == null ? '' : c.formato === 'reais' ? fmt(v) : c.formato === 'lista' ? [].concat(v).join(', ') : c.formato === 'mes' ? ymDoMes(v) : String(v);
// o texto digitado no valor do campo; undefined: vazio ou inválido, vale o valor à vista
function calcLe(c, t) {
  if (c.formato === 'texto' || c.formato === 'opcoes') return String(t).trim();
  if (String(t).trim() === '') return c.formato === 'lista' ? [] : c.vazio ? null : undefined;
  if (c.formato === 'lista') return String(t).split(',').map(x => x.trim()).filter(Boolean);
  const v = c.formato === 'reais' ? lerReais(t) : c.formato === 'mes' ? mesDoYm(t) : +t;
  return isFinite(v) && !(c.min != null && v < c.min) && !(c.max != null && v > c.max) ? v : undefined;
}
const calcValor = c => CALC.v[c.k] !== undefined ? CALC.v[c.k] : c.valor;
const calcMudou = c => { const v = CALC.v[c.k]; if (v === undefined) return false; if (typeof v !== 'number' || c.valor == null) return JSON.stringify(v) !== JSON.stringify(c.valor == null ? (c.formato === 'lista' ? [] : null) : c.valor); return Math.round(v) !== Math.round(c.valor); };
function calcAlts() {
  const cfg = CALC.cfg;
  if (cfg.alteracoes) return cfg.alteracoes(Object.fromEntries(cfg.campos.map(c => [c.k, calcValor(c)])));
  return cfg.campos.filter(calcMudou).map(c => c.alt ? c.alt(CALC.v[c.k]) : Object.assign({ tipo: 'campo', caminho: c.caminho, rotulo: c.oque, formato: c.formato, de: c.de, para: CALC.v[c.k] }, c.deTexto ? { deTexto: c.deTexto } : {}));
}
// o plano à vista com as alterações da janela
// (a linha nova da proposta muda no lugar dela, como em proporAlteracao, para as mudanças de valor nela continuarem valendo)
function calcPlano() {
  const P = structuredClone(BASE), ops = (VER === 'proposta' && temAlteracoes() ? PROP.ops : []).slice();
  calcAlts().forEach(a => { const i = a.acao === 'nova' ? ops.findIndex(o => o.acao === 'nova' && o.lista === a.lista && o.id === a.id) : -1; if (i >= 0) ops[i] = a; else ops.push(a); });
  ENGINE.aplicaAlteracoes(P, ops); return P;
}
function abrirCalc(id, arg) {
  const cfg = CALCS[id] && CALCS[id](arg); if (!cfg) return;
  cfg.campos.forEach(c => { c.k = c.k || c.caminho; });
  CALC = { cfg, v: {} };
  const pend = PROP && PROP.status === 'pendente', outras = PROP && PROP.status === 'rascunho' ? PROP.ops.length : 0;
  let grupo = null;
  const campo = c => {
    const at = `data-cf="${escH(c.k)}"`, val = escH(calcFmt(c, c.valor)), ph = escH(c.placeholder || '');
    const ctl = c.formato === 'opcoes' ? `<select ${at}>${c.opcoes.map(([v, t]) => `<option value="${escH(v)}"${v === c.valor ? ' selected' : ''}>${escH(t)}</option>`).join('')}</select>`
      : `<input ${at} ${c.formato === 'numero' ? `type="number"${c.min != null ? ' min="' + c.min + '"' : ''}${c.max != null ? ' max="' + c.max + '"' : ''}` : c.formato === 'mes' ? `type="month" min="${ymDoMes(c.min || 0)}"` : c.formato === 'reais' ? 'inputmode="decimal"' : ''} value="${val}" placeholder="${ph}">`;
    const dica = c.formato === 'opcoes' ? '' : `<small>no plano: ${escH(c.deTexto || calcFmt(c, c.de) || '—')}</small>`;
    return (c.grupo && c.grupo !== grupo ? `<h5>${escH(grupo = c.grupo)}</h5>` : '') + `<label>${escH(c.rotulo)}${ctl}${dica}</label>`;
  };
  const acoes = pend ? '' : (cfg.acoes || []).map(([t], i) => `<button class="calc-volta calc-acao" data-calc-extra="${i}">${escH(t)}</button>`).join('');
  document.getElementById('calcModalC').innerHTML = `<h3>${escH(cfg.titulo)}</h3><div class="muted">${cfg.sub}</div>
    <div class="calc-g"><div class="calc-campos">${cfg.campos.map(campo).join('')}<button class="calc-volta" data-calc-acao="voltar">Voltar aos valores do plano</button>${acoes}</div><div class="calc-res" id="calcRes"><div class="muted">Calculando…</div></div></div>
    ${cfg.rascunho && !pend ? '<div class="bts"><button class="btn btn-secondary btn-small" data-calc-acao="fechar">Cancelar</button><button class="btn btn-primary btn-small" data-calc-acao="enviar" disabled>Incluir nas mudanças</button></div>' : pend ? '<div class="calc-pend">Sua proposta está com o consultor. Você pode simular à vontade; para propor algo novo, cancele o envio.</div><div class="bts"><button class="btn btn-secondary btn-small" data-calc-acao="fechar">Fechar</button></div>'
      : `<label class="calc-obs">Observações para o consultor (opcional)<textarea id="calcObs" placeholder="${escH(cfg.obs || 'Conte ao consultor o porquê da mudança.')}"></textarea></label>
    ${outras ? `<div class="muted">${outras === 1 ? 'Vai junto a outra alteração que já está' : 'Vão junto as outras ' + outras + ' alterações que já estão'} na sua proposta.</div>` : ''}
    <div class="bts"><button class="btn btn-secondary btn-small" data-calc-acao="fechar">Cancelar</button><button class="btn btn-primary btn-small" data-calc-acao="enviar" disabled>Enviar ao consultor</button></div>`}`;
  document.getElementById('calcModal').classList.toggle('lado', !!cfg.lado); document.getElementById('calcModal').hidden = false;
  document.getElementById('calcModalC').scrollTop = 0;   // a janela é sempre a mesma: abre no alto, não na rolagem da anterior
  calcAtualiza(true);
  const f = document.querySelector('#calcModalC [data-cf]'); if (f) { f.focus(); if (f.select) f.select(); }
}
function calcAtualiza(ja) {
  const alts = calcAlts();
  const vals = Object.fromEntries(CALC.cfg.campos.map(c => [c.k, calcValor(c)]));
  document.querySelectorAll('#calcModalC [data-cf]').forEach(i => { const c = CALC.cfg.campos.find(x => x.k === i.dataset.cf); i.classList.toggle('mudou', calcMudou(c)); if (c.mostra) i.closest('label').hidden = !c.mostra(vals); });
  const env = document.querySelector('[data-calc-acao="enviar"]'); if (env) env.disabled = !alts.length;
  const pinta = () => { if (CALC) document.getElementById('calcRes').innerHTML = CALC.cfg.resultado(calcPlano(), alts.length > 0); };
  clearTimeout(CALC.t);
  if (!CALC.cfg.lento) { pinta(); return; }   // a simulação inteira: a janela aparece antes, e a conta espera o cliente parar de digitar
  if (!ja) document.getElementById('calcRes').classList.add('calc-espera');
  CALC.t = setTimeout(() => { pinta(); document.getElementById('calcRes').classList.remove('calc-espera'); }, ja ? 30 : 250);
}
const fecharCalc = () => { document.getElementById('calcModal').hidden = true; if (CALC) clearTimeout(CALC.t); CALC = null; };
function enviarCalc() {
  const nota = (document.getElementById('calcObs') || { value: '' }).value.trim(), aoEnviar = CALC.cfg.aoEnviar, rascunho = CALC.cfg.rascunho;
  const alts = calcAlts().map(a => nota ? Object.assign(a, { nota }) : a);
  if (!alts.length) { avisar('Mude algum valor antes de enviar.'); return; }
  fecharCalc();
  if (!proporAlteracao(alts, rascunho)) return;
  if (aoEnviar) aoEnviar(alts);
  if (rascunho || !PROP.ops.length) return;   // rascunho: a linha nova do fluxo desbloqueado vai junto quando o cliente salvar e enviar
  PROP.status = 'pendente'; PROP.enviadaEm = new Date().toISOString(); salvaProposta(); desenhaPropBar(); avisar('Proposta enviada ao seu consultor.');
}
document.addEventListener('click', e => {
  const ic = e.target.closest('[data-calc]'); if (ic) { const [id, arg] = ic.dataset.calc.split(/:(.*)/); abrirCalc(id, arg); return; }
  const x = e.target.closest('[data-calc-extra]'); if (x && CALC) { const fn = CALC.cfg.acoes[+x.dataset.calcExtra][1]; fecharCalc(); fn(); return; }
  const b = e.target.closest('[data-calc-acao]'); if (!b || !CALC) return;
  if (b.dataset.calcAcao === 'fechar') fecharCalc();
  else if (b.dataset.calcAcao === 'enviar') enviarCalc();
  else { CALC.v = {}; document.querySelectorAll('#calcModalC [data-cf]').forEach(i => { const c = CALC.cfg.campos.find(x => x.k === i.dataset.cf); i.value = c.formato === 'opcoes' ? c.valor : calcFmt(c, c.valor); }); calcAtualiza(); }
});
document.getElementById('calcModal').addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.cf; if (!k || !CALC) return;
  const c = CALC.cfg.campos.find(x => x.k === k), v = calcLe(c, e.target.value);
  if (v === undefined) delete CALC.v[k]; else CALC.v[k] = v;

document.getElementById('calcModal').addEventListener('mousedown', e => { if (e.target.id === 'calcModal') fecharCalc(); });
document.getElementById('calcModal').addEventListener('keydown', e => { if (e.key === 'Escape') fecharCalc(); });

// O motor guarda um plano por vez. Para a conta da janela, ele roda com o outro plano e volta ao plano da tela (o mesmo
// objeto, os objetivos na mesma ordem e o status de cada um da simulação 'desej', a última do rerun), sem redesenhar nada.
var PLANO_MOTOR = null;   // var: applyPlan, mais acima, já o grava ao abrir a tela
function simulaAParte(P) {
  ENGINE.configure(P); OBJ.sort((a, b) => a.months - b.months);
  const r = ENGINE.run(state.mode), objs = {};
  OBJ.forEach(o => { objs[o.id] = { status: o.status, ratio: o.ratio, real: o.real, required: o.required, amount: +o.amount }; });
  const ff = r.ff ? { age: r.ff.age, mi: r.ff.mi, finBefore: r.ff.finBefore, forced: r.ff.forced, sustentavel: r.ff.sustentavel, desejo: ENGINE.desiredAt(r.ff.mi) } : null;
  if (PLANO_MOTOR) { ENGINE.configure(PLANO_MOTOR); OBJ.sort((a, b) => a.months - b.months); ENGINE.run('desej'); } else aplicaVista();
  return { ff, objs };
}
const calcBase = () => CALC.base || (CALC.base = simulaAParte(planoVista()));
const ffTxt = f => !f ? 'não alcançada' : Math.floor(f.age) + ' anos, ' + ENGINE.mesDoPlano(f.mi);
// a tabela do antes e depois: como está no plano e com os valores da janela (a linha que muda fica marcada)

// os elementos .rev entram quando aparecem na tela (o painel #pagina é o que rola);
// a frase do propósito entra quando a pessoa começa a rolar a página (ou logo, se a página não rola)
let obsLP = null, rolarLP = null, obsDG = null;
function revelar() {
  if (obsLP) obsLP.disconnect();
  if (obsDG) obsDG.disconnect();
  const pg = document.getElementById('pagina'), cit = pg.querySelector('.lp-citacao');
  if (rolarLP) { pg.removeEventListener('scroll', rolarLP); rolarLP = null; }
  if (cit) { if (pg.scrollHeight <= pg.clientHeight + 1) cit.classList.add('vis'); else { rolarLP = () => cit.classList.add('vis'); pg.addEventListener('scroll', rolarLP, { once: true }); } }
  const els = pg.querySelectorAll('.rev'), dgs = pg.querySelectorAll('.hd');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('vis')); dgs.forEach(e => e.classList.add('vis')); return; }
  // o quadro do hoje e depois espera estar bem à vista, para a cascata do futuro acontecer diante da pessoa
  obsDG = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); obsDG.unobserve(e.target); } }), { root: pg, threshold: 0.4 });
  dgs.forEach(e => obsDG.observe(e));
  obsLP = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); obsLP.unobserve(e.target); } }), { root: pg, threshold: 0.12 });
  els.forEach(e => obsLP.observe(e));
}

// ===================== GESTÃO FINANCEIRA =====================
// Três páginas depois da capa (o vídeo teórico): a renda, o custo de vida e o futuro (ENGINE.gestaoFinanceira); o tempo de
// trabalho como moeda (ENGINE.horasDoTrabalho); e o orçamento combinado, onde se decide quanto liberar de cada grupo.
const pctInt = v => Math.round(v * 100) + '%';
const horasTxt = v => Math.round(v).toLocaleString('pt-BR') + ' h';
// o cabeçalho de toda página: o rótulo (o capítulo), o título e o subtítulo (HTML), na mesma posição em todas
const cabPagina = (pg, sub, rot) => `<div class="lp-cab"><div class="lp-rot">${escH(rot || pg.capTitulo)}</div><h1>${escH(pg.titulo)}</h1>${sub ? `<p class="dg-sub">${sub}</p>` : ''}</div>`;
// o relógio do mês: uma marquinha por hora trabalhada; as horas do futuro, em laranja, saem do alto no sentido horário (como
// na rosca da renda) e a marca tracejada fica onde elas deveriam chegar (a referência, 20%); no centro, o valor da hora
function relogioDoMes(p) {
  const n = Math.max(1, Math.min(800, Math.round(p.horas))), fut = Math.max(0, Math.min(n, Math.round(p.futuro))), R = 80, passo = 2 * Math.PI / n;
  const sw = Math.min(1.8, R * passo * 0.55).toFixed(2), xy = (a, r) => [(100 + r * Math.sin(a)).toFixed(1), (100 - r * Math.cos(a)).toFixed(1)];
  let tk = '';
  for (let i = 0; i < n; i++) { const f = i < fut, [x1, y1] = xy(i * passo, f ? R - 12 : R - 7), [x2, y2] = xy(i * passo, R + 8);
    tk += `<line class="tk" style="--d:${(i / n).toFixed(3)}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${f ? '#FA7A35' : '#C3CEDB'}" stroke-width="${f ? (sw * 1.25).toFixed(2) : sw}" stroke-linecap="round"/>`; }
  const ar = ENGINE.ORCAMENTO_IDEAL.futuro * 2 * Math.PI, [r1, s1] = xy(ar, R - 20), [r2, s2] = xy(ar, R + 15);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${escH(p.nome)}: ${horasTxt(p.horas)} no mês, ${horasTxt(Math.max(0, p.futuro))} para o futuro; a hora vale ${fmt(p.valorHora)}">${tk}
    <line x1="${r1}" y1="${s1}" x2="${r2}" y2="${s2}" stroke="#20344C" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="100" y="100" text-anchor="middle" style="font:600 28px Sora,sans-serif;fill:#20344C">${fmt(p.valorHora)}</text>
    <text x="100" y="121" text-anchor="middle" style="font:500 14px 'DM Sans',sans-serif;fill:#6b6a66">a hora</text></svg>`;
}
// a rosca da renda: o padrão de vida e o futuro, com a marca da referência (20% para o futuro)
function roscaRenda(pFut) {
  // o futuro começa no alto e anda no sentido horário; a marca fica onde ele deveria chegar (a referência, 20%)
  const r = 70, C = 2 * Math.PI * r, fut = Math.max(0, Math.min(1, pFut)), ref = ENGINE.ORCAMENTO_IDEAL.futuro, ang = (ref * 360 - 90) * Math.PI / 180;
  const pt = d => [(100 + d * Math.cos(ang)).toFixed(1), (100 + d * Math.sin(ang)).toFixed(1)], [x1, y1] = pt(52), [x2, y2] = pt(88);
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Futuro ${pctInt(fut)}, padrão de vida ${pctInt(1 - fut)} da renda">
    <circle cx="100" cy="100" r="${r}" fill="none" stroke="#DCE3EC" stroke-width="26"/>
    <circle class="seg" cx="100" cy="100" r="${r}" fill="none" stroke="#F6A06B" stroke-width="26" stroke-dasharray="${C * fut} ${C}" transform="rotate(-90 100 100)"/>
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#20344C" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text x="100" y="98" text-anchor="middle" style="font:600 30px Sora,sans-serif;fill:${pFut < 0 ? '#B53434' : '#E06600'}">${pFut < 0 ? '0%' : pctInt(fut)}</text>
    <text x="100" y="120" text-anchor="middle" style="font:500 12px 'DM Sans',sans-serif;fill:#6b6a66">para o futuro</text></svg>`;
}

          <p class="gf-veredito">${veredito}</p></div></div></section>${vz}`; })();
  document.getElementById('pagina').innerHTML = `<div class="rc lp">${cabPagina(pg, `O que entra, o que custa o padrão de vida de ${voces} e o que sobra para construir o futuro.`)}${corpo}${rodapeNav(pg)}</div>`;

// o movimento, quando o gráfico aparece: o bloco marinho cresce, se divide nas cores das caixinhas e cada fatia escorre até

// A referência é até 50% da renda em despesas fixas, até 30% em ajustáveis e pelo menos 20% para o futuro. Em cada grupo,
// decide-se quanto liberar (a meta, em reais ou em % do grupo; começa no que passa da referência) e de quais despesas sai:

// lista: a meta baixa o total, e as linhas são anotações de onde sai, com nome livre (as categorias típicas são sugestões
// de escuta). O que sai do presente vai para o futuro, comparado com os 20% e com o que os objetivos pedem (a soma dos
// aportes necessários). O consultor apresentando grava em plan.orcamento.combinado (a meta e as despesas escolhidas; vale
// o valor só das travadas, as outras se recalculam); o cliente propõe. O Fluxo de caixa não muda.

/// ===================== PÁGINA: FASE DA VIDA E PATRIMÔNIO =====================
// Em que fase da vida financeira o cliente está (e as idades de cada fase) e o patrimônio de hoje num só lugar: o
// total montado classe a classe e comparado ao mínimo, ao esperado e ao máximo para a idade (ENGINE.faseDaVida), com a
// liquidez ideal do consultor ao fundo. Embaixo, uma coluna por classe (instituições, empresas, bens, dívidas);
// cada bem e cada dívida abrem o detalhe: financiamento, situação e a renda que o bem gera.
const PT_ABERTO = new Set();   // colunas com a lista inteira à vista ('col:bens') e itens abertos ('bem:2', 'div:0')
const SITUACAO = { em_dia: ['ok', 'Em dia'], inadimplente: ['critico', 'Inadimplente'] };
const COR_CLASSE = { fin: C.fin, part: C.part, bens: C.bens, div: C.out };
const anosTxt = v => Math.round(v);
// a renda passiva que um bem gera: a linha do fluxo de caixa ligada a ele (equivalente mensal de hoje)
function rendaDoBem(P, b) {
  const it = b && b.renda ? (P.incomes || []).find(x => x.id === b.renda) : null; if (!it) return null;
  const v = ENGINE.mensalizado(Object.assign({}, it, { steps: (it.steps || []).slice().sort((a, c) => a.from - c.from) }), 0);
  return { nome: it.label || 'Renda passiva', v };
}
// onde o total está em relação ao mínimo, ao esperado e ao máximo para a idade
function ondeEsta(f) {
  if (f.fase === 0) return null;
  const t = f.total;
  if (f.maximo === f.minimo) return t >= f.maximo ? ['ok', 'no esperado ou acima'] : ['critico', 'abaixo do esperado'];
  return t < f.minimo ? ['critico', 'abaixo do mínimo'] : t < f.esperado ? ['atencao', 'entre o mínimo e o esperado'] : t <= f.maximo ? ['ok', 'entre o esperado e o máximo'] : ['ok', 'acima do máximo'];
}
// O patrimônio e o ideal para a idade, em barras na mesma escala. Em cima, a escada: cada classe começa onde a anterior
// terminou e as dívidas voltam até o total, para ler soma e não proporção. Embaixo, o mínimo, o esperado e o máximo desta
// fase, com a linha tracejada levando o total até eles. A faixa escura ao fundo é a liquidez ideal do consultor.
function idealHtml(f, fase, onde) {
  const liq = f.liquidezIdeal > 0 ? f.liquidezIdeal : 0, prep = fase && f.fase === 0, bruto = f.fin + f.part + f.bens;
  const daFase = !fase || prep ? [] : f.maximo === f.minimo ? [['Esperado na liberdade financeira', f.esperado, '#F9C9A9']]
    : [['Mínimo desta fase', f.minimo, '#FCE6D8'], ['Esperado para a sua idade', f.esperado, '#F9C9A9'], ['Máximo desta fase', f.maximo, '#F6A06B']]
  const topo = Math.max(1, bruto, liq, ...daFase.map(x => x[1])), x = v => Math.max(0, v) / topo * 100;
  // a escada do patrimônio: as classes se somam uma depois da outra, as dívidas voltam e o que sobra é o total
  const passos = [['Mercado financeiro', 0, f.fin, '#77C094'], ['Participações societárias', f.fin, f.fin + f.part, '#E6BA74'], ['Imóveis e outros bens', f.fin + f.part, bruto, '#7FA1DD']]
    .filter((p, i) => i === 0 || p[2] > p[1]);
  const barra = (rot, de, ate, cor, cls, txt, forte) => `<div class="pi-rot${forte ? ' forte' : ''}">${rot}</div><div class="pi-tr"><i class="pi-b ${cls}" style="left:${x(Math.min(de, ate))}%;width:${Math.abs(x(ate) - x(de))}%;background:${cor}"></i><span class="pi-v" style="left:${x(Math.max(de, ate))}%">${txt}</span></div>`;
  const escada = passos.map(([n, de, ate, c], i) => barra(n, de, ate, c, i ? 'liga' : '', (i ? '+ ' : '') + fmt(ate - de))).join('')
    + (f.dividas ? barra('Dívidas e financiamentos', bruto, f.total, C.out, 'div liga dir', '− ' + fmt(f.dividas)) : '')
    + barra('Patrimônio total', 0, f.total, '#4B6584', passos.length > 1 || f.dividas ? 'liga dir' : '', fmt(f.total), true);
  const linhaTot = 24 + (passos.length + (f.dividas ? 1 : 0)) * 38;   // onde começa a linha do total: 30 px de barra e 8 de vão por linha
  const liqTxt = liq ? 'liquidez ideal · ' + fmt(liq) + (f.fin < liq ? ' · faltam ' + fmt(liq - f.fin) : '') : '';
  return `<div class="pf-ideal"><div class="pi-cab"><div class="pi-nums">
      <div><div class="pf-rot">Patrimônio total</div><div class="pf-big">${fmt(f.total)}<small>${f.dividas ? 'o que a família tem, menos o que deve' : 'tudo o que a família tem hoje'}</small></div></div>
      ${!fase ? '' : prep ? `<div><div class="pf-rot">Esperado para a sua idade</div><div class="pf-big">—<small>Na preparação ainda não há patrimônio esperado: qualquer valor acima de zero é um ótimo começo.</small></div></div>`
        : `<div><div class="pf-rot">Esperado para a sua idade</div><div class="pf-big">${fmt(f.esperado)}<small>para quem tem ${f.idade} anos e está na ${fase.nome.toLowerCase()} · padrão de vida de ${fmt(f.padrao)} por mês, ${vezes(f.mult)}</small></div></div>`}</div>
      ${onde ? `<div class="pi-veredito ${onde[0]}">O seu patrimônio total está <b>${onde[1]}</b>${f.maximo === f.minimo ? '' : ' desta fase'}.</div>` : ''}</div>
    <div class="pi-graf"><div class="pi-fundo">${liq ? `<div class="pi-liq" style="width:${x(liq)}%"><span>${liqTxt}</span></div>` : ''}${daFase.length ? `<div class="pi-tot" style="left:${x(f.total)}%;top:${linhaTot}px"></div>` : ''}</div>
      <div class="pi-linhas">${escada}
        ${daFase.length ? '<div class="pi-sep"></div><div class="pi-sep"></div>' + daFase.map(([n, v, c]) => barra(n, 0, v, c, '', fmt(v))).join('') : ''}</div></div>
    <div class="pi-leg">${liq ? '<span><i style="background:rgba(32,52,76,.16);border-right:1.5px dashed rgba(32,52,76,.5)"></i>liquidez ideal, definida pelo seu consultor</span>' : ''}${daFase.length ? '<span><i style="border-left:1.5px dashed var(--nl-navy-900);width:0;height:12px;border-radius:0"></i>o seu patrimônio total, comparado com a fase</span>' : ''}</div></div>`;
}
// a trilha das cinco fases: o nome em cima, a faixa de idade embaixo, e o cliente na fase em que está
function trilhaHtml(f) {
  return `<div class="pf-trilha">${f.fases.map((x, i) => {
    const on = i === f.fase, cheio = i < f.fase ? 1 : on ? (i === 4 ? Math.min(1, 0.15 + (f.idade - x.de) / 40) : f.progresso) : 0;
    const faixa = i === 0 ? 'até ' + anosTxt(x.ate) + ' anos' : i === 4 ? 'a partir de ' + anosTxt(x.de) : anosTxt(x.de) + ' a ' + anosTxt(x.ate) + ' anos';
    return `<div class="pf-seg${on ? ' on' : i < f.fase ? ' feito' : ''}"><b title="${x.nome}">${x.nome}</b><i><em style="width:${cheio * 100}%"></em>${on ? `<u style="left:${Math.max(4, Math.min(96, cheio * 100))}%" title="você, ${f.idade} anos"></u>` : ''}</i><span>${faixa}</span></div>`;
  }).join('')}</div>`;
}
// uma coluna da composição: o total da classe e os itens, com a parte de cada um
function colunaHtml(id, nome, total, itens, vazio) {
  const todos = PT_ABERTO.has('col:' + id), vis = todos ? itens : itens.slice(0, 4), max = Math.max(1, ...itens.map(x => x.v));
  return `<div class="pf-col"><h4><i style="background:${COR_CLASSE[id]}"></i>${nome}</h4>
    <div class="v">${id === 'div' && total ? '− ' : ''}${fmtK(total)}</div>
    ${itens.length ? vis.map(x => `<button class="pf-it${x.det ? ' clic' : ''}"${x.det ? ` data-pt-abre="${x.chave}"` : ''}><div class="l"><span title="${escH(x.nome)}">${escH(x.nome)}</span><b>${fmtK(x.v)}</b></div>
      <div class="pb"><i style="width:${x.v / max * 100}%;background:${COR_CLASSE[id]};opacity:.55"></i></div>${x.tags ? `<div class="pf-tags">${x.tags}</div>` : ''}
      ${x.det && PT_ABERTO.has(x.chave) ? `<div class="pf-det">${x.det}</div>` : ''}</button>`).join('') : `<div class="pf-vazio">${vazio}</div>`}
    ${itens.length > 4 ? `<button class="pf-mais" data-pt-abre="col:${id}">${todos ? 'mostrar menos' : '+ ' + (itens.length - 4) + ' outros'}</button>` : ''}</div>`;
}
// o detalhe de uma dívida, de um bem financiado ou avulsa
function dividaDet(d) {
  const st = SITUACAO[d.situacao], l = (n, v) => v == null || v === '' ? '' : `<span>${n}</span><b>${v}</b>`;
  return l('Saldo devedor', fmt(+d.saldoDevedor || 0)) + l('Valor liberado', +d.credito ? fmt(+d.credito) : null) + l('Parcelas contratadas', +d.parcelas ? d.parcelas : null) + l('Parcelas que faltam', ENGINE.restantesDaDivida(d))
    + l('Parcela atual', +d.parcela ? fmt(+d.parcela) : null) + l('Juros contratados', +d.juros ? String(d.juros).replace('.', ',') + '% a.a.' : null) + l('Situação', st ? st[1] : null);
}
function renderPatrimonio() {
  const el = document.getElementById('patrimonio'); if (!el || FASE !== 'patrimonio') return;
  const P = planoVista(), D = P.patrimonio || {}, f = ENGINE.faseDaVida(P), fase = f.fases ? f.fases[f.fase] : null, rolagem = el.scrollTop;
  const onde = fase ? ondeEsta(f) : null;
  // topo: a fase e as idades de cada fase, ao lado do vídeo
  const hero = `<div class="nota-card" style="justify-content:center;gap:16px"><div class="pf-rot">A sua fase da vida financeira</div>
    ${fase ? `<div class="pf-fase">${fase.nome}<small><b>${f.idade} anos</b>${f.fase > 0 && f.fase < 4 ? ' · ' + Math.round(f.progresso * 100) + '% desta fase' : ''} · liberdade financeira aos <b>${f.alvo} anos</b>${f.alvoDoPlano ? '' : ' (idade de referência)'}</small></div>${trilhaHtml(f)}`
      : `<div class="pf-nao">O seu consultor ainda não informou a idade em que você começou a trabalhar. Com ela, esta página mostra a sua fase da vida financeira e o patrimônio esperado para a sua idade.</div>`}</div>`;
  // a composição, classe a classe
  const its = (l, k, pref, extra) => (l || []).map((x, i) => Object.assign({ nome: x.nome || 'Sem nome', v: +x[k] || 0, chave: pref + i }, extra ? extra(x, i) : {})).sort((a, b) => b.v - a.v);
  const bensIt = its(D.bens, 'mercado', 'bem:', b => {
    const r = rendaDoBem(P, b), deve = +b.saldoDevedor > 0, st = SITUACAO[b.situacao], tit = ENGINE.titularidadeDoBem(P, b);
    const tags = (tit ? `<span class="pf-tag">${escH(tit.texto)}</span>` : '') + (deve ? `<span class="pf-tag${b.situacao === 'inadimplente' ? ' critico' : ''}">financiado${b.situacao === 'inadimplente' ? ' · inadimplente' : ''}</span>` : '') + (r ? `<span class="pf-tag renda">gera ${fmt(r.v)}/mês</span>` : '');
    const det = (deve ? dividaDet(b) : '') + (r ? `<span>Renda que gera</span><b>${fmt(r.v)}/mês</b>` : '');
    return { tags, det: det || null, st };
  });
  const divIt = (D.bens || []).map((b, i) => [b, b.nome || 'Financiamento', 'divb:' + i, 'financiamento']).filter(([b]) => +b.saldoDevedor > 0)
    .concat((D.dividas || []).map((d, i) => [d, d.nome || 'Dívida', 'div:' + i]))

    .sort((a, b) => b.v - a.v);
  const comp = `<div class="pf-comp"><h3>De onde vem o seu patrimônio</h3><div class="sub">Clique num bem ou numa dívida para ver o detalhe.</div><div class="pf-cols">
    ${colunaHtml('fin', 'Mercado financeiro', f.fin, its(D.financeiro, 'valor', 'fin:', x => x.tipo && ENGINE.TIPOS_FINANCEIRO[x.tipo] ? { tags: '<span class="pf-tag">' + ENGINE.TIPOS_FINANCEIRO[x.tipo].toLowerCase() + '</span>' } : {}), 'Nenhuma instituição informada.')}
    ${colunaHtml('part', 'Participações societárias', f.part, its(D.participacoes, 'valor', 'part:'), 'Nenhuma participação.')}
    ${colunaHtml('bens', 'Imóveis e outros bens', f.bens, bensIt, 'Nenhum bem informado.')}
    ${colunaHtml('div', 'Dívidas e financiamentos', f.dividas, divIt, 'Nenhuma dívida.')}</div></div>`;
  // como o esperado é calculado: as fases com as idades e os valores deste cliente
  const como = !fase ? '' : `<details class="pf-como"${PT_ABERTO.has('como') ? ' open' : ''} data-pt-como><summary>Como o patrimônio esperado é calculado</summary>
    <div class="txt">A vida de trabalho, dos ${f.comecou} aos ${f.alvo} anos, é dividida em nove partes: dois nonos de início de carreira, quatro de consolidação e três de plenitude. Em cada fase, o patrimônio esperado é o padrão de vida mensal (${fmt(f.padrao)}) multiplicado por um fator que cresce ao longo dela.</div>
    <table class="pf-tab"><thead><tr><th>Fase</th><th>Idades</th><th class="n">Fator</th><th class="n">Patrimônio esperado</th></tr></thead><tbody>
    ${f.fases.map((x, i) => `<tr class="${i === f.fase ? 'on' : ''}"><td>${x.nome}</td><td>${i === 0 ? 'até ' + anosTxt(x.ate) : i === 4 ? 'a partir de ' + anosTxt(x.de) : anosTxt(x.de) + ' a ' + anosTxt(x.ate)} anos</td><td class="n">${x.max ? (x.min === x.max ? vezes(x.min) : vezes(x.min) + ' a ' + vezes(x.max)) : '—'}</td><td class="n">${x.max ? (x.min === x.max ? fmt(f.padrao * x.min) : fmt(f.padrao * x.min) + ' a ' + fmt(f.padrao * x.max)) : '—'}</td></tr>`).join('')}</tbody></table></details>`;
  el.innerHTML = `<div class="rc">${cabPagina(paginaDe('patrimonio'), escH(CAPITULOS.find(c => c.id === 'patrimonio').sub))}<div class="rk-topo um">${hero}</div>
    ${idealHtml(f, fase, onde)}${comp}${como}${rodapeNav(paginaDe('patrimonio'))}</div>`;
  el.scrollTop = rolagem;
}

const prazoTxt = m => { const a = Math.floor(m / 12), r = m % 12; return !m ? '—' : (a ? a + (a === 1 ? ' ano' : ' anos') : '') + (a && r ? ' e ' : '') + (r ? r + (r === 1 ? ' mês' : ' meses') : ''); };
// apresentação da Nord: a necessidade em destaque e, embaixo, a memória de cálculo de A a H
function seguroHtml(id, s) {
  const vida = id === 'familia', varios = s.pessoas.length > 1;
  return s.pessoas.map(p => {
    const c = p[vida ? 'vida' : 'acidentes'], nome = escH(p.nome);
    const cab = `<h4>${varios ? nome : 'Seu seguro'} ${stHtml(c.status)}<small>${varios ? Math.round(p.participacao * 100) + '% da renda da família · ' : ''}${p.idade != null ? p.idade + ' anos' : 'idade não informada'}</small></h4>`;
    if (c.status === 'pendente') return `<div class="seg-p">${cab}<div class="expl" style="margin:0">Falta a idade de ${nome} para calcular.</div></div>`;
    if (c.semDependentes) return `<div class="seg-p">${cab}<div class="seg-nao">Sem dependentes financeiros, o seguro de vida não é considerado essencial${varios ? ' para ' + nome : ''}.</div></div>`;
    if (c.necessidade <= 0) return `<div class="seg-p">${cab}<div class="seg-nao">Com base nos dados do plano, esta cobertura não é considerada essencial${varios ? ' para ' + nome : ''}: o patrimônio e as rendas já cobrem a necessidade.</div></div>`;
    const l = (letra, nome, v, nota, sub) => `<div class="seg-l${sub ? ' sub' : ''}"><span>(${letra}) ${nome}${nota ? `<small>${nota}</small>` : ''}</span><b>${v}</b></div>`;
    return `<div class="seg-p">${cab}
      <div class="seg-tot"><span>Necessidade estimada de cobertura de ${vida ? 'vida' : 'acidentes'}<small>${vida ? '(I) = G + H − E' : '(H) = G − E'}</small></span><b>${fmt(c.necessidade)}</b></div>
      ${l('A', 'Renda que deseja proteger', fmt(c.A))}${l('B', 'Renda passiva atual', fmt(c.B))}${l('C', 'Renda protegida atual', fmt(c.C), vida ? 'pensão do INSS' : 'INSS por invalidez')}
      ${l('D', 'Renda a cobrir', fmt(c.D), '(A − B − C)', true)}${l('E', 'Patrimônio financeiro atual', fmt(c.E))}
      ${l('F', 'Prazo de consumo', prazoTxt(c.F), vida ? 'até o último dependente' : 'até os 95 anos')}${l('G', 'Patrimônio necessário a cobrir', fmt(c.G))}
      ${vida ? l('H', 'Necessidade de sucessão', fmt(c.H), s.sucessaoPct.toLocaleString('pt-BR') + '% da parte no patrimônio') : ''}
      <div class="kpis"><div class="kpi"><span>Cobertura atual</span><b>${fmt(c.atual)}</b></div><div class="kpi"><span>Falta</span><b class="${c.falta > 0 ? 'low' : 'good'}">${c.falta > 0 ? fmt(c.falta) : 'nada'}</b></div></div>
      <div class="barra"><i style="width:${Math.min(100, c.atual / c.necessidade * 100)}%;background:${COR_ST[c.status]}"></i></div></div>`;
  }).join('') + '<div class="seg-nota">Os valores são estimados com base nas informações do plano. É necessário consultar um profissional de seguros para validar estas contas e avaliar o cenário atual.</div>';
}
// régua da reserva: mínima, aceitável e ideal, e onde a família está (sim: são os valores simulados pelo cliente)
function reservaHtml(P, sim) {
  const x = ENGINE.avaliaRiscos(P).itens.reserva;
  if (x.ideal == null) return '<div class="expl">O seu consultor ainda não definiu a reserva ideal.</div>';
  const topo = Math.max(x.ideal, x.atual || 0) * 1.08, p = v => Math.min(100, v / topo * 100);
  return `<div class="kpis"><div class="kpi"><span>Custo de vida mensal</span><b>${fmt(x.custo)}</b></div><div class="kpi"><span>Reserva mínima (40%)</span><b>${fmt(x.minima)}</b></div><div class="kpi"><span>Reserva aceitável (70%)</span><b>${fmt(x.aceitavel)}</b></div><div class="kpi"><span>Reserva ideal${x.alvoProprio ? ' (alvo)' : ''}</span><b>${fmt(x.ideal)}</b></div><div class="kpi"><span>${ENGINE.casalDe(P) ? 'Vocês têm' : 'Você tem'} hoje</span><b class="${x.status === 'ok' ? 'good' : x.status === 'critico' ? 'low' : ''}">${x.atual != null ? fmt(x.atual) : '—'}</b></div></div>
    <div class="degraus"><div class="trilho"></div>${x.atual != null ? `<div class="cheio" style="width:${p(x.atual)}%"></div><div class="voce" style="left:${p(x.atual)}%">você: ${fmt(x.atual)}</div>` : ''}
      ${[['mínima', x.minima], ['aceitável', x.aceitavel], ['ideal', x.ideal]].map(([n, v]) => `<div class="marca" style="left:${p(v)}%"><span>${n}<small>R$ ${fmtC(v)}</small></span></div>`).join('')}</div>
    ${sim ? `<div class="muted" style="font-size:12px;color:var(--nl-navy-900)">Simulação: ${stHtml(x.status)} ${x.status === 'ok' ? 'com estes valores a reserva fica em dia.' : 'faltariam ' + fmt(x.ideal - (x.atual || 0)) + ' para o ideal.'}</div>` : ''}`;
}
document.getElementById('riscos').addEventListener('click', e => {
  const t = e.target.closest('[data-risco]');
  if (t) { const d = document.getElementById('rk-' + t.dataset.risco); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } return; }

// ===================== CAPÍTULO 3: OTIMIZAÇÃO TRIBUTÁRIA =====================
// Quatro páginas, cada uma com o mesmo roteiro: no alto, quanto o cliente economiza e o vídeo do consultor; depois, hoje
// e o recomendado lado a lado, na mesma escala; o que muda; e, recolhida, a conta. As contas são do motor
// (irDaFamilia, retiradaDosSocios, sucessao, simulaPrevidencia) e os dados, do consultor (plan.tributario).
// A previdência tem um simulador: o cliente mexe nos valores à vontade, sem gravar nada (SIMP).
var SIMP = null, TB_ABERTO = {};
const fmtS = v => (v < -0.5 ? '− ' : '') + fmt(Math.abs(v));
const pctTxt = (v, d) => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: d == null ? 1 : d }) + '%';
const nomes = l => l.length <= 1 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' e ' + l[l.length - 1];
// A escada (a mesma ideia do patrimônio): cada passo começa onde o anterior terminou e o negativo volta, em vermelho;
// o total começa do zero. topo é o fim da escala, igual nas duas colunas para comparar hoje e o recomendado.
function escadaTb(passos, topo, cls) {
  let acc = 0; const x = v => Math.max(0, v) / (topo || 1) * 100;
  return `<div class="tb-esc${cls ? ' ' + cls : ''}">${passos.map((p, i) => {
    let de, ate, menos = false;
    if (p.total) { de = 0; ate = p.v; } else if (p.v >= 0 && !p.menos) { de = acc; ate = acc + p.v; acc = ate; } else { de = acc - Math.abs(p.v); ate = acc; acc = de; menos = true; }
    const txt = p.total || i === 0 ? fmt(p.v) : (menos ? '− ' : '+ ') + fmt(Math.abs(p.v));
    return `<div class="tb-rot${p.total ? ' forte' : ''}">${p.rot}</div><div class="tb-tr"><i class="tb-b${menos ? ' menos' : ''}${i && !p.total ? ' liga' + (menos ? ' dir' : '') : ''}" style="left:${x(de)}%;width:${x(ate) - x(de)}%${menos ? '' : ';background:' + p.cor}"></i><span class="tb-v" style="left:${x(Math.max(de, ate))}%">${txt}</span></div>`;
  }).join('')}</div>`;
}
const notasTb = l => l.length ? `<ul class="tb-notas">${l.map(t => `<li>${t}</li>`).join('')}</ul>` : '';
const semDadosTb = (pg, texto) => `<div class="rk-topo um">${heroTb(pg, null, null, texto)}</div>`;
// o cartão do alto: o tema, a economia em destaque e de quanto para quanto
function heroTb(pg, eco, de, vazio, sub, semEco) {
  return `<div class="nota-card tb-hero"><div class="tb-hero-a">
    ${vazio ? `<div class="pf-nao">${vazio}</div>` : `<div class="tb-eco${eco > 0.5 ? '' : ' neutro'}">${eco > 0.5 ? fmt(eco) : semEco || 'Sem economia'}<small>${sub}</small></div>`}</div>${vazio ? '' : de || ''}</div>`;
}
const deParaTb = (a, b, extra) => `<div class="tb-de">de <b>${fmt(a)}</b> para <b>${fmt(b)}</b>${a > 0 && b < a ? `<span class="tb-menos">−${pctTxt((a - b) / a, 0)}</span>` : ''}${extra ? `<span class="tb-extra">${extra}</span>` : ''}</div>`;
const comoTb = (id, titulo, corpo) => `<details class="pf-como"${TB_ABERTO[id] ? ' open' : ''} data-tb-como="${id}"><summary>${titulo}</summary>${corpo}</details>`;

// ---- Imposto de renda da família ----
function paginaIR(P, pg) {
  const r = ENGINE.irDaFamilia(P);
  if (!r) return semDadosTb(pg, 'O seu consultor ainda está preparando esta página: aqui vai aparecer o imposto de renda da família hoje e com a estratégia recomendada.');
  const a = r.atual, b = r.recomendada, ano = ENGINE.IR.ano;
  const deps = ((P.riscos || {}).dependentes || []).map(d => d.nome || 'dependente'), depsTxt = nomes(deps.length ? deps : [r.nDeps + ' dependentes']);
  const topo = Math.max(1, ...a.pessoas.map(x => x.devido), ...b.pessoas.map(x => x.devido));
  // nome e imposto na primeira linha, a barra na segunda, as marcas e a alíquota na terceira: as barras ficam na mesma altura
  const pes = (p, antes) => `<div class="tb-pes"><div class="l"><b>${escH(p.nome)}</b><span class="v">${fmt(p.devido)}</span></div><div class="tb-barra"><i style="width:${p.devido / topo * 100}%"></i></div>
      <div class="d"><span class="tg"><span class="pf-tag${antes && antes.modelo !== p.modelo ? ' renda' : ''}">declaração ${p.modelo}</span>${p.deps ? `<span class="pf-tag">${p.deps === 1 ? '1 dependente' : p.deps + ' dependentes'}</span>` : ''}${p.pgbl ? '<span class="pf-tag ok">PGBL</span>' : ''}</span><small>${pctTxt(p.aliq)} da renda tributável de ${fmt(p.rend)}</small></div></div>`;
  const tot = c => `<div class="tb-pes total"><div class="l"><b>Família</b><span class="v">${fmt(c.total)}</span></div><div class="d"><small>imposto devido no ano · ${pctTxt(c.rend ? c.total / c.rend : 0)} da renda</small></div></div>`;
  // o que muda nos lançamentos de cada pessoa
  const muda = [];
  if (r.nDeps && a.depsCom !== b.depsCom && b.pessoas[b.depsCom]) muda.push(`<b>${escH(depsTxt)}</b> ${deps.length > 1 ? 'passam' : 'passa'} a ser dependente${deps.length > 1 ? 's' : ''} na declaração de <b>${escH(b.pessoas[b.depsCom].nome)}</b>, que paga uma alíquota maior: cada dependente deduz ${fmt(ENGINE.IR.dependente)} da base de cálculo.`);
  b.pessoas.forEach((p, i) => {
    const q = a.pessoas[i];
    if (p.pgbl > q.pgbl) muda.push(`Um <b>PGBL de ${fmt(p.pgbl)} no ano</b> para <b>${escH(p.nome)}</b> (${fmt(p.pgbl / 12)} por mês)${Math.abs(p.pgbl - p.lim.pgbl) < 12 ? ', o limite de 12% da renda tributável' : ''}. O dinheiro continua seu: é um investimento de longo prazo que deduz da base hoje.`);
    if (p.ded.medicas !== q.ded.medicas) muda.push(`As despesas médicas de <b>${escH(p.nome)}</b> vão de ${fmt(q.ded.medicas)} para ${fmt(p.ded.medicas)}.`);
    if (p.ded.instrucao !== q.ded.instrucao) muda.push(`As despesas com instrução de <b>${escH(p.nome)}</b> vão de ${fmt(q.ded.instrucao)} para ${fmt(p.ded.instrucao)}.`);
    if (p.modelo !== q.modelo) muda.push(`A declaração de <b>${escH(p.nome)}</b> passa de ${q.modelo} para ${p.modelo}${p.modelo === 'completa' ? ': as deduções passam a valer mais que o desconto de 20%' : ''}.`);
    if (p.sobraPgbl > 0) muda.push(`${fmt(p.sobraPgbl)} do PGBL de ${escH(p.nome)} passam do limite de 12% e não deduzem.`);
  });
  // a tabela dos lançamentos: hoje e recomendado, por pessoa; o que muda fica destacado
  const linhas = [['Dependentes', p => p.deps || '—', true], ['Despesas médicas', p => p.ded.medicas ? fmt(p.ded.medicas) : '—'], ['Instrução', p => p.ded.instrucao ? fmt(p.ded.instrucao) : '—'],
    ['PGBL no ano', p => p.pgbl ? fmt(p.pgbl) : '—'], ['Modelo da declaração', p => p.modelo], ['Imposto devido', p => fmt(p.devido)]]
    .filter(([n, f, sempre]) => sempre && r.nDeps || n === 'Modelo da declaração' || n === 'Imposto devido' || a.pessoas.concat(b.pessoas).some(p => f(p) !== '—'));
  const tabela = `<table class="pf-tab tb-lanc"><thead><tr><th></th>${a.pessoas.map((p, i) => `<th class="n${i ? ' p1' : ''}" colspan="2">${escH(p.nome)}</th>`).join('')}</tr>
    <tr><th>Lançamento</th>${a.pessoas.map((p, i) => `<th class="n${i ? ' p1' : ''}">Hoje</th><th class="n">Recomendado</th>`).join('')}</tr></thead><tbody>
    ${linhas.map(([n, f]) => `<tr${n === 'Imposto devido' ? ' class="tot"' : ''}><td>${n}</td>${a.pessoas.map((p, i) => { const x = f(p), y = f(b.pessoas[i]); return `<td class="n${i ? ' p1' : ''}">${x}</td><td class="n${x !== y ? ' mudou' : ''}">${y}</td>`; }).join('')}</tr>`).join('')}</tbody></table>`;
  const conta = (c, t) => `<tr class="cab"><td colspan="${c.pessoas.length + 1}">${t}</td></tr>` + [['Rendimentos tributáveis', p => fmt(p.rend)], ['Deduções (completa) ou desconto de 20% (simplificada)', p => '− ' + fmt(p.modelo === 'completa' ? p.totDed : p.desconto)],
    ['Base de cálculo', p => fmt(p.base)], ['Imposto pela tabela', p => fmt(p.bruto)], ['Redução de ' + ano + ' (Lei 15.270)', p => p.reducao ? '− ' + fmt(p.reducao) : '—'], ['Imposto devido', p => fmt(p.devido)]]
    .map(([n, f]) => `<tr><td>${n}</td>${c.pessoas.map(p => `<td class="n">${f(p)}</td>`).join('')}</tr>`).join('');
  const otimizada = !(r.economia > 0.5);   // nenhuma mudança diminui o imposto: mostra só hoje
  const como = comoTb('ir', 'Como o imposto é calculado', `<div class="txt">O imposto sai da tabela progressiva de ${ano} sobre a base de cálculo, e a redução da Lei 15.270 zera o imposto de quem tem até R$ 60 mil de rendimentos tributáveis no ano, diminuindo até R$ 88.200. Cada pessoa fica com o modelo de menor imposto: o simplificado desconta 20% da renda (até ${fmt(ENGINE.IR.simplificadoLimite)}); o completo desconta o INSS, ${fmt(ENGINE.IR.dependente)} por dependente, a instrução (até ${fmt(ENGINE.IR.instrucao)} por pessoa), as despesas médicas (sem limite) e o PGBL (até 12% da renda tributável, para quem contribui ao INSS). O PGBL adia o imposto: no resgate, ele paga imposto de renda sobre o valor total, a 10% depois de 10 anos na tabela regressiva.</div>
    <div class="rola"><table class="pf-tab"><thead><tr><th></th>${a.pessoas.map(p => `<th class="n">${escH(p.nome)}</th>`).join('')}</tr></thead><tbody>${conta(a, 'Hoje')}${otimizada ? '' : conta(b, 'Recomendado')}</tbody></table></div>`);
  if (otimizada) return `<div class="rk-topo um">${heroTb(pg, 0, `<div class="tb-de">imposto devido em ${ano}: <b>${fmt(a.total)}</b></div>`, null, 'Nenhuma mudança nos dependentes, nas despesas dedutíveis ou no PGBL diminui o imposto de renda da família.', 'A sua estratégia atual já está otimizada')}</div>
    <div class="tb-card"><h3>O imposto de cada um</h3><div class="sub">Imposto devido no ano de ${ano}, na declaração de ${ano + 1}. As barras estão na mesma escala.</div><div class="tb-um" style="grid-template-columns:repeat(${a.pessoas.length},1fr)">${a.pessoas.map(p => pes(p)).join('')}${tot(a)}</div></div>
    <div class="tb-card"><h3>Os lançamentos de hoje</h3><table class="pf-tab tb-lanc"><thead><tr><th>Lançamento</th>${a.pessoas.map(p => `<th class="n">${escH(p.nome)}</th>`).join('')}</tr></thead><tbody>
      ${linhas.map(([n, f]) => `<tr${n === 'Imposto devido' ? ' class="tot"' : ''}><td>${n}</td>${a.pessoas.map(p => `<td class="n">${f(p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${como}`;
  return `<div class="rk-topo um">${heroTb(pg, r.economia, deParaTb(a.total, b.total), null, 'por ano a menos de imposto de renda, com a estratégia recomendada')}</div>
    <div class="tb-card"><h3>O imposto de cada um, hoje e com a estratégia recomendada</h3><div class="sub">Imposto devido no ano de ${ano}, na declaração de ${ano + 1}, com os mesmos rendimentos de hoje. As barras estão na mesma escala.</div>
      <div class="tb-grade"><h4>Hoje</h4><h4>Recomendado</h4>${a.pessoas.map((p, i) => pes(p) + pes(b.pessoas[i], p)).join('')}${tot(a)}${tot(b)}</div></div>
    <div class="tb-card"><h3>O que muda nos lançamentos</h3>${notasTb(muda) || '<div class="sub">Nada muda: a estratégia recomendada é a de hoje.</div>'}${tabela}</div>${como}`;
}

// ---- Pró-labore e dividendos ----
const NOME_REGIME = Object.fromEntries(ENGINE.REGIMES);
function paginaProlabore(P, pg) {
  const r = ENGINE.retiradaDosSocios(P);
  if (!r) return semDadosTb(pg, 'O seu consultor ainda está preparando esta página: aqui vai aparecer a melhor forma de retirar dinheiro da sua empresa.');
  const s0 = r.socios[0], extra = r.socios.length === 1 ? 'retirando os mesmos ' + fmt(s0.atual.total) + ' por mês' : '';
  const anoA = r.socios.reduce((a, s) => a + s.atual.ano, 0), anoB = r.socios.reduce((a, s) => a + s.rec.ano, 0);
  const socio = s => {
    const ambos = k => s.atual[k] > 0.5 || s.rec[k] > 0.5;
    const topo = Math.max(1, s.atual.total), lado = (tit, x) => `<div class="tb-col"><h4>${tit}</h4>${escadaTb([
      { rot: 'Pró-labore', v: x.pro, cor: '#9FB0C4' }, { rot: 'Dividendos', v: x.div, cor: '#C7D1DD' },
      { rot: 'INSS (11%)', v: -x.inss, menos: true }].concat(ambos('irrf') ? [{ rot: 'IR na fonte', v: -x.irrf, menos: true }] : []).concat(ambos('divIR') ? [{ rot: 'IR sobre dividendos', v: -x.divIR, menos: true }] : [])
      .concat([{ rot: 'No seu bolso', v: x.liquido, cor: '#4B6584', total: true }]), topo)}
      <div class="tb-rodape"><span>Impostos e INSS no ano</span><b>${fmt(x.ano)}</b></div>${ambos('patronal') ? `<div class="tb-rodape leve"><span>dos quais a empresa paga de INSS patronal</span><b>${fmt(12 * x.patronal)}</b></div>` : ''}${ambos('minimo') ? `<div class="tb-rodape leve"><span>imposto mínimo de quem recebe mais de R$ 600 mil no ano</span><b>${fmt(x.minimo)}</b></div>` : ''}</div>`;
    const notas = [`A retirada é a mesma, ${fmt(s.atual.total)} por mês: muda só quanto vem como pró-labore (${fmt(s.atual.pro)} → ${fmt(s.rec.pro)}) e quanto vem como dividendos (${fmt(s.atual.div)} → ${fmt(s.rec.div)}).`,
      `No seu bolso, ${fmtS(s.rec.liquido - s.atual.liquido).replace('R$', 'são R$')} a mais por mês${s.rec.patronal < s.atual.patronal ? `, e a empresa deixa de pagar ${fmt(12 * (s.atual.patronal - s.rec.patronal))} de INSS patronal no ano` : ''}.`,
      `A contribuição ao INSS cai de ${fmt(s.atual.inss)} para ${fmt(s.rec.inss)} por mês. A aposentadoria do INSS é calculada sobre o que você contribui: o seu consultor considera isso no plano da sua liberdade financeira.`];
    if (s.rec.pro <= ENGINE.IR.salarioMinimo + 0.5) notas.push(`O pró-labore recomendado é o salário mínimo (${fmt(ENGINE.IR.salarioMinimo)}), o menor valor aceito para o sócio que trabalha na empresa.`);
    if (s.fatorR && s.fatorR.cai) notas.push(`<b>Atenção ao fator R:</b> com o pró-labore menor, a folha cai de ${pctTxt(s.fatorR.atual, 0)} para ${pctTxt(s.fatorR.rec, 0)} do faturamento, abaixo de 28%, e a empresa pode passar do Anexo III para o Anexo V do Simples, com imposto maior.`);
    if (s.rec.div > ENGINE.IR.dividendosIsentoMes) notas.push(`Dividendos acima de ${fmt(ENGINE.IR.dividendosIsentoMes)} por mês da mesma empresa têm 10% de imposto retido sobre o total.`);
    return `<div class="tb-card"><h3>${escH(s.nome)}${s.empresa ? ' · ' + escH(s.empresa) : ''}</h3><div class="sub">Retirada de ${fmt(s.atual.total)} por mês · ${escH(NOME_REGIME[s.regime] || '')}. Por mês, na mesma escala.</div>
      <div class="tb-dois">${lado('Hoje', s.atual)}${lado('Recomendado', s.rec)}</div>${notasTb(notas)}</div>`;
  };
  const como = comoTb('prolabore', 'Como a conta é feita', `<div class="txt">O pró-labore paga INSS de 11%, até o teto de ${fmt(ENGINE.IR.tetoINSS)}, e imposto de renda na fonte pela tabela mensal de ${ENGINE.IR.ano}, que zera até R$ 5 mil por mês. Fora do Simples Nacional (e no Anexo IV do Simples), a empresa paga ainda 20% de INSS patronal sobre ele. Os dividendos são isentos até ${fmt(ENGINE.IR.dividendosIsentoMes)} por mês da mesma empresa; acima disso, 10% ficam retidos. Quem recebe mais de R$ 600 mil no ano paga um imposto mínimo, de até 10%, descontado o que já pagou. A empresa precisa ter lucro apurado para distribuir os dividendos.</div>`);
  return `<div class="rk-topo um">${heroTb(pg, r.economia, deParaTb(anoA, anoB, extra), null, 'por ano a menos de impostos e INSS, mudando como você retira o dinheiro da empresa')}</div>
    ${r.socios.map(socio).join('')}${como}`;
}

// ---- Sucessão e ITCMD ----
function paginaSucessao(P, pg) {
  const s = ENGINE.sucessao(P), a = s.atual, b = s.recomendada;
  if (!(a.total > 0)) return semDadosTb(pg, 'O seu consultor ainda está preparando esta página: aqui vai aparecer quanto custa passar o patrimônio para a próxima geração.');
  const topo = Math.max(1, a.bens + a.part + a.inv, b.bens + b.part + b.inv, a.prev, b.prev);
  const lado = (tit, c) => `<div class="tb-col"><h4>${tit}</h4>${escadaTb([{ rot: 'Imóveis e outros bens', v: c.bens, cor: '#9FB0C4' }].concat(c.part ? [{ rot: 'Participações', v: c.part, cor: '#9FB0C4' }] : [])
      .concat([{ rot: 'Investimentos', v: c.inv, cor: '#9FB0C4' }]).concat(c.dividas ? [{ rot: 'Dívidas', v: -c.dividas }] : []).concat([{ rot: 'Entra no inventário', v: c.inventario, cor: '#4B6584', total: true }]), topo)}
    <div class="tb-sep"></div>${escadaTb([{ rot: 'Previdência', v: c.prev, cor: '#F6A06B', total: true }], topo)}
    <div class="tb-custo"><span>ITCMD e custos do inventário (${pctTxt(s.pct, 1)})</span><b>${fmt(c.custo)}</b></div>
    <div class="tb-rodape leve"><span>vai direto aos beneficiários, sem inventário</span><b>${fmt(c.prev)}</b></div></div>`;
  const notas = [`O patrimônio é o mesmo nos dois casos, ${fmt(a.total)}: muda só onde estão ${fmt(s.mover)} dos investimentos, que vão para a previdência.`,
    'A previdência (PGBL e VGBL) não entra no inventário: vai para os beneficiários que você indicar, em geral em poucas semanas, enquanto um inventário leva meses ou anos. Em 2024 o STF decidiu que o ITCMD não incide sobre ela.',
    `O custo da sucessão aqui é o ITCMD (${pctTxt(s.itcmd / 100, 1)}) mais os custos do inventário, como advogado, custas e cartório (${pctTxt(s.custos / 100, 1)}), sobre o que entra no inventário.`];
  const como = comoTb('sucessao', 'Como a conta é feita', `<div class="txt">Entram no inventário os imóveis e outros bens (pelo valor de mercado), as participações nas empresas e os investimentos, menos as dívidas. Sobre esse valor incidem o ITCMD, o imposto estadual sobre heranças, e os custos do inventário. A previdência fica de fora. A conta considera o patrimônio inteiro sendo transmitido: num casal, a meação do cônjuge e o regime de bens mudam a base, e cada estado tem a sua alíquota (a reforma tributária torna o ITCMD progressivo, até 8%). O seu consultor confere os números com o advogado da família.</div>`);
  return `<div class="rk-topo um">${heroTb(pg, s.economia, deParaTb(a.custo, b.custo, s.mover ? 'levando ' + fmt(s.mover) + ' para a previdência' : ''), null, 'a menos de custos na sucessão do seu patrimônio')}</div>
    <div class="tb-card"><h3>Como o patrimônio passa para a próxima geração</h3><div class="sub">O que entra no inventário paga o ITCMD e os custos; a previdência vai direto aos beneficiários. Hoje e com a recomendação, na mesma escala.</div>
      <div class="tb-dois">${lado('Hoje', a)}${lado('Recomendado', b)}</div>${notasTb(notas)}</div>${como}`;
}

// ---- Previdência no longo prazo: o simulador ----
const CAMPOS_PREV = [['inicial', 'Valor inicial', 0, 3000000, 10000, 'reais'], ['aporte', 'Aporte por mês', 0, 30000, 100, 'reais'], ['anos', 'Prazo', 5, 40, 1, 'anos'],
  ['rent', 'Rentabilidade ao ano', 4, 16, 0.5, 'pct'], ['trocas', 'Trocas de estratégia no período', 0, 10, 1, 'vezes']];
const valCampoPrev = (t, v) => t === 'reais' ? fmt(v) : t === 'anos' ? v + ' anos' : t === 'pct' ? String(v).replace('.', ',') + '%' : v === 1 ? '1 vez' : v + ' vezes';
function graficoPrev(r) {
  const W = 560, H = 230, L = 84, R = 92, T = 14, B = 26, N = r.N, max = Math.max(1, ...r.prev.serie, ...r.comum.serie);
  const x = m => L + m / N * (W - L - R), y = v => T + (1 - v / max) * (H - T - B);
  const linha = s => s.map((v, m) => (m ? 'L' : 'M') + x(m + 1).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const passo = N / 12 > 20 ? 10 : 5, anos = []; for (let a = passo; a * 12 <= N; a += passo) anos.push(a);
  const grade = [0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" class="tb-g"/><text x="${L - 8}" y="${y(max * f) + 4}" text-anchor="end" class="tb-gt">${fmtK(max * f)}</text>`).join('');
  const fimP = r.prev.serie[N - 1], fimC = r.comum.serie[N - 1], afast = Math.abs(y(fimP) - y(fimC)) < 16 ? 8 : 0;
  return `<svg viewBox="0 0 ${W} ${H}" class="tb-graf">${grade}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="tb-g forte"/>
    ${anos.map(a => `<text x="${x(a * 12)}" y="${H - 6}" text-anchor="middle" class="tb-gt">${a} anos</text>`).join('')}
    <path d="${linha(r.comum.serie)}" class="tb-l comum"/><path d="${linha(r.prev.serie)}" class="tb-l prev"/>
    <text x="${W - R + 8}" y="${y(fimP) + 4 - afast}" class="tb-fim prev">${fmtK(fimP)}</text><text x="${W - R + 8}" y="${y(fimC) + 4 + afast}" class="tb-fim">${fmtK(fimC)}</text></svg>`;
}
function resultadoPrev(r, o) {
  const passos = [{ rot: 'Investimento comum', v: r.comum.final, cor: '#9FB0C4' }].concat(r.passos.map(([n, v]) => ({ rot: n, v, cor: '#FCD9C2' }))).concat([{ rot: 'Previdência', v: r.prev.final, cor: '#F6A06B', total: true }]);
  let acc = r.comum.final, mx = acc; r.passos.forEach(p => { acc += p[1]; mx = Math.max(mx, acc); });
  const topo = Math.max(1, mx, r.prev.final);
  return { graf: graficoPrev(r), esc: escadaTb(passos, topo, 'largo'), num: { ganho: r.ganho, comum: r.comum.aliqMedia, prev: r.prev.aliqMedia, aportado: r.aportado } };
}
function paginaPrevidencia(P, pg) {
  const base = (P.tributario || {}).previdencia;
  if (!base) return semDadosTb(pg, 'O seu consultor ainda está preparando esta página: aqui vai aparecer quanto a previdência rende a mais que um investimento comum no longo prazo.');
  const o = Object.assign({ aliqComum: 15, comeCotas: true, taxaComum: 0.8, taxaPrev: 0.8 }, base, SIMP || {}), r = ENGINE.simulaPrevidencia(o), z = resultadoPrev(r, o), anos = Math.round(r.N / 12);
  const campos = CAMPOS_PREV.map(([k, n, mi, ma, st, t]) => `<label class="tb-campo"><span>${n}<b data-prev-v="${k}">${valCampoPrev(t, +o[k] || 0)}</b></span><input type="range" min="${mi}" max="${ma}" step="${st}" value="${+o[k] || 0}" data-prev="${k}" style="--p:${((+o[k] || 0) - mi) / (ma - mi) * 100}%"></label>`).join('');
  return `<div class="rk-topo um"><div class="nota-card tb-hero"><div class="tb-hero-a">
      <div class="tb-eco${r.ganho > 0.5 ? '' : ' neutro'}" id="prevEco">${r.ganho > 0.5 ? fmt(r.ganho) : 'Sem ganho'}<small id="prevEcoT">a mais na previdência em ${anos} anos, já descontado o imposto, comparada a um investimento comum</small></div></div>
      <div class="tb-de" id="prevDe">imposto médio de <b>${pctTxt(z.num.comum)}</b> no investimento comum e de <b>${pctTxt(z.num.prev)}</b> na previdência</div></div></div>
    <div class="rk-topo"><div class="tb-card tb-sim"><h3>Simule</h3><div class="sub">Mude os valores e veja o efeito. Nada aqui muda o seu plano.</div>${campos}
        <label class="tb-campo"><span>Investimento comum</span><select data-prev="comeCotas"><option value="sim"${o.comeCotas !== false ? ' selected' : ''}>Fundo com come-cotas (renda fixa, multimercado)</option><option value="nao"${o.comeCotas === false ? ' selected' : ''}>Fundo de ações (sem come-cotas)</option></select></label>
        <button class="btn btn-secondary btn-small" data-prev-limpar${SIMP ? "" : " hidden"}>Voltar aos valores do plano</button></div>
      <div class="tb-card"><h3>Quanto ${ENGINE.casalDe(P) ? 'vocês teriam' : 'você teria'}, já descontado o imposto</h3><div class="sub">Se resgatasse tudo em cada momento, pagando o imposto que falta.</div>
        <div class="tb-leg"><span><i style="background:#FA7A35"></i>Previdência (VGBL, tabela regressiva)</span><span><i style="background:#9FB0C4"></i>Investimento comum</span></div><div id="prevGraf">${z.graf}</div></div></div>
    <div class="tb-card"><h3>De onde vem a diferença</h3><div class="sub">Do valor do investimento comum ao da previdência, ao fim de <span id="prevAnos">${anos}</span> anos, com <span id="prevAport">${fmt(r.aportado)}</span> aportados.</div><div id="prevEsc">${z.esc}</div>
      ${notasTb(['<b>Sem come-cotas:</b> nos fundos comuns, o imposto é cobrado a cada seis meses e deixa de render; na previdência, ele só é pago no resgate.',
        '<b>Trocas de estratégia:</b> mudar de renda fixa para multimercado ou ações, num investimento comum, é resgatar e pagar o imposto; na previdência é uma portabilidade, sem imposto.',
        '<b>Alíquota menor:</b> na tabela regressiva, o imposto cai de 35% (até 2 anos) para 10% depois de 10 anos. Para prazos curtos, a previdência pode pagar mais: ela vale para o longo prazo.'])}</div>
    ${comoTb('previdencia', 'Como a conta é feita', `<div class="txt">A simulação é mês a mês, com a mesma rentabilidade nos dois (${String(o.rent).replace('.', ',')}% ao ano, menos a taxa de administração de ${String(o.taxaComum).replace('.', ',')}% no investimento comum e de ${String(o.taxaPrev).replace('.', ',')}% na previdência). No investimento comum, o come-cotas leva ${o.aliqComum}% do rendimento em maio e novembro, o resgate cobra de 22,5% (até seis meses) a ${o.aliqComum}% (depois de dois anos), e cada troca de estratégia é um resgate que recomeça a contar o prazo. Na previdência (VGBL), cada aporte paga no resgate pela tabela regressiva, conforme o tempo que ficou investido, e só sobre o rendimento. No PGBL, o imposto do resgate é sobre o valor total, em troca da dedução de até 12% da renda no imposto de renda de hoje.</div>`)}`;
}
// o simulador: só o resultado é redesenhado, para o controle não perder o foco
function atualizaPrev() {
  const P = planoVista(), o = Object.assign({ aliqComum: 15, comeCotas: true, taxaComum: 0.8, taxaPrev: 0.8 }, (P.tributario || {}).previdencia, SIMP || {}), r = ENGINE.simulaPrevidencia(o), z = resultadoPrev(r, o), g = id => document.getElementById(id);
  if (!g('prevGraf')) return;
  g('prevGraf').innerHTML = z.graf; g('prevEsc').innerHTML = z.esc; g('prevAnos').textContent = Math.round(r.N / 12); g('prevAport').textContent = fmt(r.aportado);
  g('prevEco').firstChild.textContent = r.ganho > 0.5 ? fmt(r.ganho) : 'Sem ganho'; g('prevEco').classList.toggle('neutro', !(r.ganho > 0.5));
  g('prevEcoT').textContent = 'a mais na previdência em ' + Math.round(r.N / 12) + ' anos, já descontado o imposto, comparada a um investimento comum';
  g('prevDe').innerHTML = `imposto médio de <b>${pctTxt(z.num.comum)}</b> no investimento comum e de <b>${pctTxt(z.num.prev)}</b> na previdência`;
  CAMPOS_PREV.forEach(([k, , , , , t]) => { const b = document.querySelector(`[data-prev-v="${k}"]`); if (b) b.textContent = valCampoPrev(t, +o[k] || 0); });
}
function renderTributos() {
  const el = document.getElementById('tributos'); if (!el || !PAGINAS_TRIB.includes(FASE)) return;
  const pg = paginaDe(FASE), P = planoVista(), rolagem = el.scrollTop;
  const corpo = FASE === 'ir' ? paginaIR(P, pg) : FASE === 'prolabore' ? paginaProlabore(P, pg) : FASE === 'sucessao' ? paginaSucessao(P, pg) : paginaPrevidencia(P, pg);
  el.innerHTML = `<div class="rc">${cabPagina(pg, SUB_TRIB[FASE])}${corpo}${rodapeNav(pg)}</div>`; el.scrollTop = rolagem;
}
const SUB_TRIB = { ir: 'Como declarar o imposto de renda da família para pagar o menor imposto, dentro da lei.',
  prolabore: 'Quanto retirar da empresa como pró-labore e quanto como dividendos para pagar menos imposto e INSS.',
  sucessao: 'Quanto custaria passar o patrimônio para a próxima geração e como diminuir esse custo.',
  previdencia: 'Quanto o investimento de longo prazo rende a mais na previdência do que num investimento comum.' };
document.getElementById('tributos').addEventListener('input', e => {
  const k = e.target.dataset.prev; if (!k) return;
  if (e.target.type === 'range') e.target.style.setProperty('--p', (e.target.value - e.target.min) / (e.target.max - e.target.min) * 100 + '%');
  SIMP = Object.assign({}, SIMP, { [k]: k === 'comeCotas' ? e.target.value === 'sim' : +e.target.value });
  const l = document.querySelector('[data-prev-limpar]'); if (l) l.hidden = false; atualizaPrev();
});
document.getElementById('tributos').addEventListener('click', e => { if (e.target.closest('[data-prev-limpar]')) { SIMP = null; renderTributos(); } });
document.getElementById('tributos').addEventListener('toggle', e => { const d = e.target.dataset && e.target.dataset.tbComo; if (d) TB_ABERTO[d] = e.target.open; }, true);

BASE = baseDe(PLANO); PROP = lerProposta(); respostaNoPlano();
mostraFase(FASE);
if (temAlteracoes()) aplicaVista(); else desenhaPropBar();
updateStats(); setPlayLabel(); requestAnimationFrame(frame);
</script>
</body>
</html>
